r Brand Day 5-7/1 ⟦pr⟧(p.49)⟦/pr⟧: GMV +724% và store traffic +260% so với ngày thường; 50M+ lượt xem live; 200+ video mới; 15K+ người mua mới; 28,7K đơn; 100+ KOL\n• L'Oréal Paris livestream factory ⟦pr⟧(p.50)⟦/pr⟧: GMV affiliate 255 triệu VNĐ, đạt 127% mục tiêu; 175 creator (145% mục tiêu); 175 video teaser, 261 phiên live (15-21/10); triển khai trong 2 ngày kể từ khi Brand xác nhận","note":"","items":[{"id":"A3.3.4-01","name":"Pain points của Brand","text":"Ba pain points của Brand và giải pháp của OnPoint:\n• Tốn thời gian và nguồn lực quản lý, liên hệ 1:1, đào tạo creator > OnPoint đại diện Brand làm việc với creator và TikTok, kết nối nhiều creator và đào tạo về sản phẩm\n• Creator không hợp với Brand, khó xác định creator khớp tinh thần Brand > OnPoint nghiên cứu sản phẩm và tinh thần Brand, đề xuất danh sách ngắn theo từng phân khúc\n• Phí booking cao, khó thương lượng, không đảm bảo doanh thu (phí booking cho một Brand cao hơn nhiều so với gộp nhiều Brand) > OnPoint thiết kế nhiều lựa chọn (danh mục creator, mức giá, loại live mix brand hoặc độc quyền) và có giải pháp nếu doanh thu không đạt mục tiêu","src":"Cred","where":"Credential p.43"},{"id":"A3.3.4-02","name":"Mạng lưới MCN và creator","text":"• 30+ MCN/agency đối tác (ví dụ me.live, Social Elite, House of Deera, MCV Group, Accesstrade)\n• Creator OnPoint sở hữu 19,000+: 10+ Super Top/Mega, 50+ Macro, 150+ Middle, khoảng 19,000 Micro/Nano, mọi ngành hàng\n• Nhóm creator mạnh: Health & Beauty; Mom Kid Baby, FMCG\n• Bốn đối tác chiến lược: Shopee (tăng trưởng doanh thu), Lazada (công nghệ, giao nhanh, thanh toán đa dạng), TikTok (đối tác đang lên: multi-channel, e-commerce, social commerce), MCN/Agency (phát triển mạng lưới và quản lý influencer; p.45)","src":"Cred","where":"Credential p.44, p.45"},{"id":"A3.3.4-03","name":"Creator tiers và phí","text":"• Mega (1M+ follower): tạo nhận biết đại chúng; phí booking\n• Macro (100K-1M): kể chuyện đời thường, tạo sự liên quan; booking + hoa hồng\n• Mid-tier/Micro (50K-100K và 10K-50K): người dùng nổi tiếng, tương tác và cân nhắc cao; booking + hoa hồng\n• Expert (1K-10K): hướng dẫn chi tiết, tạo uy tín; booking + hoa hồng\n• Nano KOL (1K-10K): người dùng bình thường, thúc đẩy ý định mua nhưng ít uy tín; chỉ hoa hồng\n• Community groups (10K+): tạo thảo luận lớn, minigame thúc đẩy bán; booking + hoa hồng\nOpen affiliate (ai cũng gắn link, hoa hồng cơ bản) và Target affiliate (creator do Brand chọn, theo brief, hoa hồng cao hơn hoặc kèm phí booking).","src":"Cred + Đã có","where":"Credential p.46; Bản v1: B3.3"},{"id":"A3.3.4-04","name":"Targetplan và TAP","text":"• Targetplan: Brand chọn creator, sản phẩm và mức hoa hồng; khi creator chấp nhận thì thêm sản phẩm vào livestream, video ngắn hoặc showcase. Đối tượng: celeb, influencer, Mega/Macro/Middle KOL/KOC từ 100K follower. Hoa hồng khuyến nghị 12%-15%\n• TAP (TikTok Affiliate Partners): đối tác chính thức của TikTok Shop kết nối Seller/Brand với creator; cho phép hợp tác creator quy mô lớn trong một campaign. Đối tượng: Micro/Nano KOL/KOC từ 5K follower. Hoa hồng khuyến nghị 10%-12%","src":"Cred","where":"Credential p.47"},{"id":"A3.3.4-05","name":"Community và fan page","text":"Quản lý community và fan page với nội dung lấy shopper làm trung tâm trên các nền tảng social để thúc đẩy tương tác và hành động: Facebook fanpage và community group; Instagram; TikTok page.","src":"Cred","where":"Credential p.20"}]},{"id":"A3.3.5","name":"AI short video","ov":"Năng lực sản xuất video ngắn bằng AI: bốn giá trị mang lại cho Brand, cơ cấu nội dung (content mix) liên kết video xây tệp khán giả với video chuyển đổi, và bốn loại video. Bằng chứng: Blackmores.","src":"Cred","stage":"Acquire","where":"p.52-55","terms":[],"evid":"Blackmores ⟦pr⟧(p.56)⟦/pr⟧: trước khi dùng OnPoint short video: ROAS 10, 3-5 video mỗi tháng. Sau: ROAS 20, CTR +30%, 10-15 video mỗi tháng, chi phí sản xuất -80%.","note":"","items":[{"id":"A3.3.5-01","name":"4 giá trị","text":"• Tiết kiệm nguồn lực: nhân sự, thời gian, chi phí cố định kỹ thuật\n• Năng suất: 200-300 clip mỗi tháng; nhanh gấp 10-100 lần; chỉnh sửa và hiệu đính tức thì, tự động\n• Tiết kiệm chi phí nhưng ROI cao hơn: tiết kiệm 50%-90% chi phí\n• Am hiểu quy tắc: tuân thủ mọi quy tắc của Shopee và TikTok; nhất quán cao","src":"Cred","where":"Credential p.52"},{"id":"A3.3.5-02","name":"Content mix","text":"Chiến lược liên kết dòng video quảng bá và video chuyển đổi: video xây tệp khán giả (không gắn giỏ hàng) và video thúc đẩy chuyển đổi (gắn giỏ hàng).\n• Tỷ trọng: Product Review 40%; Product Function 30%; Campaign Teasing 20%; Livestream Cut 10%\n• Tần suất đăng tối thiểu 30 video mỗi tháng","src":"Cred","where":"Credential p.53"},{"id":"A3.3.5-03","name":"4 loại video","text":"Type 1 Product Function; Type 2 Product Review (có hoặc không talent); Type 3 Livestream Cut; Type 4 Deal / Campaign / Livestream Teasing. Slide có video mẫu (link) cho từng loại; ví dụ Type 4: CeraVe, Swisse.","src":"Cred","where":"Credential p.54, p.55"}]}]},{"id":"A3.4","name":"Deliver: logistics và fulfillment","ov":"Chặng đưa hàng đến tay shopper: hệ thống logistics TMĐT, mạng warehouse và fulfillment của OnPoint (19 warehouse, 4 vùng) và công nghệ multi-warehouse OctoPOS giúp rút ngắn lead time giao hàng. Trụ: Logistics và Fulfillment. Kết quả: Operation efficiency. ⟦pr⟧(p.23, p.24, p.62-65)⟦/pr⟧","stage":"Deliver","note":"Trụ: Logistics và Fulfillment. Kết quả: Operation efficiency.","topics":[{"id":"A3.4.1","name":"Hệ thống logistics TMĐT","ov":"Kiến thức nền về logistics TMĐT trước khi vào năng lực của OnPoint: đường đi một đơn hàng, các bên (3PL, 4PL), SLA, last-mile, hoàn trả và cross-border (khung tổng quát).","src":"Đã có + Mới","stage":"Deliver","where":"p.11 (cross-border: chỉ nêu dịch vụ)","terms":[{"m":"mlogi","focus":""},{"m":"mfulf","focus":""}],"evid":"","note":"Cross-border chưa có slide chi tiết trong credential.","items":[{"id":"A3.4.1-01","name":"Hành trình đơn hàng","text":"Đặt hàng > Pick và pack > First-mile (bàn giao cho vận chuyển) > Mid-mile (trung chuyển giữa các kho) > Last-mile (giao đến người nhận) > Thanh toán (trả trước hoặc COD) > Hoàn trả (Reverse Logistics).\nCác mắt xích: Warehouse, Sorting Hub, Delivery Courier, Transportation, Inbound Logistics.","src":"Đã có","where":"Bản v1: B5.1; module Logistics và Fulfillment"},{"id":"A3.4.1-02","name":"3PL, 4PL, SLA","text":"• 3PL: bên thứ ba thực hiện kho, vận tải, quản lý tồn kho, xử lý đơn thay doanh nghiệp\n• 4PL: điều phối chiến lược (thiết kế mạng lưới, quản lý hợp đồng, SLA và hiệu suất nhiều 3PL), không trực tiếp vận hành\n• SLA: cam kết mức dịch vụ (thời gian xử lý đơn, thời gian giao, tỷ lệ giao đúng hạn, tỷ lệ hư hỏng) kèm cách đo và xử lý khi không đạt\n• Ba cách fulfillment: tự vận hành, thuê 3PL, dùng dịch vụ của sàn (so sánh về kiểm soát, chi phí, khả năng mở rộng)\n⟦rv⟧Định nghĩa SLA có phần do biên soạn, cần duyệt.⟦/rv⟧","src":"Đã có","where":"Bản v1: B5.2; module Logistics và Fulfillment"},{"id":"A3.4.1-03","name":"Last-mile","text":"Chặng giao cuối từ hub địa phương đến tận cửa; phức tạp và tốn kém nhất.\n• Mô hình: Hub-and-Spoke, Point-to-Point, Micro-Fulfillment, Locker Network, Crowdsourced Delivery\n• Công cụ: Route Optimization, TMS; rủi ro: Failed Delivery Attempt, COD\n⟦rv⟧• Tỷ trọng chi phí last-mile không đưa vào vì deck ITT ghi không nhất quán giữa các slide (30-50%, hơn một nửa, đến 53%)⟦/rv⟧","src":"Đã có","where":"module Logistics và Fulfillment (deck ITT)"},{"id":"A3.4.1-04","name":"Cross-border","text":"Hai hướng: bán từ nước ngoài vào nội địa và từ nội địa ra nước ngoài; thêm khâu hải quan, thuế, thời gian vận chuyển dài hơn và yêu cầu tuân thủ riêng. Thuật ngữ: Global Sourcing, International Transportation, Export Documentation, Customs Clearance, De Minimis, Bonded Warehousing, Overseas Fulfillment, Parcel Consolidation.\n⟦rv⟧Credential chỉ liệt kê Cross-border Ecommerce là một dịch vụ năm 2026 ⟦pr⟧(p.11)⟦/pr⟧, chưa có slide chi tiết.⟦/rv⟧ Quy định thay đổi thường xuyên nên chưa nêu số cụ thể.","src":"Mới","where":"Mới: cần viết; Credential p.11; Bản v1: B5.4"},{"id":"A3.4.1-05","name":"Hoàn trả và reverse logistics","text":"• Các loại hoàn: đổi ý, sản phẩm lỗi, giao sai hàng, giao không thành công\n• Ai chịu phí: tùy chính sách sàn và lý do hoàn; phí vận chuyển hai chiều thường là khoản lớn\n• Tác động P&L: mất doanh thu đơn hoàn, phí vận chuyển hai chiều, hàng hoàn không bán lại được\n• Xử lý: nhập lại kho, tân trang, thanh lý hoặc hủy\n• KPI: On-time Delivery Rate, Damage Rate","src":"Đã có","where":"Bản v1: B5.3; module Logistics và Fulfillment"}]},{"id":"A3.4.2","name":"Warehouse và fulfillment của OnPoint","ov":"Năng lực kho và fulfillment: giải pháp B2B/B2C warehousing, mạng 19 warehouse ở 4 vùng, workflow nhận đến xuất, đóng gói tùy biến và các phương pháp tối ưu tồn kho FEFO/FIFO kèm checklist vận hành.","src":"Cred + Đã có","stage":"Deliver","where":"p.23, 24","terms":[{"m":"mlogi","focus":""},{"m":"mfulf","focus":"FBO"},{"m":"msys","focus":"ODF"}],"evid":"","note":"","items":[{"id":"A3.4.2-01","name":"B2B/B2C warehousing","text":"Giải pháp kho xử lý hiệu quả cả B2B và B2C, giàu chức năng và mở rộng được, đáp ứng nhu cầu warehousing end-to-end. Slide mô tả: mạng kho OnPoint tại Hà Nội và TP.HCM; fulfillment đóng gói đặc biệt; quản lý hạn dùng (shelf-life); bundling sản phẩm.\n• FBO (Fulfillment by OnPoint): hoạt động xử lý hàng hóa tại các kho do OnPoint quản lý hoặc thuê ngoài. Đơn từ các sàn được xử lý tại kho FBO được đánh dấu ODF (On-demand fulfillment) trên hệ thống.","src":"Cred + Từ điển","where":"Credential p.23; Từ điển OnPoint (FBO, ODF)"},{"id":"A3.4.2-02","name":"Mạng FFM và 19 warehouse","text":"• Tối đa 19 trung tâm FFM trên toàn quốc, 4 vùng (Bắc, Trung, Nam, Đồng bằng sông Cửu Long); từ 2025: Hà Nội và Bắc Ninh, Đà Nẵng, TP.HCM, Đồng Nai, Mekong Delta\n• Kế hoạch thêm trung tâm và điểm tồn kho để giao nhanh hơn, giảm phí vận chuyển cho người mua, đặc biệt ngành F&B\n• Năng lực: inbound tới 570K+ sản phẩm mỗi ngày; outbound tới 160K+ đơn mỗi ngày\n• Hệ thống và quy trình thiết kế để quản lý nhiều sàn","src":"Cred","where":"Credential p.24"},{"id":"A3.4.2-03","name":"Workflow nhận đến xuất","text":"Receive (kiểm tra, quét mã, ghi nhận tồn) > Store (xếp vị trí) > Pick > Pack (đóng gói, dán nhãn) > Ship (bàn giao vận chuyển) > Sorting & Dispatch; WMS theo dõi tồn kho và điều phối các bước.\nChecklist vận hành của OnPoint nêu quét mã vạch ở picking, RTS, shipped và kiểm tra chất lượng giữa picking và packing ⟦pr⟧(p.24)⟦/pr⟧.","src":"Đã có","where":"module Logistics và Fulfillment; Credential p.24"},{"id":"A3.4.2-04","name":"Đóng gói tùy biến","text":"Giải pháp đóng gói TMĐT tùy biến, thể hiện thương hiệu và cải thiện đánh giá khách hàng, gồm bao bì thân thiện môi trường. Ví dụ trên slide: gift card/voucher, gift packing, khắc tên (engraving), bundling vật lý.","src":"Cred","where":"Credential p.23"},{"id":"A3.4.2-05","name":"FEFO, FIFO, checklist","text":"Tối ưu tồn kho theo FEFO, FIFO. Operational Excellence Checklist:\n• Warehousing: WMS, dán nhãn rack, tách khu inbound và outbound\n• Order fulfillment: ước tính công suất, xử lý theo FIFO, quét mã vạch, kiểm tra chất lượng, bàn đóng gói tách biệt\n• Inventory: hệ thống quản lý tồn, tồn thực khớp Seller Center, xử lý nhiều tài khoản Lazada\n• Workforce: nhân sự riêng cho đơn Lazada\n• Packaging: vật liệu chuẩn, quy trình theo hướng dẫn đóng gói của Lazada\n• Security: camera, phòng cháy; Other: dự phòng internet","src":"Cred","where":"Credential p.24"}]},{"id":"A3.4.3","name":"Tồn kho và multi-warehouse (OctoPOS)","ov":"Lập kế hoạch tồn kho (PO, MOQ, lead time, DOI, OOS) và cách OctoPOS đồng bộ tồn kho nhiều điểm để định tuyến đơn theo vị trí, rút ngắn lead time giao hàng và chi phí.","src":"Cred + Đã có","stage":"Deliver","where":"p.23, 62-65","terms":[{"m":"minv","focus":""}],"evid":"Lead time trước và sau OctoPOS ⟦pr⟧(p.62: 5 ngày xuống 2 ngày ở Hà Nội)⟦/pr⟧; khách hàng và quy mô OctoPOS ⟦pr⟧(p.64: Nestlé, Mars; >180K đơn mỗi tháng)⟦/pr⟧.","note":"","items":[{"id":"A3.4.3-01","name":"DOI, MOQ, lead time, OOS","text":"• DOI = Current stock / Average daily sales; MOQ: số lượng đặt tối thiểu; Lead Time: từ lúc đặt đến lúc nhận hàng; OOS: hết hàng; OSA: tỷ lệ sẵn hàng (theo dõi riêng Must-Have SKU)\n• Chuỗi nhập hàng vào kênh e-commerce: Dự báo > PO (theo MOQ) > Inbound > STO (chuyển kho sang kho e-commerce) > Đồng bộ tồn lên Seller Center\n• Công cụ: máy tính DOI và điểm đặt hàng lại","src":"Đã có","where":"Bản v1: B5.2; module Vận hành và Tồn kho"},{"id":"A3.4.3-02","name":"Multi-warehouse và geo routing","text":"Đơn từ các sàn (Lazada, Shopee, Tiki, Sendo, Grab, Brand.com) tự động đồng bộ về hệ thống OnPoint, được định tuyến tối ưu theo vị trí địa lý rồi đẩy sang hệ thống logistics qua ứng dụng OctoPOS. Sau khi fulfill, 3PL nhận thông tin và giao hàng cho shopper.","src":"Cred","where":"Credential p.63"},{"id":"A3.4.3-03","name":"Lead time trước và sau OctoPOS","text":"Ví dụ Hà Nội:\n• Không có OctoPOS: kho Brand (TP.HCM) > kênh phân phối Lazada (TP.HCM) > kênh phân phối Lazada (Hà Nội) > hub > giao: 5 ngày\n• Có OctoPOS: đơn đi tới kho nhà phân phối offline của Brand tại Hà Nội: 2 ngày\n• Lợi ích nêu trên slide: tiết kiệm 66%-75% thời gian giao⟦rv⟧ ⟦pr⟧(p.63 ghi 60%-75%)⟦/pr⟧⟦/rv⟧; tiết kiệm 50%-66% chi phí giao; giảm 50% thời gian đóng gói\n⟦rv⟧• Lưu ý: 5 ngày xuống 2 ngày là giảm 60%. Xem Cần chốt.⟦/rv⟧","src":"Cred","where":"Credential p.62, p.63"},{"id":"A3.4.3-04","name":"Khách hàng và tính năng","text":"• Khách hàng: Nestlé (khách đầu tiên từ Q2/2021; từ 2 điểm tồn kho và 1 gian hàng Lazada năm 2021 mở rộng thêm điểm tồn kho và gian hàng ở Q3/2022); Mars (Q2/2022, 3 điểm tồn kho); TH, Mondelez, Sabeco, Kirin/Wonderfarm, Kewpie\n• Quy mô: >180K đơn gộp mỗi tháng; 1,3M sản phẩm gộp mỗi tháng\n• Tính năng: quản lý đơn và tồn kho thời gian thực; fulfillment trên di động; nhiều kênh bán; nhiều điểm tồn kho với geo routing; báo cáo và BI thời gian thực; công cụ khuyến mại thông minh","src":"Cred","where":"Credential p.64, p.65"}]}]},{"id":"A3.5","name":"Serve và Retain: shopper engagement","ov":"Chặng chăm sóc và giữ chân shopper: live chat, quản lý rating và review, CRM/CEM tập trung. Mục tiêu: niềm tin thương hiệu, trải nghiệm tốt và shopper quay lại. Trụ: Shopper engagement. Kết quả: Shopper loyalty. ⟦pr⟧(p.22)⟦/pr⟧","stage":"Serve và Retain","note":"Trụ: Shopper engagement. Kết quả: Shopper loyalty.","topics":[{"id":"A3.5.1","name":"Live chat, rating và review","ov":"Dịch vụ tư vấn và chăm sóc qua chat với tỷ lệ phản hồi 100%, cùng quản lý rating và review để nâng niềm tin và giá trị thương hiệu.","src":"Cred","stage":"Serve và Retain","where":"p.22","terms":[{"m":"mcs","focus":""}],"evid":"","note":"Chat có từ trước khi mua: chặng chính Serve và Retain, chặng phụ Acquire.","items":[{"id":"A3.5.1-01","name":"Phản hồi 100%","text":"Tỷ lệ phản hồi chat 100% và quản lý chat khối lượng lớn bằng agent được đào tạo. Fundamental metrics ở dashboard: chat response rate/time, SOT, positive rating 3-5 sao ⟦pr⟧(p.26)⟦/pr⟧.","src":"Cred","where":"Credential p.22, p.26"},{"id":"A3.5.1-02","name":"Vận hành chat","text":"• Đào tạo đầy đủ agent về thương hiệu, sản phẩm, khuyến mại\n• Làm việc 365 ngày⟦rv⟧; khung giờ ghi 8-11am (có thể là 8h đến 23h, cần xác nhận)⟦/rv⟧\n• Xử lý nhanh khiếu nại và sự cố\n• Kịch bản tư vấn trên slide: Recommended for you, Frequently bought together, You may want re-purchase, New arrivals","src":"Cred","where":"Credential p.22"},{"id":"A3.5.1-03","name":"Chat ngày campaign","text":"Xử lý mượt khối lượng chat cao ở ngày campaign, ít nhất gấp 30 lần ngày thường.","src":"Cred","where":"Credential p.22"},{"id":"A3.5.1-04","name":"Quản lý rating và review","text":"• Phản hồi 100% rating và review\n• Xử lý nhanh review xấu\n• Khuyến khích shopper đánh giá\nMục tiêu: niềm tin khách hàng và giá trị thương hiệu; slide minh họa với sản phẩm mới ra mắt (Rating/Review Building & Management).","src":"Cred","where":"Credential p.22"}]},{"id":"A3.5.2","name":"CRM/CEM và vòng đời khách hàng","ov":"Hệ thống CRM tập trung kết hợp chatbot, quản lý chat theo ý định (intent) và báo cáo hiệu suất; cùng từ vựng và đòn bẩy theo vòng đời khách hàng (thu hút, kích hoạt, mua lại, giữ chân, kéo lại) dùng để chọn khuyến mại và đo hiệu quả.","src":"Cred + Đã có","stage":"Serve và Retain","where":"p.22","terms":[{"m":"m10","focus":""}],"evid":"","note":"","items":[{"id":"A3.5.2-01","name":"CRM tập trung","text":"Hệ thống quản lý CRM tập trung; cải tiến liên tục nhờ phân tích dữ liệu; báo cáo hiệu suất nhiều insight. CRM/CEM là tên một mảng dịch vụ trong trụ Shopper engagement ⟦pr⟧(p.12)⟦/pr⟧.","src":"Cred","where":"Credential p.22, p.12"},{"id":"A3.5.2-02","name":"Chatbot và intent-based chat","text":"Kết hợp với chatbot; quản lý chat theo ý định (intent-based chat management). AI Conversational Chatbot cũng là một value-added capability của công nghệ OnPoint ⟦pr⟧(p.25)⟦/pr⟧.","src":"Cred","where":"Credential p.22, p.25"},{"id":"A3.5.2-03","name":"Vòng đời (new, repeat, retention, CAC, LTV)","text":"Bảng vòng đời và đòn bẩy:\n• Thu hút: voucher khách mới, gói dùng thử, nội dung creator; CAC, tỷ lệ khách mới\n• Kích hoạt: freeship, voucher đơn đầu, combo dùng thử; CR, AOV đơn đầu\n• Mua lại: nhắc mua lại, combo, multipack; tỷ lệ Repeat Customer\n• Giữ chân: membership, chat broadcast, ưu đãi cá nhân hóa; Retention Rate, LTV\n• Kéo lại: voucher cá nhân hóa, thông báo hàng mới; Churn Rate\nThuật ngữ: New/Repeat Customer, Cohort, Retention, Churn, CAC, LTV, RFM. ⟦rv⟧Bảng do biên soạn đề xuất, cần chỉnh theo framework CLM của OnPoint.⟦/rv⟧","src":"Đã có","where":"Bản v1: B4.2; module Khách hàng và Vòng đời"},{"id":"A3.5.2-04","name":"Follower building","text":"Xây tệp follower của gian hàng: gửi khuyến mại, ưu tiên hiển thị, social proof để tăng niềm tin; gửi voucher thúc đẩy shopper follow shop.","src":"Cred","where":"Credential p.22"}]}]},{"id":"A3.6","name":"Measure: dữ liệu, công nghệ và hiệu quả","ov":"Chặng đo lường và công nghệ: dashboard BI biến dữ liệu hành vi người mua thành hành động, đo hiệu quả khuyến mại (tăng thật, không chỉ GMV) và technology stack (OPOLLO, OctoPOS, API, DaaS). Trụ: Technology và BI. Kết quả: Technology transformation. ⟦pr⟧(p.25-28)⟦/pr⟧","stage":"Measure","note":"Trụ: Technology và BI. Kết quả: Technology transformation.","topics":[{"id":"A3.6.1","name":"BI và dashboard","ov":"Cách OnPoint dùng dữ liệu để hiểu hành vi người mua: 5 nhóm chỉ số dẫn tới hành động, bộ dashboard Power BI (tồn kho, chuỗi cung ứng, doanh số MTD, ATP, shopper insight) và các phân tích theo tỉnh, sàn, phương thức thanh toán, shopper chồng lấn. Các màn hình minh họa là dữ liệu cũ (2021) và đã che số.","src":"Cred","stage":"Measure","where":"p.26-28","terms":[],"evid":"","note":"BI phục vụ cả 6 chặng. Measure là vòng phản hồi quay lại Plan.","items":[{"id":"A3.6.1-01","name":"5 nhóm chỉ số đến hành động","text":"• Fundamental metrics: chat response rate/time, SOT, positive rating (3-5 sao)\n• Sales metrics: GMV, AOV, Orders, Items\n• Shopper metrics: Buyers, Promotion performance\n• Traffic: PV/UV, CR, traffic source/channel\n• Best performing products: ATP/OOS, high traffic low sales, low traffic, low/high CR products\nTất cả dẫn tới ACTION.","src":"Cred","where":"Credential p.26"},{"id":"A3.6.1-02","name":"Advanced dashboard (NMV theo tỉnh, sàn, phương thức thanh toán)","text":"• Bộ lọc: day type, category, platform, group brand, brand\n• Chỉ số shopper: #New shopper, NMV và AOV của new shopper, #Return shopper, NMV và AOV của return shopper, #Unique shopper\n• Biểu đồ: NMV theo tỉnh (bản đồ), theo sàn, theo phương thức thanh toán (COD, thẻ, Cybersource, MoMo, ZaloPay, Pay123, Napas), chi tiết NMV theo tỉnh, xu hướng theo tháng của shopper mới và quay lại\n• Ảnh chụp ngày 24/9/2021, số đã che","src":"Cred","where":"Credential p.27"},{"id":"A3.6.1-03","name":"Shopper chồng lấn giữa các sàn","text":"Biểu đồ Venn shopper trùng lặp giữa Lazada, Shopee, Sendo; bảng số shopper duy nhất theo sàn và theo nhóm brand. Ghi chú trên slide: không gồm Tiki và Other vì chưa có số điện thoại khách để tính quy tắc chồng lấn.","src":"Cred","where":"Credential p.28"}]},{"id":"A3.6.2","name":"Đo hiệu quả khuyến mại","ov":"Phân biệt tăng trưởng thật với mua doanh số: dùng baseline, incremental, pull-forward, cannibalization; đọc 12 chỉ số khuyến mại (từ lượt lấy voucher đến ROI, ARPU) và quy đổi ROAS, CIR, hoa hồng. ⟦rv⟧Nội dung đã có từ bản web trước (cheatsheet Promotion), chưa có trong credential.⟦/rv⟧","src":"Đã có","stage":"Measure","where":"","terms":[{"m":"mpromo","focus":""},{"m":"m12","focus":""}],"evid":"","note":"","items":[{"id":"A3.6.2-01","name":"12 chỉ số khuyến mại","text":"• Mức độ hấp dẫn của voucher: Collection Rate = collected / issued vouchers; Redemption Rate = redeemed / collected vouchers\n• Mức độ phụ thuộc vào khuyến mại: %Guided buyers, %Guided orders, %Guided GMV (tỷ lệ người mua, đơn hàng, GMV có dùng voucher)\n• Chi phí và hiệu quả: CIR = Promotion cost / Guided GMV; CPB = Promotion cost / Guided buyers; CPO = Promotion cost / Guided orders; ROI = Guided GMV / Promotion cost\n• Chất lượng người mua: Order per buyer = Total orders / Total buyers; ARPU = Total revenue / Total buyers; AOV = Guided GMV / Guided orders\n⟦rv⟧Hai điểm đang chờ duyệt: ARPU (cheatsheet ghi chia GMV, đã sửa thành chia số người mua) và ROI khuyến mại tính trên doanh thu, khác ROI gốc.⟦/rv⟧","src":"Đã có","where":"Bản web v2: module Chỉ số khuyến mại (từ Promotion cheatsheet)"},{"id":"A3.6.2-02","name":"Incremental và pull-forward","text":"• Baseline: mức dự kiến nếu không có chiến dịch (BAU gần nhất hoặc cùng kỳ)\n• Incremental/Uplift: phần tăng thêm thật sau khi trừ baseline, tính cả giai đoạn sau campaign\n• Pull-forward: khách mua sớm để hưởng ưu đãi, nên doanh số sau campaign thấp hơn baseline\n• Cannibalization: khuyến mại ăn vào doanh số sản phẩm hoặc kênh khác của chính mình\n• Công cụ: Campaign này thắng hay thua? (so ví dụ GMV tăng mạnh với ví dụ tăng thật)","src":"Đã có","where":"Bản v1: B4.3; module Đo lường khuyến mại"},{"id":"A3.6.2-03","name":"Quy đổi ROAS và hoa hồng","text":"• CIR = 1 / ROAS; nếu hoa hồng affiliate là chi phí duy nhất, hoa hồng 12,5% tương đương ROAS 8; thực tế còn phí dịch vụ hoặc booking nên ROAS quy đổi thấp hơn\n• Promo Spend % = chi phí khuyến mại / GMV, thường có trần theo ngân sách\n• Promo ROI tính trên phần incremental, không phải toàn bộ doanh số","src":"Đã có","where":"Bản v1: B3.3, B4.1; module Đo lường khuyến mại"}]},{"id":"A3.6.3","name":"Technology stack","ov":"Hai sản phẩm công nghệ của OnPoint (OPOLLO build-and-run và OctoPOS SaaS), các năng lực giá trị gia tăng (DaaS, chatbot AI, eLogistics aggregator, group buy social commerce), tích hợp API với sàn, brand.com, 3PL/WMS/TMS, thanh toán, và 3 hồ sơ khách hàng lý tưởng.","src":"Cred","stage":"Measure","where":"p.25, 65","terms":[{"m":"msys","focus":""},{"m":"mtech","focus":""}],"evid":"","note":"","items":[{"id":"A3.6.3-01","name":"OPOLLO","text":"OPOLLO là hệ thống làm việc nội bộ do OnPoint xây dựng và vận hành (build and run by OnPoint), hỗ trợ các phòng ban khác nhau.\n• Các phân hệ: OMS (đơn hàng B2C và B2B), PMS (sản phẩm, brand, vendor, category), DPMS (dự báo bán hàng, mục tiêu theo ngày cho team Commercial), SPMS (dự báo cung ứng cho team Supply Chain), IMS (tồn kho), CRMS (quan hệ khách hàng cho team CS), LPMS (landing page), CMS (thông tin channel, mỗi channel tương ứng một gian hàng trên sàn), PCMS (kiểm soát giá), POMS (tạo và duyệt PO), WMS (quản lý kho)\n• Tra từng phân hệ ở trang Thuật ngữ, nhóm Hệ thống OnPoint: Opollo và Octopos","src":"Cred + Từ điển","where":"Credential p.25; Từ điển OnPoint (Opollo, OMS, PMS, DPMS, SPMS, IMS, CRMS, LPMS, CMS, PCMS, POMS, WMS)"},{"id":"A3.6.3-02","name":"OctoPOS","text":"OctoPOS: omni-channels order fulfillment SaaS. Giúp Brand và retailer tham gia mạng lưới bán đa kênh (online và offline): nhận đơn trực tiếp từ nhiều kênh, đồng bộ tồn kho, quản lý đơn, tận dụng kho và mạng phân phối sẵn có của Brand. Chi tiết ở A3.4.3.\nTheo từ điển OnPoint: giải pháp dành cho các đối tác nhãn hàng khi bán hàng trên sàn; cho phép kết nối các kho hàng khác nhau của nhãn hàng trong việc xử lý đơn.","src":"Cred + Từ điển","where":"Credential p.25, p.62; Từ điển OnPoint (Octopos)"},{"id":"A3.6.3-03","name":"Tích hợp API","text":"Lớp API kết nối eCom marketplaces, Brand.com, 3PL và Warehouse Management System, 3PL và Transport Management System, Digital Payment và nhiều hệ thống khác.","src":"Cred","where":"Credential p.25"},{"id":"A3.6.3-04","name":"DaaS, chatbot, eLogistics aggregator, group buy","text":"Value-added capabilities: DaaS (slide không giải thích viết tắt), AI Conversational Chatbot, eLogistics Aggregator, Social Commerce - Group Buy.","src":"Cred","where":"Credential p.25"},{"id":"A3.6.3-05","name":"Khách hàng lý tưởng theo sản phẩm","text":"Ba hồ sơ khách hàng lý tưởng (Ideal Customer Profile) trên slide công nghệ:⟦rv⟧ Slide đặt cạnh danh sách tích hợp, không ghi rõ thuộc OPOLLO hay OctoPOS.⟦/rv⟧\n• Major brands thuê enabler chuyên nghiệp (store, media, CS, fulfilment, delivery)\n• Major brands thuê enabler (store, media, CS) và tận dụng năng lực phân phối offline sẵn có\n• MSME sellers, DIY operations, dùng SaaS để quản lý mọi mặt của kinh doanh eCom\n⟦rv⟧Cần OnPoint xác nhận cách ánh xạ với sản phẩm.⟦/rv⟧","src":"Cred","where":"Credential p.25"}]}]}]},{"id":"A4","name":"Bằng chứng: case toàn trình","ov":"Ba case đi hết hành trình (Johnson & Johnson, Shiseido Premium, Blackmores) và khung đọc case: chặng nào tạo ra kết quả, chỉ số nào chứng minh, có lặp lại được không. Case theo năng lực (livestream, affiliate, AI video, OctoPOS) nằm trong A3 dưới dạng khối Bằng chứng.","groups":[{"id":"A4.1","name":"Ba case đi hết hành trình","ov":"Ba case dài hạn của credential, mỗi case đọc theo 6 chặng: bối cảnh, mục tiêu, hành động, kết quả, bài học.","stage":"","note":"","topics":[{"id":"A4.1.1","name":"Johnson & Johnson","ov":"OnPoint là đối tác toàn diện của Johnson & Johnson (Listerine, OGX, Neutrogena, Johnson's Baby, Aveeno) từ 1/2023, trọng tâm Shopee. NMV năm 2023 đạt 4,5 triệu USD, gấp 1,6 lần năm 2022, kèm nhiều vị trí Top trong ngành hàng Mom & Baby ⟦pr⟧(p.58)⟦/pr⟧.","src":"Cred + Mới","stage":"","where":"p.58","terms":[],"evid":"","note":"Mỗi case đọc theo 6 chặng.","items":[{"id":"A4.1.1-01","name":"Bối cảnh","text":"• Hợp tác bắt đầu 1/2023 (partnership establishment JnJ x OnPoint)\n• FY2022 (NMV 2,8 triệu USD) là năm trước khi hợp tác bắt đầu\n• Danh mục: Listerine, OGX, Neutrogena, Johnson's Baby, Aveeno\n• Slide mô tả OnPoint là đối tác toàn diện, mạnh về thực thi và tối ưu e-commerce, quan hệ tốt với Shopee","src":"Cred","where":"Credential p.58"},{"id":"A4.1.1-02","name":"Mục tiêu","text":"⟦rv⟧Credential không nêu mục tiêu bằng số.⟦/rv⟧ Hàm ý từ slide: tăng NMV và vị trí trong ngành hàng trên Shopee, mở rộng sang TikTok Shop. ⟦rv⟧Cần OnPoint bổ sung mục tiêu ban đầu.⟦/rv⟧","src":"Cred + Mới","where":"Credential p.58; cần bổ sung"},{"id":"A4.1.1-03","name":"Hành động theo 6 chặng","text":"Hành động ghi trên slide: mở gian hàng TikTok Shop (4/2023); ra mắt Aveeno Baby (6/2023). Xếp hạng thương hiệu bán chạy xuất hiện ở các đợt sale 3.3, 6.6, 11.11, 12.12. ⟦rv⟧Cần OnPoint bổ sung để ánh xạ đủ 6 chặng (credential chưa mô tả hành động theo chặng).⟦/rv⟧","src":"Cred","where":"Credential p.58"},{"id":"A4.1.1-04","name":"Kết quả (số liệu, nguồn, ngày)","text":"• NMV: FY2022 2,8 triệu USD > FY2023 4,5 triệu USD (x1,6 so với 2022)\n• Mốc theo tháng: 3/2023 430K; 6/2023 450K; 11/2023 500K USD NMV\n• Xếp hạng trên các đợt sale: Top 5 HB, Top 1 MB (nhiều đợt), Top 5 MB, Top 2 MB","src":"Cred","where":"Credential p.58"},{"id":"A4.1.1-05","name":"Bài học","text":"⟦rv⟧Nháp biên soạn, cần OnPoint xác nhận:⟦/rv⟧\n• Quan hệ đối tác với sàn là đòn bẩy cho xếp hạng\n• Mở thêm kênh (TikTok Shop) và ra mắt dòng mới (Aveeno Baby) đi cùng tăng trưởng NMV\n• Mức x1,6 so sánh với năm trước khi hợp tác, nên đọc cùng baseline","src":"Mới","where":"Mới: cần viết"}]},{"id":"A4.1.2","name":"Shiseido Premium","ov":"Case phân khúc cao cấp (Premium) trên Shopee với đội ngũ chuyên trách, qua 3 năm 2021-2023: số đơn tăng từ cấp hàng nghìn (2xK) lên 3xK, ghi nhận hạng Top ở các đợt sale lớn của Lazada, Shopee và TikTok Shop ⟦pr⟧(p.59)⟦/pr⟧.","src":"Cred + Mới","stage":"","where":"p.59","terms":[],"evid":"","note":"Mỗi case đọc theo 6 chặng.","items":[{"id":"A4.1.2-01","name":"Bối cảnh","text":"Shiseido là thương hiệu cao cấp. OnPoint tiên phong ở phân khúc Premium trên Shopee với đội ngũ chuyên trách và dồn trọng tâm đẩy mạnh trên Shopee. Mốc 3/2021: Lazada ghi nhận NMV cao nhất đầu tiên, hơn 3.6k đơn.","src":"Cred","where":"Credential p.59"},{"id":"A4.1.2-02","name":"Mục tiêu","text":"Tiên phong ở phân khúc Premium trên Shopee với đội ngũ chuyên trách và nhiều trọng tâm hơn cho Shopee. Mục tiêu bằng số chưa nêu.","src":"Cred","where":"Credential p.59"},{"id":"A4.1.2-03","name":"Hành động theo 6 chặng","text":"Ghi nhận theo năm:\n• 2021: tham gia sale lớn Lazada (9.9) và Shopee (12.12)\n• 2022: Super Brand Day trên Lazada và Shopee; campaign social commerce đầu tiên (first socom CP)\n• 2023: campaign TikTok Shop đầu tiên (5/2023); Super Brand Day Lazada và Shopee; Shopee 11.11\n⟦rv⟧Cần bổ sung để ánh xạ đủ 6 chặng.⟦/rv⟧","src":"Cred","where":"Credential p.59"},{"id":"A4.1.2-04","name":"Kết quả (số liệu, nguồn, ngày)","text":"• 2021: ~2xK đơn; 9.9 Top 6 LZD biggest lux brands sale; 12.12 Top 5 Shopee best-selling brand\n• 2022: ~3xK đơn (x1,26); Top 5 best-selling brand LZD Brand Day (+1 hạng ở 9.9 so với 2021); SBD LZD >1.700 đơn (6/2022); SBD Shopee 128K NMV (8/2022); first socom CP ~900 đơn (11/2022)\n• 2023: ~3xK đơn (x1,12); Top 4 Shopee 3.3; first TikTok Shop CP >400 đơn (5/2023); SBD Shopee 147K NMV (8/2023, x1,15 so với SBD 2022); Top 3 Shopee 11.11\n⟦rv⟧• Lưu ý: SBD LZD 6/2023 ghi '>1,40 orders (uplift 1.28 vs SBD 2022)': số lỗi, không khớp 1.700 của 2022. Xem Cần chốt.⟦/rv⟧","src":"Cred","where":"Credential p.59"},{"id":"A4.1.2-05","name":"Bài học","text":"⟦rv⟧Nháp biên soạn, cần OnPoint xác nhận:⟦/rv⟧\n• Đội ngũ chuyên trách cho một phân khúc trên một sàn tạo được hạng Top bền qua 3 năm\n• Mở thêm kênh mới (social commerce 2022, TikTok Shop 2023) bổ sung cho sàn chủ lực\n• Dùng đủ cấp ngày sale (Super Brand Day, ngày sale sàn) để tạo đỉnh","src":"Mới","where":"Mới: cần viết"}]},{"id":"A4.1.3","name":"Blackmores","ov":"Case xây kênh Ecom và SoCom từ ngày đầu cho Blackmores (VDS) từ 8/2022, rồi mở rộng sang sữa công thức trẻ nhỏ (Infant Formula) từ 6/2025: đơn hàng tăng từ 15K (FY2023) lên 42K (FY2024), NMV x2,5 và đơn x2,8 ⟦pr⟧(p.60)⟦/pr⟧.","src":"Cred + Mới","stage":"","where":"p.60","terms":[],"evid":"","note":"Mỗi case đọc theo 6 chặng.","items":[{"id":"A4.1.3-01","name":"Bối cảnh","text":"• 8/2022: hợp tác Blackmores VDS x OnPoint, mở gian hàng Shopee, Lazada, Tiki\n• 11/2023: mở TikTok Shop\n• 6/2025: hợp tác thêm Blackmores Infant Formula (BMS IF) x OnPoint, mở Shopee, Lazada, TikTok Shop\n• Slide: OnPoint là đối tác tin cậy từ ngày đầu, xây kênh Ecom và SoCom","src":"Cred","where":"Credential p.60"},{"id":"A4.1.3-02","name":"Mục tiêu","text":"Xây kênh Ecom và SoCom cho Blackmores; sau đó mở rộng sang ngành hàng sữa công thức trẻ nhỏ (Infant Formula).","src":"Cred","where":"Credential p.60"},{"id":"A4.1.3-03","name":"Hành động theo 6 chặng","text":"Ghi nhận: mở gian hàng trên các sàn (8/2022); mở TikTok Shop (11/2023); cộng tác với Hannah Olala, SoCom creator lớn nhất, đạt ~900 đơn (11/2023); tham gia các đợt sale 9.9, 10.10, 11.11, 12.12 và 3.3; AI short video cho Blackmores ⟦pr⟧(p.56: ROAS 10 lên 20)⟦/pr⟧.","src":"Cred","where":"Credential p.56, p.60"},{"id":"A4.1.3-04","name":"Kết quả (số liệu, nguồn, ngày)","text":"• FY2023: 15K đơn; FY2024: 42K đơn (đơn x2,8; NMV x2,5 so với 2023)\n• Xếp hạng: Top 5 HB (3/2024); Top 4 HW 9.9; Top 2 HW 10.10, 11.11, 12.12; Top 5 HB 11.11 (LZD và TTS)\n• 3/2025: Top 2 HW 3.3; Top 4 HB 3.3","src":"Cred","where":"Credential p.60"},{"id":"A4.1.3-05","name":"Bài học","text":"⟦rv⟧Nháp biên soạn, cần OnPoint xác nhận:⟦/rv⟧\n• Ở lại từ ngày đầu và mở rộng thêm dòng sản phẩm là tín hiệu niềm tin của Brand\n• Creator đúng nhóm (SoCom) tạo đỉnh đơn nhanh\n• Công cụ nội dung (AI short video) nâng ROAS khi tần suất video tăng","src":"Mới","where":"Mới: cần viết"}]}]},{"id":"A4.2","name":"Cách đọc một case","ov":"Khung chung để đọc mọi case theo cùng một cách.","stage":"","note":"","topics":[{"id":"A4.2.1","name":"Khung đọc case","ov":"Ba câu hỏi để đọc mọi case theo cùng một cách: chặng nào tạo ra kết quả, chỉ số nào chứng minh, có lặp lại được không. Nội dung cần viết mới; phần dưới là nháp.","src":"Mới","stage":"","where":"","terms":[],"evid":"","note":"Case theo năng lực (T24) nằm ở khối Bằng chứng trong A3, không phải topic riêng.","items":[{"id":"A4.2.1-01","name":"Chặng nào tạo ra kết quả","text":"Gắn từng kết quả của case vào một chặng (Plan, Set up và Run, Acquire, Deliver, Serve và Retain, Measure). Mẫu ghi: kết quả > chặng tạo ra kết quả > hành động của OnPoint > nguồn (trang credential).","src":"Mới","where":"Mới: cần viết"},{"id":"A4.2.1-02","name":"Chỉ số nào chứng minh","text":"Chỉ ra chỉ số và mốc so sánh dùng làm bằng chứng (GMV, NMV, đơn, xếp hạng; so với ngày thường, năm trước hay mục tiêu). Lưu ý mẫu số và kỳ so sánh: ví dụ J&J so với năm trước khi hợp tác, P&G so với ngày thường.","src":"Mới","where":"Mới: cần viết"},{"id":"A4.2.1-03","name":"Có lặp lại được không","text":"Phân biệt yếu tố lặp lại được (quy trình, năng lực, công cụ) với yếu tố một lần (thương hiệu, thời điểm, khoản đầu tư riêng). Ví dụ gợi ý: L'Oréal Paris livestream factory triển khai trong 2 ngày kể từ khi Brand xác nhận ⟦pr⟧(p.50)⟦/pr⟧ cho thấy quy trình lặp lại được.","src":"Mới","where":"Mới: cần viết"}]}]}]},{"id":"A5","name":"Tổng kết và tra cứu","ov":"Kiểm tra mức sẵn sàng (readiness, tùy chọn) và tra cứu: từ điển 15 module (161 thuật ngữ) cùng bảng số liệu chuẩn kèm nguồn và ngày.","groups":[{"id":"A5.1","name":"Kiểm tra","ov":"Bài kiểm tra tùy chọn để người học tự biết phần nào cần ôn.","stage":"","note":"","topics":[{"id":"A5.1.1","name":"Readiness check (tùy chọn)","ov":"Bài kiểm tra tùy chọn cuối chương trình: 15 câu, mỗi câu cho một định nghĩa và người học chọn thuật ngữ đúng; kết quả chỉ ra module cần ôn. ⟦rv⟧Cần cập nhật câu hỏi cho nội dung OnPoint (A2 đến A4); hiện chỉ có câu hỏi định nghĩa từ các module thuật ngữ.⟦/rv⟧","src":"Đã có","stage":"","where":"","terms":[],"evid":"","note":"","items":[{"id":"A5.1.1-01","name":"Câu hỏi theo từng Big topic","text":"15 câu lấy từ 15 module thuật ngữ của Version 2, mỗi câu cho một định nghĩa và bốn lựa chọn. ⟦rv⟧Chưa có bộ câu hỏi tình huống.⟦/rv⟧","src":"Đã có","where":"Bản v1: C2 (Readiness check)"},{"id":"A5.1.1-02","name":"Bản đồ điểm cần ôn","text":"Kết quả hiển thị theo module (heatmap) để người học biết module nào cần ôn. Dữ liệu chỉ lưu trên trình duyệt đang dùng, chưa gửi về người quản lý và chưa tích hợp LMS.","src":"Đã có","where":"Bản v1: C2"}]}]},{"id":"A5.2","name":"Tra cứu","ov":"Hai công cụ tra cứu: từ điển thuật ngữ đầy đủ và bảng số liệu chuẩn.","stage":"","note":"","topics":[{"id":"A5.2.1","name":"Từ điển đầy đủ","ov":"Trang Thuật ngữ riêng: tìm kiếm theo tên, viết tắt hoặc định nghĩa, lọc theo nhóm (module) và theo team. Gồm các thuật ngữ Version 2 và các từ viết tắt trong từ điển OnPoint và E-Com; thẻ trùng được gộp, thẻ Version 2 có thêm dòng Theo từ điển OnPoint.","src":"Đã có","stage":"","where":"Trang Thuật ngữ","terms":[],"evid":"","note":"","items":[{"id":"A5.2.1-01","name":"15 module","text":"25 nhóm: 15 module của Version 2 và 10 nhóm bổ sung cho các thuật ngữ từ từ điển (mã ngành hàng, dịch vụ fulfillment và vận chuyển của sàn, chỉ số vận hành trên sàn, hệ thống OnPoint, công nghệ và công cụ, tổ chức và vai trò, chăm sóc khách hàng, tài chính và pháp lý, an toàn và cải tiến, thuật ngữ chung).","src":"Đã có","where":"Trang Thuật ngữ"},{"id":"A5.2.1-02","name":"Tìm kiếm","text":"Ô tìm kiếm không phân biệt hoa thường và dấu, tìm theo tên, từ viết tắt, tên đầy đủ và nội dung định nghĩa. Lọc theo nhóm, theo nguồn và theo team; nhãn [Team] cho biết định nghĩa chuyên về team đó.","src":"Đã có","where":"Trang Thuật ngữ"},{"id":"A5.2.1-03","name":"Bảng tổng","text":"Chế độ Bảng: toàn bộ thuật ngữ đang lọc trong một bảng A-Z để quét nhanh; bấm tên để mở thẻ đầy đủ.","src":"Đã có","where":"Trang Thuật ngữ"}]},{"id":"A5.2.2","name":"Nguồn và cập nhật","ov":"Bảng số liệu chuẩn cho mọi con số quy mô và case: mỗi số có giá trị đã chốt, nguồn (tài liệu và trang), ngày và người duyệt; kèm quy tắc cập nhật định kỳ. Bên dưới là bản nháp các số liệu từ credential, chưa có giá trị nào được duyệt.","src":"Mới","stage":"","where":"","terms":[],"evid":"","note":"Mọi con số quy mô đi qua A2.1.1 và A5.2.2; các topic khác dẫn về đây.","items":[{"id":"A5.2.2-01","name":"Bảng số liệu chuẩn kèm nguồn và ngày","text":"Cột đề xuất: Chỉ số | Giá trị | Đơn vị | Kỳ | Nguồn (tài liệu, trang) | Ngày nguồn | Người duyệt | Dùng ở. Bản nháp hiển thị bên dưới; chưa có giá trị nào được duyệt.","src":"Mới","where":"Mới: cần viết; sheet Số liệu chuẩn (nháp)"},{"id":"A5.2.2-02","name":"Quy tắc cập nhật","text":"Đề xuất: một chủ sở hữu duy nhất cho bảng; rà soát theo quý hoặc khi credential đổi bản; mọi topic chỉ dẫn về bảng, không tự nhập số; số mâu thuẫn phải được chốt trước khi xuất bản.","src":"Mới","where":"Mới: cần viết"}]}]}]}]},"gloss":{"modules":[{"id":"mcat","no":1,"title":"Tổng quan ngành hàng","intro":"Những mục thường có trong một bản tổng quan ngành hàng: ngành hàng, phân khúc giá, sản phẩm chủ lực, người dùng và người mua mục tiêu, đối thủ và nhu cầu mua sắm.","takeaway":"Một bản tổng quan ngành hàng trả lời ba câu hỏi: bán gì (category, price segment, Hero SKUs), bán cho ai (target consumers, target shoppers) và cạnh tranh với ai, ở đâu (key competitors, shopping missions).","kind":"v2","core":true,"visual":""},{"id":"m1","no":2,"title":"Seller và Gian hàng","intro":"Ai đang bán, bán dưới hình thức nào và quản lý gian hàng ở đâu.","takeaway":"Biết đúng \"ai là ai\" trên sàn quyết định bạn làm việc với đối tác nào, theo luật chơi nào.","kind":"v2","core":true,"visual":""},{"id":"m2","no":3,"title":"Thương mại và Chiến dịch","intro":"Ngôn ngữ của kế hoạch bán hàng: các cấp ngày bán, cơ chế khuyến mại và kế hoạch chung giữa nhãn hàng và sàn.","takeaway":"Mỗi ngày bán thuộc một cấp (BAU, Mini-spike, Spike, Mega). Kế hoạch và đo lường luôn bắt đầu bằng việc so với BAU.","kind":"v2","core":true,"visual":""},{"id":"m3","no":4,"title":"Giá và Doanh thu","intro":"Từ giá bán của từng sản phẩm đến doanh số của cả kênh.","takeaway":"GMV là doanh số \"trên giấy\". Luôn hỏi: con số này tính trước hay sau hủy/hoàn và giảm giá? (GMV, rồi NMV).","kind":"v2","core":true,"visual":""},{"id":"m4","no":5,"title":"Assortment và SKU","intro":"Cách nhìn danh mục sản phẩm: SKU, biến thể và vai trò của từng SKU.","takeaway":"Không phải SKU nào cũng cần bán ở mọi nơi: mỗi SKU cần một vai trò rõ ràng, SKU không có vai trò thì cân nhắc loại bỏ.","kind":"v2","core":true,"visual":""},{"id":"m5","no":6,"title":"Traffic và Phễu hành vi","intro":"Hành trình từ lúc sản phẩm được hiển thị đến lúc khách mua.","takeaway":"Mỗi bước của phễu có một tỷ lệ riêng: CTR đo sức hút khi hiển thị, CR đo khả năng chốt mua. Đừng nhầm hai điểm nghẽn này.","kind":"v2","core":true,"visual":"funnel"},{"id":"m6","no":7,"title":"Vị trí hiển thị trên sàn","intro":"Những \"mặt tiền\" nơi sản phẩm được nhìn thấy trên sàn.","takeaway":"Mỗi vị trí phục vụ một ý định mua khác nhau: tìm kiếm (SRP), duyệt (Category), gợi ý (Just for you), giải trí (Livestream).","kind":"v2","core":true,"visual":"journey"},{"id":"m7","no":8,"title":"Nguồn doanh thu","intro":"Doanh thu đến từ đâu: quảng cáo trả phí, hoa hồng, livestream hay tự nhiên.","takeaway":"Doanh thu có phần \"có định hướng\" (Guided) và phần \"tự nhiên\" (Organic). Biết tỷ trọng giúp bạn biết mình đang mua doanh số hay đang có doanh số.","kind":"v2","core":true,"visual":""},{"id":"m8","no":9,"title":"Hiệu quả và Chi phí marketing","intro":"Thước đo hiệu quả của tiền chi cho quảng cáo và hoa hồng.","takeaway":"ROAS và CIR là hai cách nói của cùng một việc (CIR = 1 / ROAS). Quy đổi nhanh: hoa hồng 12,5% tương đương ROAS 8 (chưa gồm phí khác).","kind":"v2","core":true,"visual":""},{"id":"m9","no":10,"title":"Lợi nhuận và P&L","intro":"Từ doanh thu đến EBIT, và hai \"ngôn ngữ\" P&L: marketplace và trading term.","takeaway":"Cùng một từ \"lãi gộp\" có thể nằm ở các mốc khác nhau. Luôn hỏi: đã trừ những khoản nào?","kind":"v2","core":false,"visual":""},{"id":"m10","no":11,"title":"Khách hàng và Vòng đời","intro":"Từ vựng để nói về tăng trưởng người dùng.","takeaway":"Tăng trưởng người dùng gồm ba việc: thu hút khách mới (CAC), giữ chân (Retention) và nâng giá trị (LTV).","kind":"v2","core":false,"visual":""},{"id":"mpromo","no":12,"title":"Chỉ số khuyến mại","intro":"Các chỉ số đọc hiệu quả của chương trình voucher: từ lượt lấy và dùng voucher, mức phụ thuộc vào khuyến mại, đến chi phí và chất lượng người mua.","takeaway":"Đọc theo thứ tự: voucher có hấp dẫn không (Collection Rate), có được dùng không (Redemption Rate), người mua phụ thuộc đến đâu (%Guided), tốn bao nhiêu (CIR, CPB, CPO) và có đáng không (ROI, AOV, ARPU).","kind":"v2","core":false,"visual":""},{"id":"m12","no":13,"title":"Đo lường khuyến mại","intro":"Từ vựng để phân biệt tăng trưởng thật với \"mua doanh số\".","takeaway":"Doanh số tăng chưa chắc là thắng. Hãy đo phần tăng thêm (incremental), trừ cả chi phí khuyến mại và phần doanh số bị kéo về trước.","kind":"v2","core":false,"visual":""},{"id":"minv","no":14,"title":"Vận hành và Tồn kho","intro":"Lập kế hoạch tồn kho: đặt hàng, thời gian chờ và mức tồn.","takeaway":"Hết hàng thì mất đơn, thừa hàng thì chôn vốn. DOI và Lead Time là hai con số giữ cân bằng đó.","kind":"v2","core":false,"visual":""},{"id":"mlogi","no":15,"title":"Logistics và Fulfillment","intro":"Từ lúc khách bấm mua đến lúc hàng tới tay: các mắt xích, các bên và mô hình vận hành phía sau mỗi đơn hàng online.","takeaway":"Một mắt xích gãy sẽ làm gián đoạn cả hành trình của đơn hàng, nên cần nhìn logistics như một hệ thống: cross-border, 3PL và 4PL, warehouse fulfillment và last-mile.","kind":"v2","core":false,"visual":"logistics"},{"id":"mcode","no":16,"title":"Mã ngành hàng trên sàn","intro":"Mã viết tắt của các ngành hàng và ngành hàng con trên sàn, dùng trong báo cáo và kế hoạch ngành hàng.","takeaway":"","kind":"new","core":false,"visual":""},{"id":"mfulf","no":17,"title":"Dịch vụ fulfillment và đơn vị vận chuyển của sàn","intro":"Các dịch vụ fulfillment và đơn vị vận chuyển gắn với từng sàn, cùng dịch vụ fulfillment của OnPoint (FBO).","takeaway":"","kind":"new","core":false,"visual":""},{"id":"mplat","no":18,"title":"Chỉ số và chính sách vận hành trên sàn","intro":"Chỉ số vận hành, điểm phạt và quy định mà sàn áp dụng cho người bán. Chỉ số kém ảnh hưởng trực tiếp đến gian hàng.","takeaway":"","kind":"new","core":false,"visual":""},{"id":"msys","no":19,"title":"Hệ thống OnPoint: Opollo và Octopos","intro":"Opollo là hệ thống làm việc nội bộ do OnPoint xây dựng; Octopos là giải pháp dành cho nhãn hàng. Mỗi phân hệ của Opollo có tên viết tắt riêng.","takeaway":"","kind":"new","core":false,"visual":""},{"id":"mtech","no":20,"title":"Công nghệ, dữ liệu và công cụ làm việc","intro":"Công nghệ, dữ liệu và công cụ thường gặp: kết nối hệ thống, các giai đoạn kiểm thử, báo cáo, công cụ văn phòng.","takeaway":"","kind":"new","core":false,"visual":""},{"id":"morg","no":21,"title":"Tổ chức, vai trò và đối tác","intro":"Bộ phận, vai trò và đối tác thường được nhắc đến trong công việc (KAM, KAE, GBM, BD...), kèm một số mã khách hàng.","takeaway":"","kind":"new","core":false,"visual":""},{"id":"mcs","no":22,"title":"Chăm sóc khách hàng (CS/CX)","intro":"Chỉ số, quy trình và vai trò trong chăm sóc khách hàng và xác minh đơn hàng.","takeaway":"","kind":"new","core":false,"visual":""},{"id":"mfin","no":23,"title":"Tài chính, pháp lý và hợp đồng","intro":"Thuế, công nợ, chứng từ pháp lý khi mở gian hàng, thỏa thuận bảo mật và các tài liệu mời thầu.","takeaway":"","kind":"new","core":false,"visual":""},{"id":"mhsse","no":24,"title":"An toàn, sức khỏe và cải tiến vận hành","intro":"An toàn, sức khỏe, môi trường (HSSE) và các nguyên tắc cải tiến liên tục (Lean, Kaizen).","takeaway":"","kind":"new","core":false,"visual":""},{"id":"mgen","no":25,"title":"Thuật ngữ chung trong công việc","intro":"Từ viết tắt dùng trong email và họp (ASAP, FYI, EOM, MTD...) và một số khái niệm quản lý dùng ở mọi phòng ban.","takeaway":"","kind":"new","core":false,"visual":""}],"teams":{"Commercial":{"code":"Com","name":"Team Commercial"},"Operations":{"code":"Ops","name":"Team Operations"},"Marketing":{"code":"MKT","name":"Team Marketing"},"Finance":{"code":"Fin","name":"Team Finance"},"Legal":{"code":"Legal","name":"Team Legal"},"Tech":{"code":"Tech","name":"Team Tech"},"Ecom":{"code":"Ecom","name":"Team Ecom"},"CS/CX":{"code":"CS","name":"Team CS/CX"},"Transport":{"code":"Transport","name":"Team Transport"},"Warehouse":{"code":"WH","name":"Team Warehouse"},"BI":{"code":"BI","name":"Team BI"},"HR":{"code":"HR","name":"Team HR"},"Admin":{"code":"Admin","name":"Team Admin"},"Product":{"code":"Product","name":"Team Product"},"Content":{"code":"Content","name":"Team Content"},"S&P":{"code":"S&P","name":"Team S&P"},"LEX":{"code":"LEX","name":"Team LEX (Lazada Express)"}},"terms":[{"id":"catsub","t":"Category & Sub-category","m":["mcat"],"d":"Category là nhóm sản phẩm cùng đáp ứng một nhu cầu, ví dụ Chăm sóc da. Sub-category là nhánh nhỏ hơn trong category, chia theo loại sản phẩm, công dụng hoặc đối tượng dùng, ví dụ Kem chống nắng, Sữa rửa mặt. Mục tiêu, thị phần và kế hoạch thường được đặt theo từng category và sub-category.","src":"a","v2":1,"vi":"Ngành hàng và ngành hàng con","see":["cattree"],"op":[{"ab":"CAT","mean":"Category","vn":"Ngành hàng","en":["A group of items that share specific traits, like Electronics, Home and Living, etc., that sorts items for easier handling by Lazada, sellers and customers"],"calc":[],"tm":[],"src":"de"}],"al":["CAT"]},{"id":"pricesegment","t":"Price segment","m":["mcat"],"d":"Các nhóm sản phẩm trong cùng một category chia theo mức giá bán, ví dụ phổ thông, tầm trung, cao cấp. Dùng để xem sản phẩm của bạn đang cạnh tranh ở khoảng giá nào và khoảng giá nào tạo nhiều doanh số nhất.","src":"a","v2":1,"vi":"Phân khúc giá","see":["hpb"]},{"id":"heroskus","t":"Hero SKUs","m":["mcat"],"d":"Danh sách các Hero SKU của một ngành hàng hoặc thương hiệu: những sản phẩm chủ lực kéo traffic, chuyển đổi hoặc nhận diện thương hiệu. Trong bản tổng quan ngành hàng, thường ghi kèm giá bán, doanh số và vai trò của từng SKU.","src":"a","v2":1,"see":["herosku"]},{"id":"targetcons","t":"Target consumers","m":["mcat"],"d":"Nhóm người sử dụng sản phẩm mà thương hiệu hoặc ngành hàng nhắm tới, mô tả theo nhân khẩu học, hành vi và nhu cầu (ví dụ nữ 22 đến 35 tuổi, quan tâm chăm sóc da). Consumer là người dùng sản phẩm, có thể không phải người trực tiếp mua.","src":"a","v2":1,"vi":"Người tiêu dùng mục tiêu"},{"id":"targetshop","t":"Target shoppers","m":["mcat"],"d":"Nhóm người trực tiếp quyết định và thực hiện việc mua trên kênh, có thể khác với người dùng sản phẩm (ví dụ cha mẹ mua cho con, người mua quà tặng). Hiểu shopper giúp chọn nội dung, ưu đãi và vị trí hiển thị phù hợp.","src":"a","v2":1,"vi":"Người mua mục tiêu"},{"id":"keycomp","t":"Key competitors","m":["mcat"],"d":"Các thương hiệu hoặc sản phẩm cạnh tranh trực tiếp với bạn cùng ngành hàng, phân khúc giá và nhóm người mua. Thường so sánh về giá, thị phần, mức khuyến mại, nội dung và vị trí hiển thị.","src":"a","v2":1,"vi":"Đối thủ chính"},{"id":"mission","t":"Shopping mission","m":["mcat"],"d":"Mục đích hoặc nhu cầu cụ thể khiến người mua mở ứng dụng và mua hàng trong một lần mua sắm, ví dụ mua theo kế hoạch, săn deal, mua bổ sung, khám phá món mới. Hiểu shopping mission giúp chọn đúng sản phẩm, ưu đãi và vị trí hiển thị.","src":"a","v2":1,"vi":"Mục đích mua sắm"},{"id":"missionecom","t":"Shopping mission: Ecom","m":["mcat"],"d":"Trên sàn TMĐT truyền thống (như Shopee, Lazada), người mua thường vào với mục tiêu rõ: tìm đúng sản phẩm bằng tìm kiếm, so sánh giá và đánh giá, săn deal trong ngày sale hoặc mua bổ sung theo nhu cầu định kỳ. Hành trình điển hình: Search, Compare, Buy.","src":"a","v2":1},{"id":"missiontts","t":"Shopping mission: TTS","m":["mcat"],"d":"Trên TikTok Shop (TTS), mua sắm thường bắt đầu từ nội dung: người mua khám phá sản phẩm qua video và livestream, được thuyết phục bởi người trình bày và ưu đãi trong phiên, rồi mua ngay. Hành trình điển hình: Watch, Trust, Impulse, Buy.","src":"a","v2":1,"full":"TikTok Shop"},{"id":"storefront","t":"Storefront/Storehome","m":["m1"],"d":"Giao diện chính của gian hàng.","src":"u","v2":1},{"id":"seller","t":"Seller","m":["m1"],"d":"Bên bán hàng trên sàn: đăng bán sản phẩm, quản lý giá, tồn kho, đơn hàng và chăm sóc khách. Có thể là shop nhỏ, nhà phân phối hoặc chính nhãn hàng.","src":"a","v2":1},{"id":"brand","t":"Brand","m":["m1"],"d":"Chủ sở hữu thương hiệu hoặc sản phẩm, quyết định chiến lược kinh doanh, marketing và phân phối. Có thể tự vận hành kênh TMĐT hoặc giao cho đối tác (enabler, nhà phân phối).","src":"a","v2":1,"vi":"Nhãn hàng"},{"id":"official","t":"Official Store / Mall","m":["m1"],"d":"Gian hàng chính hãng trên sàn dành cho nhãn hàng hoặc nhà phân phối được ủy quyền (ví dụ: Shopee Mall, LazMall), thường đi kèm quyền lợi hiển thị và cam kết chất lượng riêng.","src":"a","v2":1},{"id":"sellercenter","t":"Seller Center","m":["m1"],"d":"Công cụ quản trị dành cho seller: thiết lập giá, tồn kho, voucher, quảng cáo, đơn hàng và xem báo cáo.","src":"a","v2":1,"op":[{"ab":"SC","mean":"Seller Center","vn":"Nền tảng quản lý bán hàng trên các sàn. Khi tạo một tài khoản bán hàng, người bán sẽ được cung cấp tài khoản trên hệ thống người bán","en":["System managing the interface between merchants and Lazada"],"calc":[],"tm":["Ecom","Operations"],"src":"de"}],"al":["SC"]},{"id":"shorttail","t":"Short-tail Seller","m":["m1"],"d":"Nhóm seller số lượng ít nhưng đóng góp phần lớn GMV của sàn (thường là shop lớn, nhãn hàng).","src":"a","v2":1},{"id":"longtail","t":"Long-tail Seller","m":["m1"],"d":"Nhóm seller số lượng rất lớn, mỗi seller đóng góp GMV nhỏ nhưng cộng lại tạo độ phủ rộng cho ngành hàng.","src":"a","v2":1},{"id":"crossborder","t":"Cross-border Seller","m":["m1"],"d":"Seller đặt ở nước ngoài, bán sang thị trường nội địa thông qua sàn (ví dụ: seller quốc tế bán vào Việt Nam).","src":"a","v2":1},{"id":"mega","t":"Mega Campaign","m":["m2"],"d":"Các chiến dịch siêu lớn như 9.9, 11.11, 12.12…","src":"u","v2":1,"conf":["spike"],"op":[{"ab":"Mega Campaign","mean":"Các campaign siêu lớn trên các sàn TMĐT","vn":"Chương trình khuyến mãi siêu lớn (Mega) trong năm. Dùng để phân biệt với các chương trình khuyến mãi nhỏ khác. Trung bình 1 Mega Campaign / quý. Ví dụ: 9.9, 11.11, 12.12, ...","en":[],"calc":[],"tm":["Ecom"],"src":"d"}]},{"id":"flash","t":"Flash Sale","m":["m2"],"d":"Chương trình giảm giá sốc trong thời gian giới hạn.","src":"u","v2":1},{"id":"bau","t":"BAU","m":["m2"],"d":"Ngày bán bình thường, không có chiến dịch; dùng làm mốc nền (baseline) để so sánh hiệu quả các ngày có chiến dịch.","src":"a","v2":1,"full":"Business As Usual","op":[{"ab":"BAU","mean":"Business as Usual","vn":"Ngày hoạt động bình thường. Ở đây mô tả một ngày hoạt động bình thường","en":[],"calc":[],"tm":[],"src":"d"}]},{"id":"mini","t":"Mini-spike","m":["m2"],"d":"Chiến dịch nhỏ, ngắn ngày, tạo đỉnh doanh số nhẹ so với BAU.","src":"a","v2":1,"conf":["spike"]},{"id":"spike","t":"Spike","m":["m2"],"d":"Chiến dịch lớn tạo đỉnh doanh số rõ rệt so với BAU; cấp độ cao hơn Mini-spike.","src":"a","v2":1,"conf":["mega","mini"]},{"id":"sbd","t":"Super Brand Day / Launching Day","m":["m2"],"d":"Ngày cao điểm dành riêng cho một thương hiệu hoặc một lần ra mắt sản phẩm mới, thường đi kèm đầu tư và mục tiêu riêng.","src":"a","v2":1},{"id":"voucher","t":"Voucher","m":["m2"],"d":"Mã giảm giá áp dụng cho đơn hàng hoặc sản phẩm; có thể do sàn hoặc seller tài trợ.","src":"a","v2":1},{"id":"gwp","t":"GWP","m":["m2"],"d":"Quà tặng kèm khi đơn hàng đạt điều kiện (ví dụ mua đủ giá trị hoặc đủ số lượng).","src":"a","v2":1,"full":"Gift With Purchase"},{"id":"bundle","t":"Bundle / Combo","m":["m2"],"d":"Gói nhiều sản phẩm bán cùng nhau với ưu đãi, nhằm tăng Unit per Order và AOV.","src":"a","v2":1},{"id":"jbp","t":"JBP","m":["m2"],"d":"Kế hoạch kinh doanh chung giữa nhãn hàng và sàn (cùng các đối tác liên quan) cho cả năm: mục tiêu, ngân sách, hoạt động và timeline.","src":"a","v2":1,"full":"Joint Business Plan","op":[{"ab":"JBP","mean":"Joint Business Plan","vn":"Kế hoạch kinh doanh chung các bên. Ở đây bao gồm nhãn hàng, sàn thương mại điện tử và OnPoint","en":[],"calc":[],"tm":["Commercial"],"src":"d"}]},{"id":"asp","t":"ASP","m":["m3"],"d":"Giá bán trung bình của một sản phẩm (SKU).","src":"u","v2":1,"full":"Average Selling Price","op":[{"ab":"ASP","mean":"Average Selling Price","vn":"Giá bán trung bình của sản phẩm","en":["Value of an item to be realised, similar to AIV"],"calc":[],"tm":[],"src":"de"}]},{"id":"upo","t":"Unit per Order","m":["m3"],"d":"Số sản phẩm trung bình được bán trong 1 đơn hàng.","src":"u","v2":1},{"id":"aov","t":"AOV","m":["m3"],"d":"Giá trị trung bình mỗi đơn hàng.","src":"u","v2":1,"full":"Average Order Value","f":"AOV = ASP x Unit per order","op":[{"ab":"AOV","mean":"Average Order Value","vn":"Giá trị đơn hàng trung bình","en":["Value of the whole order"],"calc":[],"tm":["Commercial","Operations"],"src":"de"}]},{"id":"unitsold","t":"Unit Sold","m":["m3"],"d":"Tổng số sản phẩm đã bán (tính theo từng đơn vị SKU).","src":"u","v2":1},{"id":"order","t":"Order","m":["m3"],"d":"Một lượt đặt mua của khách, có thể gồm một hoặc nhiều sản phẩm.","src":"a","v2":1,"vi":"Đơn hàng","see":[],"op":[{"ab":"Orders","mean":"the total number of completed purchases on LAZADA site","vn":"","en":[],"calc":[],"tm":[],"src":"e"}],"al":["Orders"]},{"id":"gmv","t":"GMV","m":["m3"],"d":"Tổng giá trị hàng hóa bán ra.","src":"u","v2":1,"full":"Gross Merchandise Value","f":"GMV = Traffic x CR x AOV","op":[{"ab":"GMV","mean":"Gross Merchandise Volume","vn":"Tổng giá trị hàng hoá được bán của gian hàng/ nhãn hàng trên các nền tảng/ kênh bán hàng. Bao gồm các đơn hàng bị hủy, hoàn trả,...","en":[],"calc":[],"tm":["Commercial"],"src":"d"}]},{"id":"nmv","t":"NMV","m":["m3"],"d":"Giá trị hàng hóa thực nhận sau khi loại các khoản điều chỉnh (tối thiểu là đơn hủy/hoàn; một số doanh nghiệp trừ thêm giảm giá do seller tài trợ). Luôn ghi rõ cách tính NMV khi báo cáo.","src":"a","v2":1,"full":"Net Merchandise Value","ctx":"Hai cách diễn đạt cùng chỉ giá trị thực nhận. Version 2 nhấn mạnh giá trị sau khi loại các khoản điều chỉnh (tối thiểu là đơn hủy, hoàn); từ điển OnPoint nhấn mạnh tổng giá trị đơn giao thành công. Luôn ghi rõ NMV đã trừ những khoản nào.","op":[{"ab":"NMV","mean":"Net Merchandise value","vn":"Tổng giá trị của tất cả các đơn hàng của gian hàng/ nhãn hàng giao thành công trên các nền tảng/ kênh bán hàng. Không bao gồm các đơn hàng bị hủy, hoàn trả,...","en":["This is what we all need to collaborate to grow month on month"],"calc":[],"tm":["Commercial"],"src":"de","conflict":"Từ điển OnPoint: tổng giá trị đơn giao thành công, không gồm đơn hủy và hoàn. Version 2: giá trị thực nhận sau khi loại các khoản điều chỉnh (tối thiểu là đơn hủy/hoàn)."}]},{"id":"hpb","t":"Hero Price Band","m":["m3"],"d":"Khoảng giá chủ lực mà người tiêu dùng thường chọn mua.","src":"u","v2":1,"ab":"HPB"},{"id":"pricearch","t":"Pricing Architecture","m":["m3"],"d":"Cấu trúc giá 3 tầng: List Price (giá niêm yết, làm mốc neo), Daily Price (giá bán thường ngày), Campaign Price (giá thấp nhất trong ngày sale lớn, vẫn phải trên điểm hòa vốn).","src":"a","v2":1,"vi":"Cấu trúc giá"},{"id":"assort","t":"Assortment","m" <script>
'use strict';
/* ================= core ================= */
const DATA = JSON.parse(document.getElementById('data').textContent);
const CONTENT = DATA.content, GL = DATA.gloss, TOOLS = DATA.tools, FACTS = DATA.facts, IMG = DATA.img;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const norm = s => String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
const fmt = (n, d) => Number.isFinite(n) ? n.toLocaleString('vi-VN', {minimumFractionDigits: d || 0, maximumFractionDigits: d || 0}) : '-';
const num = id => { const el = document.getElementById(id); const v = el ? parseFloat(String(el.value).replace(',', '.')) : NaN; return Number.isFinite(v) ? v : 0; };
const enc = encodeURIComponent;

/* ----- state (localStorage guarded) ----- */
const KEY = 'onpoint_onboarding_v1';
const blank = () => ({mode: 'review', done: {}, assess: {}, role: '', cat: '', diag: null, ready: null, best: {}, chk: {}, gview: 'card'});
let state = blank();
try { const raw = window.localStorage.getItem(KEY); if (raw) state = Object.assign(blank(), JSON.parse(raw)); } catch (e) { /* storage unavailable */ }
const save = () => { try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } };

/* ----- content index ----- */
const BIG = {}, GROUP = {}, TOPIC = {}, TOPICS = [];
CONTENT.big.forEach(b => { BIG[b.id] = b; b.groups.forEach(g => { g.big = b; GROUP[g.id] = g; g.topics.forEach(t => { t.group = g; t.big = b; TOPIC[t.id] = t; TOPICS.push(t); }); }); });
const hidItem = i => state.mode === 'learner' && CONTENT.hide_items.indexOf(i.id) !== -1;
const hidTopic = t => state.mode === 'learner' && (CONTENT.hide_topics.indexOf(t.id) !== -1 || t.items.every(hidItem));
const visTopics = () => TOPICS.filter(t => !hidTopic(t));

/* ----- rich text: bullets, review-only spans, page references ----- */
const RVO = '\u27e6rv\u27e7', RVC = '\u27e6/rv\u27e7', PRO = '\u27e6pr\u27e7', PRC = '\u27e6/pr\u27e7';
const inline = s => esc(s).split(RVO).join('<span class="rv">').split(RVC).join('</span>').split(PRO).join('<span class="pr">').split(PRC).join('</span>');
function rich(text) {
  if (!text) return '';
  let out = '', open = false;
  const close = () => { if (open) { out += '</ul>'; open = false; } };
  String(text).split('\n').forEach(line => {
    if (!line.trim()) return;
    const whole = line.indexOf(RVO) === 0 && line.lastIndexOf(RVC) === line.length - RVC.length && line.split(RVO).length === 2;
    let body = whole ? line.slice(RVO.length, line.length - RVC.length) : line;
    const bullet = body.indexOf('• ') === 0;
    if (bullet) body = body.slice(2);
    const cls = whole ? ' class="rv"' : '';
    if (bullet) { if (!open) { out += '<ul>'; open = true; } out += '<li' + cls + '>' + inline(body) + '</li>'; }
    else { close(); out += '<p' + cls + '>' + inline(body) + '</p>'; }
  });
  close();
  return out;
}
/* plain text for cards and summaries: drops review-only and reference spans */
const plain = s => String(s || '').replace(new RegExp(RVO + '[\\s\\S]*?' + RVC, 'g'), '').replace(new RegExp(PRO + '[\\s\\S]*?' + PRC, 'g'), '').replace(/\s+/g, ' ').trim();

/* ================= capability model (credential p.12) ================= */
const MODEL = {
  roof: 'We provide professional e-commerce solutions for development and expansion',
  base: 'Elevating customer lifetime value',
  pillars: [
    {id: 'emk', title: 'E\u2011Marketing', vi: 'Tiếp thị và tăng traffic', color: '#b1282e', outcome: 'Shopper Acquisition', groups: [
      {name: 'Media, Creative & Content Marketing', items: [['On/Off Platform & Performance Marketing Ads', 'A3.3.1'], ['Influencer Marketing & Community Management', 'A3.3.4'], ['Livestream Management', 'A3.3.3'], ['AI Short Videos', 'A3.3.5'], ['Creative & Production', 'A3.3.2']]}]},
    {id: 'est', title: 'E\u2011Store Set Up & Management', vi: 'Thiết lập và quản lý gian hàng', color: '#054a54', outcome: 'Sales Revenue', groups: [
      {name: 'Key Account Management', items: [['Account & Business Planning', 'A3.1.1'], ['Assortment Strategy', 'A3.1.2'], ['Promotion & Pricing Management', 'A3.1.2'], ['Inventory Management', 'A3.4.3'], ['Co-brand Partnership', 'A3.1.1']]},
      {name: 'Campaign & Merchandise Management', items: [['Store Onboarding', 'A3.2.1'], ['Store Operation', 'A3.2.1'], ['Store Merchandising & Promotion Setup', 'A3.2.2'], ['Campaign Planning', 'A3.2.3'], ['Campaign Management', 'A3.2.3']]}]},
    {id: 'log', title: 'Logistics & Fulfillment', vi: 'Logistics và fulfillment', color: '#1b8a9c', outcome: 'Operation Efficiency', groups: [
      {name: 'Multi Warehouses Solution & Multi Last-Mile Solution', items: [['B2B/B2C Warehousing', 'A3.4.2'], ['Customized Fulfillment & Packaging', 'A3.4.2'], ['Multi Warehouses Solution', 'A3.4.3'], ['Imported Products', 'A3.4.1'], ['Multi Last-Mile Solution', 'A3.4.1']]}]},
    {id: 'tbi', title: 'Technology & Business Intelligence', vi: 'Công nghệ và dữ liệu', color: '#2a5560', outcome: 'Technology Transformation', groups: [
      {name: 'Business Intelligence Solution', items: [['Real-time Performance Dashboard', 'A3.6.1'], ['Category & Shopper Insights', 'A3.6.1'], ['Pricing Sensitivity Control', 'A3.6.1'], ['Geographical Coverage Insights', 'A3.6.1'], ['AI Business Intelligence', 'A3.6.1']]},
      {name: 'Technology & Integration', items: [['Omnichannel Order Management System', 'A3.6.3'], ['Ecommerce Website Solution', 'A3.6.3'], ['Social Commerce Solution', 'A3.6.3'], ['Offline to Online Solution', 'A3.6.3'], ['Advanced Tools: Chatbot, Virtual Bundles, Gift Promotion, etc...', 'A3.6.3']]}]},
    {id: 'sen', title: 'Shopper Engagement', vi: 'Gắn kết và giữ chân shopper', color: '#d9575d', outcome: 'Shopper Loyalty', groups: [
      {name: 'Customer Service & Experience', items: [['Live Chat', 'A3.5.1'], ['Rating & Review Management', 'A3.5.1'], ['Crisis Management', 'A3.5.1'], ['CRM/ CEM', 'A3.5.2'], ['Enhance Customer Experience', 'A3.5.2']]}]}
  ]
};
const STAGE_DEF = [{g: 'A3.1', k: 'Plan', p: 'est'}, {g: 'A3.2', k: 'Set up và Run', p: 'est'}, {g: 'A3.3', k: 'Acquire', p: 'emk'}, {g: 'A3.4', k: 'Deliver', p: 'log'}, {g: 'A3.5', k: 'Serve và Retain', p: 'sen'}, {g: 'A3.6', k: 'Measure', p: 'tbi'}];
const PIL = id => MODEL.pillars.find(p => p.id === id);
const topicLink = id => TOPIC[id] ? '<a href="#/t/' + id + '">' + id + ' ' + esc(TOPIC[id].name) + '</a>' : '';

function modelHTML() {
  let h = '<div class="house"><div class="roof"><span>' + esc(MODEL.roof) + '</span></div><div class="pillars" role="list">';
  MODEL.pillars.forEach(p => {
    h += '<div class="pillar" role="listitem" style="--pc:' + p.color + '"><button class="p-h" type="button" aria-expanded="false" data-pillar="' + p.id + '"><span>' + esc(p.title) + '<small>' + esc(p.vi) + '</small></span><span aria-hidden="true">+</span></button>' +
         '<div class="p-b" style="--n:' + p.groups.length + '">';
    p.groups.forEach(g => { h += '<div class="p-g"><h5>' + esc(g.name) + '</h5>' + g.items.map(it => '<a class="svc" href="#/t/' + it[1] + '">' + esc(it[0]) + '</a>').join('') + '</div>'; });
    h += '</div><div class="p-o"><small>Kết quả</small>' + esc(p.outcome) + '</div></div>';
  });
  return h + '</div><div class="base">' + esc(MODEL.base) + '</div><div class="pdetail" id="pdetail" aria-live="polite"><h3>Bấm tên một trụ để xem chặng, kết quả và các topic liên quan</h3><p>Mỗi dịch vụ bên trên là một liên kết tới topic tương ứng.</p></div></div>';
}
function stagesHTML() {
  return '<div class="stages">' + STAGE_DEF.map((s, i) => { const g = GROUP[s.g], p = PIL(s.p); return '<a class="stg" style="--pc:' + p.color + '" href="#/t/' + g.topics[0].id + '"><b>' + (i + 1) + '. ' + esc(s.k) + '</b><span>' + esc(p.title) + '</span></a>'; }).join('') + '</div>';
}
function bindModel(root) {
  $$('.p-h', root).forEach(b => b.addEventListener('click', () => {
    const open = b.getAttribute('aria-expanded') === 'true';
    $$('.p-h', root).forEach(x => { x.setAttribute('aria-expanded', 'false'); x.lastElementChild.textContent = '+'; });
    const box = $('#pdetail', root);
    if (open) { box.innerHTML = '<h3>Bấm tên một trụ để xem chặng, kết quả và các topic liên quan</h3><p>Mỗi dịch vụ bên trên là một liên kết tới topic tương ứng.</p>'; return; }
    b.setAttribute('aria-expanded', 'true'); b.lastElementChild.textContent = '−';
    const p = PIL(b.dataset.pillar), st = STAGE_DEF.filter(s => s.p === p.id);
    const ids = []; st.forEach(s => GROUP[s.g].topics.forEach(t => { if (!hidTopic(t)) ids.push(t.id); }));
    box.innerHTML = '<h3>' + esc(p.title) + '</h3><p>Kết quả: <b>' + esc(p.outcome) + '</b>. Chặng trong hành trình: ' + st.map(s => '<b>' + esc(s.k) + '</b>').join(', ') + '.</p><div class="links">' + ids.map(id => '<a href="#/t/' + id + '">' + id + ' ' + esc(TOPIC[id].name) + '</a>').join('') + '</div>';
  }));
}

/* ================= shell ================= */
let currentRoute = '';
function setMode(m) {
  state.mode = m; save(); document.documentElement.dataset.mode = m;
  $$('.seg [data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  renderRail(); route(true);

/* ================= router ================= */
function parseHash() {
  const h = (location.hash || '#/').replace(/^#/, '') || '/';
  const i = h.indexOf('?'), path = i === -1 ? h : h.slice(0, i), q = {};
  if (i !== -1) h.slice(i + 1).split('&').forEach(kv => { if (!kv) return; const p = kv.split('='); q[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || '').replace(/\+/g, ' ')); });
  return {path: path, q: q};
}
function route(keepScroll) {
  const r = parseHash(), seg = r.path.split('/').filter(Boolean);
  currentRoute = r.path;
  const page = seg[0] === 't' ? 'topic' : seg[0] === 'b' ? 'big' : seg[0] === 'glossary' ? 'glossary' : seg[0] === 'start' ? 'start' : 'home';
  document.body.dataset.page = page;
  setDrawer(false);
  if (page === 'topic' && TOPIC[seg[1]]) renderTopic(TOPIC[seg[1]]);
  else if (page === 'big' && BIG[seg[1]]) renderBig(BIG[seg[1]]);
  else if (page === 'glossary') renderGlossary(r.q);
  else if (page === 'start') renderStart();
  else renderHome();
  markRail();
  if (!keepScroll && !(page === 'glossary' && r.q.t)) window.scrollTo(0, 0);
}

const PL_DEF = {'pl-gmv': 4000, 'pl-cancel': 8, 'pl-disc': 9, 'pl-cogs': 34, 'pl-fee': 30, 'pl-media': 12, 'pl-ops': 11};
function plCalc() {
  const gmv = num('pl-gmv'), cancel = gmv * num('pl-cancel') / 100, disc = gmv * num('pl-disc') / 100;
  const nmv = gmv - cancel - disc, shipped = gmv - cancel;
  const cogs = shipped * num('pl-cogs') / 100, gm = nmv - cogs;
  const fee = nmv * num('pl-fee') / 100, med = nmv * num('pl-media') / 100, ops = nmv * num('pl-ops') / 100;
  return {gmv: gmv, cancel: cancel, disc: disc, nmv: nmv, cogs: cogs, gm: gm, fee: fee, med: med, ops: ops, ebit: gm - fee - med - ops};
}
function plRender() {
  const r = plCalc(), out = $('#plOut');
  if (!(r.gmv > 0) || !(r.nmv > 0)) { out.innerHTML = '<p class="out-note">Nhập GMV lớn hơn 0, và tổng hủy/hoàn cộng seller discount phải nhỏ hơn 100% GMV.</p>'; return r; }
  const rows = [
    ['GMV', r.gmv, '', 'tot'], ['Hủy/hoàn', -r.cancel, pct1(r.cancel / r.gmv) + ' GMV', ''], ['Seller discount', -r.disc, pct1(r.disc / r.gmv) + ' GMV', ''],
    ['NMV', r.nmv, pct1(r.nmv / r.gmv) + ' GMV', 'tot'], ['COGS', -r.cogs, pct1(r.cogs / r.nmv) + ' NMV', ''], ['Gross margin', r.gm, pct1(r.gm / r.nmv) + ' NMV', 'tot'],
    ['Phí sàn', -r.fee, pct1(r.fee / r.nmv) + ' NMV', ''], ['Media', -r.med, pct1(r.med / r.nmv) + ' NMV', ''], ['Vận hành và khác', -r.ops, pct1(r.ops / r.nmv) + ' NMV', ''], ['EBIT', r.ebit, pct1(r.ebit / r.nmv) + ' NMV', 'tot']
  ];
  out.innerHTML = rows.map(x => '<div class="ln ' + x[3] + (x[1] < 0 ? ' neg' : '') + '"><span>' + x[0] + '</span><i></i><span class="v">' + fmt(x[1], 1) + '</span><span class="pc">' + x[2] + '</span></div><div class="mini"><u style="width:' + Math.min(100, Math.abs(x[1]) / r.gmv * 100) + '%"></u></div>').join('') +
    '<p class="out-note">Mỗi dòng ghi rõ mẫu số. Từ COGS trở xuống, các phần trăm cộng lại bằng 100% NMV.</p>';

}

  $('#plPlus').addEventListener('click', () => {

    d.value = (parseFloat(d.value) || 0) + 2;
    const r = plRender(), delta = r.ebit - before, box = $('#plDelta');
    box.hidden = false; box.className = 'verdict ' + (delta < 0 ? 'bad' : 'good');
    box.textContent = 'Seller discount tăng 2 điểm: EBIT thay đổi ' + fmt(delta, 1) + ' triệu' + (before ? ' (' + fmt(delta / before * 100, 1) + '%)' : '') + '. Giảm giá làm NMV giảm nhưng COGS không đổi, nên phần giảm không được bù hết bởi phí sàn và chi phí tính theo NMV.';
  });
  $('#plReset').addEventListener('click', () => { Object.keys(PL_DEF).forEach(k => { $('#' + k).value = PL_DEF[k]; }); $('#plDelta').hidden = true; plRender(); });
  plRender();
}
function initPuzzle() {
  const host = $('#puz'), fb = $('#puzFb');
  const opts = ['Hủy/hoàn', 'COGS', 'Media', 'Vận hành'];
  host.innerHTML = opts.map((o, k) => '<button type="button" class="opt" data-k="' + k + '"><span class="k">' + 'ABCD'.charAt(k) + '</span><span>' + o + '</span></button>').join('');
  $$('.opt', host).forEach(b => b.addEventListener('click', () => {
    const k = +b.dataset.k, ok = k === 2;
    $$('.opt', host).forEach((x, j) => { x.disabled = true; if (j === 2) x.classList.add('right'); else if (j === k) x.classList.add('wrong'); });
    fb.hidden = false; fb.className = 'q-fb ' + (ok ? 'ok' : 'no');
    fb.innerHTML = (ok ? '<b>Đúng.</b> ' : '<b>Chưa đúng.</b> Đáp án là Media. ') + 'Từ COGS trở xuống mọi dòng tính trên NMV (1.640). Media 246 / 1.640 = 15,0%, không phải 12,3% (đó là 246 / 2.000, tức mẫu số GMV). Cách kiểm nhanh: 35 + 30 + 12,3 + 10 + 10 = 97,3%, trong khi các dòng cùng mẫu số NMV phải cộng lại bằng 100%. Hủy/hoàn và seller discount nằm trên NMV nên tính trên GMV là đúng.';
  }));
