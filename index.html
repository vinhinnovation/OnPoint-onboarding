/* ----- B2: price ladder ----- */
function prRender() {
  const cogs = num('pr-cogs'), fee = num('pr-fee'), mkt = num('pr-mkt'), ops = num('pr-ops'), tax = num('pr-tax'), risk = num('pr-risk'), profit = num('pr-profit'), gap = num('pr-gap');
  const costs = fee + mkt + ops + tax + risk, out = $('#prOut'), note = $('#prNote');
  const dFloor = 1 - costs / 100, dTarget = 1 - (costs + profit) / 100;
  if (!(cogs > 0) || dTarget <= 0.02) { out.innerHTML = '<p class="out-note">Nhập giá vốn lớn hơn 0. Tổng chi phí và lợi nhuận mục tiêu phải nhỏ hơn 98% giá bán.</p>'; note.hidden = true; return; }
  const floor = cogs / dFloor, daily = cogs / dTarget, list = gap >= 0 && gap < 100 ? daily / (1 - gap / 100) : NaN;
  const part = p => daily * p / 100;
  out.innerHTML = ln('List Price (mốc neo)', fmt(list), 'đ') + ln('Daily Price', fmt(daily), 'đ', 'tot') + ln('Giá hòa vốn', fmt(floor), 'đ', 'tot') +
    '<p class="out-note" style="margin-top:12px">Giá 1 sản phẩm tại Daily Price được chia như sau:</p>' +
    ln('Giá vốn', fmt(cogs), pct1(cogs / daily)) + ln('Phí sàn', fmt(part(fee)), fmt(fee, 1) + '%') + ln('Marketing', fmt(part(mkt)), fmt(mkt, 1) + '%') + ln('Vận hành', fmt(part(ops)), fmt(ops, 1) + '%') +
    ln('Thuế, phí khác', fmt(part(tax)), fmt(tax, 1) + '%') + ln('Rủi ro hoàn/hỏng', fmt(part(risk)), fmt(risk, 1) + '%') + ln('Lợi nhuận', fmt(part(profit)), fmt(profit, 1) + '%', 'tot');
  note.hidden = false; note.className = 'verdict';
  note.textContent = 'Campaign Price nên nằm giữa giá hòa vốn và Daily Price. Từ Daily Price, bạn chỉ có thể giảm tối đa ' + fmt((daily - floor) / daily * 100, 1) + '% trước khi lợi nhuận về 0.';
}

/* ----- B3: converters ----- */
function initConverter() {
  const r = $('#cv-roas'), c = $('#cv-cir'), m = $('#cv-comm');
  const set = (el, v) => { el.value = Number.isFinite(v) ? String(Math.round(v * 100) / 100) : ''; };
  r.addEventListener('input', () => { const v = parseFloat(r.value); if (v > 0) { set(c, 100 / v); set(m, 100 / v); } });
  c.addEventListener('input', () => { const v = parseFloat(c.value); if (v > 0) { set(r, 100 / v); set(m, v); } });
  m.addEventListener('input', () => { const v = parseFloat(m.value); if (v > 0) { set(c, v); set(r, 100 / v); } });
}
function mmRender() {
  const names = ['Onsite Ads', 'Affiliate', 'Offsite (CPAS)', 'Livestream Ads'];
  let tb = 0, tg = 0, best = -1, bestR = 0;
  const rows = names.map((n, k) => { const b = num('mm-b' + (k + 1)), r = num('mm-r' + (k + 1)), g = b * r; tb += b; tg += g; if (b > 0 && r > bestR) { bestR = r; best = k; } return [n, g]; });
  const roas = tb > 0 ? tg / tb : 0;
  $('#mmOut').innerHTML = rows.map(x => ln(x[0], fmt(x[1], 1), (tg > 0 ? fmt(x[1] / tg * 100, 0) : '0') + '% GMV')).join('') +
    ln('GMV tạo ra', fmt(tg, 1), '', 'tot') + ln('Tổng ngân sách', fmt(tb, 1), '') + ln('ROAS tổng hợp', fmt(roas, 2), '') + ln('CIR tổng hợp', roas > 0 ? fmt(100 / roas, 1) + '%' : '-', '');
  const note = $('#mmNote');
  note.hidden = best < 0; note.className = 'verdict';
  if (best >= 0) note.textContent = 'ROAS cao nhất: ' + names[best] + '. ROAS cao chưa có nghĩa nên dồn thêm ngân sách vì mỗi nguồn có trần quy mô và hiệu quả giảm dần khi tăng chi.';
}

/* ----- B4: incremental analysis ----- */
const IN_PRESETS = {
  a: {'in-base': 100, 'in-dc': 3, 'in-camp': 220, 'in-dp': 7, 'in-post': 85, 'in-m': 22, 'in-k': 12, 'in-ad': 40},
  b: {'in-base': 100, 'in-dc': 3, 'in-camp': 240, 'in-dp': 7, 'in-post': 98, 'in-m': 22, 'in-k': 6, 'in-ad': 20}
};
function inRender() {
  const B = num('in-base'), dc = num('in-dc'), C = num('in-camp'), dp = num('in-dp'), P = num('in-post'), m = num('in-m') / 100, k = num('in-k') / 100, ad = num('in-ad');
  const baseG = B * (dc + dp), actG = C * dc + P * dp, incG = actG - baseG;
  const baseP = baseG * m, actP = C * dc * (m - k) - ad + P * dp * m, incP = actP - baseP;
  const sign = v => (v > 0 ? '+' : '') + fmt(v, 1);
  const rel = (a, b) => b > 0 ? (a / b - 1) * 100 : NaN;
  $('#inOut').innerHTML = ln('GMV ngày campaign so với baseline', (rel(C, B) > 0 ? '+' : '') + fmt(rel(C, B), 0) + '%', '') + ln('GMV ngày sau campaign so với baseline', (rel(P, B) > 0 ? '+' : '') + fmt(rel(P, B), 0) + '%', '') +
    ln('GMV baseline cả giai đoạn', fmt(baseG, 1), '') + ln('GMV thực tế cả giai đoạn', fmt(actG, 1), '') + ln('GMV tăng thêm', sign(incG), baseG > 0 ? sign(incG / baseG * 100) + '%' : '', 'tot') +
    ln('Lợi nhuận baseline', fmt(baseP, 1), '') + ln('Lợi nhuận thực tế (sau khuyến mại, ads)', fmt(actP, 1), '') + ln('Lợi nhuận tăng thêm', sign(incP), '', 'tot');
  const n = $('#inNote'); n.hidden = false;
  if (incP < 0) { n.className = 'verdict bad'; n.textContent = incG > 0 ? 'GMV tăng nhưng lợi nhuận tăng thêm âm: campaign này đang mua doanh số. Hãy nhìn cả phần doanh số bị kéo về trước (các ngày sau campaign) và chi phí khuyến mại, ads.' : 'Cả GMV lẫn lợi nhuận đều không tăng thêm.'; }
  else { n.className = 'verdict good'; n.textContent = 'Campaign tạo thêm lợi nhuận sau khi đã tính phần doanh số bị kéo về trước và chi phí khuyến mại, ads.'; }
}
function initIncremental() {
  $$('#inTool input').forEach(i => i.addEventListener('input', inRender));
  $$('#inTool [data-preset]').forEach(b => b.addEventListener('click', () => { const p = IN_PRESETS[b.dataset.preset]; Object.keys(p).forEach(k => { $('#' + k).value = p[k]; }); inRender(); }));
  inRender();
}

/* ----- B5: DOI ----- */
function doRender() {
  const stock = num('do-stock'), daily = num('do-daily'), lead = num('do-lead'), safe = num('do-safe'), moq = Math.max(1, num('do-moq')), cover = num('do-cover');
  const out = $('#doOut'), note = $('#doNote');
  if (!(daily > 0)) { out.innerHTML = '<p class="out-note">Nhập số bán trung bình mỗi ngày lớn hơn 0.</p>'; note.hidden = true; return; }
  const doi = stock / daily, rop = daily * (lead + safe), need = daily * (lead + cover) - stock, qty = need > 0 ? Math.ceil(need / moq) * moq : 0;
  out.innerHTML = ln('DOI (ngày)', fmt(doi, 1), '', 'tot') + ln('Lead time cộng tồn an toàn (ngày)', fmt(lead + safe, 0), '') + ln('Điểm đặt hàng lại (sản phẩm)', fmt(rop, 0), '') + ln('Số lượng gợi ý đặt (theo MOQ)', fmt(qty, 0), '', 'tot');
  note.hidden = false;
  if (doi < lead) { note.className = 'verdict bad'; note.textContent = 'DOI (' + fmt(doi, 1) + ' ngày) thấp hơn lead time (' + fmt(lead, 0) + ' ngày): dự kiến hết hàng khoảng ' + fmt(lead - doi, 0) + ' ngày trước khi hàng về. Nên đặt hàng ngay.'; }
  else if (stock <= rop) { note.className = 'verdict bad'; note.textContent = 'Tồn kho đã chạm điểm đặt hàng lại. Nên đặt hàng ngay.'; }
  else { note.className = 'verdict good'; note.textContent = 'Tồn kho còn an toàn so với lead time. Theo dõi lại khi doanh số tăng.'; }
}

/* ----- B1 checklist ----- */
function updateChkCount() { const all = $$('[data-chk]'); $('#chkCount').textContent = all.filter(c => c.checked).length + '/' + all.length + ' mục'; }
function renderChk() {
  $('#chkList').innerHTML = B1_CHECK.map((g, gi) => '<h5>' + esc(g.g) + '</h5>' + g.items.map((t, i) => { const key = gi + '-' + i; return '<label><input type="checkbox" data-chk="' + key + '"' + (state.chk[key] ? ' checked' : '') + '><span>' + esc(t) + '</span></label>'; }).join('')).join('');
  $$('[data-chk]').forEach(c => c.addEventListener('change', () => { state.chk[c.dataset.chk] = c.checked; save(); updateChkCount(); }));
  updateChkCount();
}


/* ================= quiz: definition -> pick the term (Version 2 terms) ================= */
const V2T = TERMS.filter(t => t.v2), V2M = MODS.filter(m => m.kind === 'v2');
const fullDef = t => t.d + (t.f ? ' Công thức: ' + t.f : '');
function maskPrompt(t) {
  let text = fullDef(t);
  const names = [t.t, t.full, t.ab, t.vi].concat((t.al || []).filter(a => a.length >= 4)).filter(Boolean).sort((a, b) => b.length - a.length);
  names.forEach(n => {
    const re = new RegExp('(^|[^\\p{L}\\p{N}])' + n.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&') + '(?=$|[^\\p{L}\\p{N}])', 'giu');
    text = text.replace(re, '$1____');
  });
  return text;
}
function makeQ(t) {
  const bad = x => x.id === t.id || x.noquiz || (t.conf || []).indexOf(x.id) !== -1 || (x.conf || []).indexOf(t.id) !== -1;
  let pool = V2T.filter(x => x.m[0] === t.m[0] && !bad(x));
  if (pool.length < 3) pool = pool.concat(shuffle(V2T.filter(x => x.m[0] !== t.m[0] && !bad(x))).slice(0, 3 - pool.length));
  return {term: t, options: shuffle([t].concat(shuffle(pool).slice(0, 3))), prompt: maskPrompt(t)};
}
function sampleQs(modIds, n) {
  const mods = shuffle(modIds), used = {}, out = [];
  let guard = 0, i = 0;
  while (out.length < n && mods.length && guard++ < 400) {
    const m = mods[i % mods.length];
    const cand = shuffle(V2T.filter(t => t.m[0] === m && !t.noquiz && !used[t.id]));
    if (cand.length) { used[cand[0].id] = true; out.push(makeQ(cand[0])); i++; } else { mods.splice(mods.indexOf(m), 1); }
  }
  return shuffle(out);
}
function runQuiz(host, gen, onDone) {
  const qs = gen();
  let i = 0, score = 0;
  const per = {}, wrong = [];
  host.hidden = false;
  function show() {
    const q = qs[i];
    host.innerHTML = '<div class="q-count">Câu ' + (i + 1) + ' trên ' + qs.length + '</div><p class="q-prompt">Định nghĩa này mô tả thuật ngữ nào?</p><div class="q-def">' + esc(q.prompt) + '</div><div>' +
      q.options.map((o, k) => '<button type="button" class="opt" data-k="' + k + '"><span class="k">' + 'ABCD'.charAt(k) + '</span><span>' + esc(o.t) + (o.ab ? ' (' + esc(o.ab) + ')' : '') + '</span></button>').join('') +
      '</div><div class="q-fb" hidden></div><div class="foot-row" data-nx hidden></div>';
    $$('.opt', host).forEach(b => b.addEventListener('click', () => pick(+b.dataset.k)));
  }
  function pick(k) {
    const q = qs[i], ok = q.options[k].id === q.term.id, m = q.term.m[0];
    per[m] = per[m] || {c: 0, n: 0}; per[m].n++;
    if (ok) { score++; per[m].c++; } else { wrong.push(q.term); }
    $$('.opt', host).forEach((b, j) => { b.disabled = true; if (q.options[j].id === q.term.id) b.classList.add('right'); else if (j === k) b.classList.add('wrong'); });
    const fb = $('.q-fb', host);
    fb.hidden = false; fb.className = 'q-fb ' + (ok ? 'ok' : 'no');
    fb.innerHTML = (ok ? '<b>Đúng.</b> ' : '<b>Chưa đúng.</b> Đáp án là <b>' + esc(q.term.t) + '</b>. ') + esc(fullDef(q.term));
    const nx = $('[data-nx]', host); nx.hidden = false;
    nx.innerHTML = '<button class="btn sm" type="button">' + (i === qs.length - 1 ? 'Xem kết quả' : 'Câu tiếp theo') + '</button>';
    const btn = $('button', nx);
    btn.addEventListener('click', () => { i++; if (i < qs.length) show(); else finish(); });
    btn.focus();
  }
  function finish() {
    const pct = Math.round(score / qs.length * 100);
    host.innerHTML = '<div class="res"><h4>Kết quả: ' + score + '/' + qs.length + ' (' + pct + '%)</h4>' +
      (wrong.length ? '<p>Những thuật ngữ cần xem lại:</p><ul>' + wrong.map(t => '<li><b>' + esc(t.t) + '</b>: ' + esc(fullDef(t)) + '</li>').join('') + '</ul>' : '<p>Bạn trả lời đúng tất cả các câu.</p>') +
      '<div data-extra></div><div class="foot-row"><button class="btn alt sm" type="button" data-retry>Làm lại với câu hỏi mới</button></div></div>';
    $('[data-retry]', host).addEventListener('click', () => runQuiz(host, gen, onDone));
    onDone({score: score, total: qs.length, pct: pct, per: per, wrong: wrong, extra: $('[data-extra]', host)});
  }
  show();
}
function startModuleQuiz(id) {
  const host = $('#mqHost'); if (!host) return;
  runQuiz(host, () => shuffle(V2T.filter(t => t.m[0] === id && !t.noquiz)).slice(0, 5).map(makeQ), res => {
    state.best[id] = Math.max(state.best[id] || 0, res.pct); save();
    const b = $('#mqBest'); if (b) b.textContent = 'Điểm cao nhất ' + state.best[id] + '%';
    res.extra.innerHTML = '<div class="verdict ' + (res.pct >= 80 ? 'good' : 'bad') + '">' + (res.pct >= 80 ? 'Đạt. Bạn nắm tốt nhóm thuật ngữ này.' : 'Chưa đạt 80%. Đọc lại các thuật ngữ ở trên rồi làm lại.') + '</div>';
  });
}
function showDiagLast() { const el = $('#diagLast'); if (el) el.textContent = state.diag ? 'Lần gần nhất: ' + state.diag.score + '/' + state.diag.total : ''; }
function startDiag() {
  runQuiz($('#diagHost'), () => sampleQs(V2M.filter(m => m.core).map(m => m.id), 5), res => {
    state.diag = {score: res.score, total: res.total}; save(); showDiagLast();
    const ok = res.score >= 4;
    res.extra.innerHTML = '<div class="verdict ' + (ok ? 'good' : 'bad') + '">' + (ok ? 'Bạn nắm tốt ngôn ngữ nền. Phần A1 chỉ cần đọc lướt, hãy dồn thời gian cho A2 và A3.' : 'Nên học đầy đủ phần A1, đặc biệt A1.2.1 (ngôn ngữ chỉ số) và trang Thuật ngữ.') + '</div>';
  });
}
function showReadyLast() { const el = $('#readyLast'); if (el) el.textContent = state.ready ? 'Lần gần nhất: ' + state.ready.score + '/' + state.ready.total : ''; }
function startReady() {
  runQuiz($('#readyHost'), () => sampleQs(V2M.map(m => m.id), 15), res => {
    state.ready = {score: res.score, total: res.total}; state.done['A5.1.1'] = true; save(); showReadyLast(); renderRail();
    const rows = V2M.filter(m => res.per[m.id]).map(m => {
      const p = res.per[m.id], r = p.c / p.n;
      return '<div class="hrow"><span>' + m.no + '. ' + esc(m.title) + '</span><span class="hbar"><i style="width:' + (r * 100) + '%;background:' + (r >= 0.8 ? 'var(--ok)' : r >= 0.5 ? 'var(--amberb)' : 'var(--bad)') + '"></i></span><span>' + p.c + '/' + p.n + '</span></div>';
    }).join('');
    const weak = V2M.filter(m => res.per[m.id] && res.per[m.id].c < res.per[m.id].n).map(m => '<a href="#/glossary?m=' + m.id + '">' + m.no + '. ' + esc(m.title) + '</a>').join(', ');
    const ok = res.pct >= 70;
    res.extra.innerHTML = '<div class="heat">' + rows + '</div><div class="verdict ' + (ok ? 'good' : 'bad') + '">' + (ok ? 'Bạn đã sẵn sàng.' : 'Nên ôn lại các nhóm thuật ngữ dưới đây.') + (weak ? ' Cần xem lại: ' + weak + '.' : '') + '</div>';
  });
}

/* ================= tools: wire up the calculators rendered inside a topic ================= */
function initTools(keys) {
  const has = k => keys.indexOf(k) !== -1;
  if (has('pl')) initPL();
  if (has('puz')) initPuzzle();
  if (has('pr')) { $$('#prTool input').forEach(i => i.addEventListener('input', prRender)); prRender(); }
  if (has('cv')) initConverter();
  if (has('mm')) { $$('#mmTool input').forEach(i => i.addEventListener('input', mmRender)); mmRender(); }
  if (has('in')) initIncremental();
  if (has('do')) { $$('#doTool input').forEach(i => i.addEventListener('input', doRender)); doRender(); }
  if (has('chk')) renderChk();
}

/* ================= bootstrap ================= */
function init() {
  document.documentElement.dataset.mode = state.mode;
  $$('.seg [data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));

  $('.skip').addEventListener('click', e => { e.preventDefault(); $('#view').focus(); });
