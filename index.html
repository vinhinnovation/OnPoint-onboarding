/* OnPoint Onboarding - brand: red On, deep teal Point, gradient mark. Backgrounds 01 dark, 02 gradient, 03 light. */
:root{
  --ink:#0f2227;--ink2:#264047;--mute:#5b6b6f;--line:#dbe4e7;--soft:#f3f6f7;--paper:#fff;
  --teal:#054a54;--teal2:#1e92a1;--teal3:#d9eff2;--red:#b1282e;--red2:#8f1f25;--coral:#ee7378;--coral2:#fdeaea;
  --amber:#fff3cf;--amberb:#e3b341;--ok:#1f7a4d;--ok2:#e4f4ec;--bad:#b1282e;--bad2:#fbe6e7;
  --f-head:'Plus Jakarta Sans','Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-body:'Be Vietnam Pro','Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --teal-t:#054a54;--red-t:#b1282e;--hdr:rgba(255,255,255,.96);--tmbg:#0f2227;--btnh:#0f2227;
  --r:14px;--sh:0 1px 2px rgba(15,34,39,.06),0 6px 20px rgba(15,34,39,.06);
  color-scheme:light;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font:400 16px/1.6 var(--f-body);color:var(--ink);background-color:var(--paper)}
img{max-width:100%;height:auto}
a{color:var(--teal-t);text-underline-offset:2px}
a:hover{color:var(--red-t)}
h1,h2,h3,h4,h5{font-family:var(--f-head);line-height:1.2;margin:0;color:var(--ink)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--teal2);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
[hidden]{display:none !important}

/* ---------- modes ---------- */
html[data-mode="learner"] .review-only,html[data-mode="learner"] .rv,html[data-mode="learner"] .pr{display:none !important}
html[data-mode="review"] .rv{background:var(--amber);border-radius:3px;box-shadow:0 0 0 2px var(--amber)}
html[data-mode="review"] .pr{color:var(--mute);font-size:.84em}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hdr);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1480px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand img{height:30px;width:auto;display:block}
.brand b{font:700 .78rem var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--teal-t);border-left:2px solid var(--line);padding-left:10px}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink2);font:600 .9rem var(--f-head)}
.nav a:hover,.nav a.on{background:var(--teal3);color:var(--teal-t)}
.top .sp{flex:1}
.hs{display:flex;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;height:38px;width:min(280px,34vw)}
.hs input{flex:1;min-width:0;border:0;background:transparent;font:500 .9rem var(--f-body);color:var(--ink);outline:none}
.hs button{border:0;background:var(--teal);color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.9rem}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font:600 .8rem var(--f-head);color:var(--mute);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.menu{display:none;border:1px solid var(--line);background:var(--paper);border-radius:10px;width:40px;height:40px;font-size:1.2rem;cursor:pointer}

/* ---------- shell and rail ---------- */
.shell{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);align-items:start}
body[data-page="home"] .shell,body[data-page="glossary"] .shell,body[data-page="start"] .shell{grid-template-columns:minmax(0,1fr)}
body[data-page="home"] .rail,body[data-page="glossary"] .rail,body[data-page="start"] .rail{display:none}
.rail{position:sticky;top:calc(62px + env(safe-area-inset-top,0px));max-height:calc(100vh - 62px);overflow:auto;padding:18px 14px 40px 20px;border-right:1px solid var(--line);font-size:.9rem}
.rail .r-link{display:block;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink2);font-weight:600}
.rail .r-link:hover,.rail .on{background:var(--teal3);color:var(--teal-t)}
.rail .r-big{margin:14px 0 2px;padding:6px 10px;font:800 .72rem var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--red-t);display:block;text-decoration:none}
.rail .r-grp{margin:8px 10px 2px;font:700 .72rem var(--f-body);color:var(--mute)}
.rail a.r-t{display:flex;gap:8px;padding:5px 10px;border-radius:8px;text-decoration:none;color:var(--ink);line-height:1.35}
.rail a.r-t i{font-style:normal;flex:none;width:44px;color:var(--mute);font-size:.78rem;padding-top:2px}
.rail a.r-t:hover{background:var(--soft)}
.rail a.r-t.on{background:var(--teal3);color:var(--teal-t);font-weight:700}
.rail a.r-t.dn::after{content:"\2713";margin-left:auto;color:var(--ok);font-weight:800}
.scrim{display:none}
main{min-width:0;outline:none}
.foot{margin-top:60px;border-top:1px solid var(--line);background:var(--soft);padding:26px 0;font-size:.85rem;color:var(--mute)}
.foot .wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.foot img{height:24px}
.foot p{margin:0;flex:1;min-width:240px}

/* ---------- buttons, chips ---------- */
.btn{appearance:none;display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border:2px solid var(--teal);border-radius:999px;background:var(--teal);color:#fff;font:700 .92rem/1.2 var(--f-head);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--btnh);border-color:var(--btnh);color:#fff}
.btn.alt{background:transparent;color:var(--teal-t)}
.btn.alt:hover{background:var(--teal3);color:var(--teal-t);border-color:var(--teal-t)}
.btn.red{background:var(--red);border-color:var(--red-t)}
.btn.red:hover{background:var(--red2);border-color:var(--red2)}
.btn.light{background:#fff;border-color:#fff;color:#054a54}
.btn.light:hover{background:#fdeaea;border-color:#fdeaea;color:#b1282e}
.btn.sm{padding:6px 13px;font-size:.8rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font:600 .74rem/1.4 var(--f-body);color:var(--ink2);text-decoration:none}
a.chip:hover{background:var(--teal3);color:var(--teal-t)}
.chip.rv2{background:var(--amber);border-color:var(--amberb)}
.chip.t{background:var(--teal3);border-color:#b7dde2;color:var(--teal-t)}
.chip.r{background:var(--coral2);border-color:#f5c3c4;color:var(--red-t)}
.tm{display:inline-flex;padding:2px 9px;border-radius:6px;background:var(--tmbg);color:#fff;font:700 .7rem/1.5 var(--f-head);letter-spacing:.02em;white-space:nowrap}
.foot-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}

/* ---------- home ---------- */
.hero{position:relative;background:var(--paper) var(--bg3) right top/cover no-repeat;border-bottom:1px solid var(--line)}
.hero .wrap.hg{display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:center;padding-top:54px;padding-bottom:54px}
.kick{font:800 .76rem var(--f-head);letter-spacing:.16em;text-transform:uppercase;color:var(--red-t);margin:0 0 14px}
.hero h1{font:800 clamp(2.4rem,5.4vw,4rem)/1.04 var(--f-head);letter-spacing:-.02em;color:var(--ink)}
.hero h1 .on{color:var(--red-t)}.hero h1 .pt{color:var(--teal-t)}
.hero p.lede{font-size:1.14rem;color:var(--ink2);max-width:34em;margin:18px 0 26px}
.pos{display:inline-block;margin:-8px 0 24px;padding:8px 16px;border-left:4px solid var(--red);background:var(--paper);border-radius:0 10px 10px 0;font:700 .88rem/1.4 var(--f-head);color:var(--ink2);box-shadow:var(--sh)}
.hero .mk{justify-self:center;width:min(340px,80%);filter:drop-shadow(0 18px 30px rgba(177,40,46,.2))}
.facts{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);margin-top:36px;overflow:hidden;box-shadow:var(--sh)}
.fact{padding:16px 18px;border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact b{display:block;font:800 1.6rem/1.1 var(--f-head);color:var(--teal-t)}
.fact span{font-size:.82rem;color:var(--mute)}
.cap{background:#0e2228 var(--bg1) right bottom/cover no-repeat;color:#fff;padding:64px 0 70px}
.cap h2{color:#fff;font:800 clamp(1.7rem,3.4vw,2.5rem)/1.1 var(--f-head)}
.cap .kick{color:var(--coral)}
.cap .sub{color:#c7d8dc;max-width:46em;margin:12px 0 0}
.house{margin-top:30px}
.roof{position:relative;height:104px;clip-path:polygon(0 100%,50% 0,100% 100%);background:linear-gradient(180deg,var(--red) 0,var(--red2) 100%);display:flex;align-items:flex-end;justify-content:center;padding:0 22% 12px;text-align:center}
.roof span{font:700 .95rem/1.3 var(--f-head);color:#fff;max-width:520px}
.pillars{display:grid;grid-template-columns:1fr 2fr 1fr 2fr 1fr;gap:10px;margin-top:10px}
.pillar{display:flex;flex-direction:column;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:14px;overflow:hidden}
.p-h{appearance:none;border:0;text-align:left;cursor:pointer;background:var(--pc);color:#fff;padding:13px 14px;font:800 .78rem/1.25 var(--f-head);letter-spacing:.07em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.p-h small{display:block;font:500 .72rem var(--f-body);letter-spacing:0;text-transform:none;opacity:.9;margin-top:3px}
.p-h[aria-expanded="true"]{box-shadow:inset 0 -4px 0 #fff}
.p-b{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;padding:10px;flex:1}
.p-g h5{background:rgba(238,115,120,.2);color:#ffd9da;border-radius:8px;padding:8px 10px;font:700 .74rem/1.25 var(--f-head);min-height:3.1em}
.svc{display:block;margin-top:7px;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.1);color:#fff;text-decoration:none;font:500 .8rem/1.3 var(--f-body)}
.svc:hover{background:#fff;color:#054a54}
.p-o{background:#fff;color:var(--pc);text-align:center;padding:10px 8px;font:800 .8rem var(--f-head);letter-spacing:.04em}
.p-o small{display:block;font:600 .66rem var(--f-body);color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.base{margin-top:10px;background:linear-gradient(90deg,var(--red),var(--coral));border-radius:12px;padding:15px;text-align:center;font:800 1rem var(--f-head);letter-spacing:.12em;text-transform:uppercase}
.pdetail{margin-top:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:18px 20px;min-height:84px}
.pdetail h3{color:#fff;font-size:1.15rem}
.pdetail p{margin:8px 0 0;color:#d4e3e6}
.pdetail .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pdetail .links a{background:#fff;color:#054a54;padding:5px 12px;border-radius:999px;font:700 .8rem var(--f-head);text-decoration:none}
.pdetail .links a:hover{background:#fdeaea;color:#b1282e}
.journey{margin-top:42px}
.journey h3{color:#fff;font:800 1.2rem var(--f-head)}
.journey p.n{color:#c7d8dc;margin:6px 0 16px;font-size:.92rem}
.stages{display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.stg{position:relative;display:block;text-decoration:none;color:#fff;background:var(--pc);padding:16px 22px 16px 26px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%,18px 50%);margin-right:-10px;min-height:92px}
.stg:first-child{clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%);padding-left:18px}
.stg b{display:block;font:800 .95rem/1.2 var(--f-head)}
.stg span{display:block;font-size:.72rem;opacity:.92;margin-top:4px;line-height:1.3}
.stg:hover{filter:brightness(1.15)}
.path{padding:64px 0 10px}
.path h2,.gteaser h2{font:800 clamp(1.6rem,3vw,2.2rem)/1.1 var(--f-head)}
.path .sub{color:var(--mute);margin:8px 0 26px;max-width:46em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.bcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--ink);background:var(--paper);box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.bcard:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(15,34,39,.14);color:var(--ink)}
.bcard .hd{background:var(--bg2) center/cover,var(--red);color:#fff;padding:22px 20px 18px;position:relative;min-height:112px}
.bcard .hd i{font:800 2.2rem/1 var(--f-head);font-style:normal;opacity:.95}
.bcard .hd h3{color:#fff;font-size:1.05rem;margin-top:8px}
.bcard .bd{padding:16px 20px 18px;flex:1;display:flex;flex-direction:column;gap:12px}
.bcard .bd p{margin:0;font-size:.9rem;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.bcard .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--mute)}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;flex:1;margin-left:12px}
.bar i{display:block;height:100%;background:var(--teal2)}
.gteaser{padding:56px 0 6px}
.gsearch{display:flex;gap:10px;margin:18px 0 12px;flex-wrap:wrap}
.gsearch input{flex:1;min-width:220px;font:500 1rem var(--f-body);padding:13px 18px;border:2px solid var(--line);border-radius:999px;background:var(--paper)}
.gsearch input:focus{border-color:var(--teal2);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.start{margin-top:50px;background:var(--bg2) center/cover,var(--red);border-radius:20px;color:#fff;padding:38px 36px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.start h2{color:#fff;font-size:1.6rem}.start p{margin:8px 0 0;max-width:36em}

/* ---------- big topic hero and topic page ---------- */
.bhero{background:var(--bg2) center/cover,var(--red);color:#fff;padding:46px 0 40px}
.bhero .wrap{max-width:880px;margin:0}
.bhero .kick{color:#fff;opacity:.9}
.bhero h1{color:#fff;font:800 clamp(1.9rem,4vw,2.8rem)/1.08 var(--f-head)}
.bhero p{max-width:40em;margin:14px 0 0;font-size:1.05rem}
.page{max-width:880px;padding:30px 28px 0}
.crumbs{font-size:.8rem;color:var(--mute);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--mute);text-decoration:none}.crumbs a:hover{color:var(--red-t)}
.t-head .tid{display:inline-block;font:800 .78rem var(--f-head);letter-spacing:.12em;color:var(--red-t)}
.t-head h1{font:800 clamp(1.7rem,3.4vw,2.4rem)/1.1 var(--f-head);margin:6px 0 12px}
.lede{font-size:1.08rem;color:var(--ink2);margin:0 0 14px}
.lede .rv{display:inline}
.gblock{margin-top:34px}
.gblock>h2{font:800 1.3rem var(--f-head);color:var(--teal-t);padding-bottom:8px;border-bottom:2px solid var(--teal3)}
.gblock>p{color:var(--mute);margin:8px 0 0;font-size:.95rem}
.tlist{display:grid;gap:12px;margin-top:16px}
.tl{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--paper)}
.tl:hover{border-color:var(--teal2);box-shadow:var(--sh);color:var(--ink)}
.tl i{font:800 .8rem var(--f-head);font-style:normal;color:var(--red-t);min-width:56px}
.tl b{font:700 1rem var(--f-head)}
.tl p{margin:2px 0 0;font-size:.88rem;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl.dn{border-color:#b9ddc9;background:#f6fbf8}
.items{display:grid;gap:16px;margin-top:22px}
.item{border:1px solid var(--line);border-left:5px solid var(--teal2);border-radius:12px;padding:16px 20px;background:var(--paper)}
.item h3{font:700 1.06rem var(--f-head);margin-bottom:8px;color:var(--teal-t)}
.item p{margin:6px 0}
.item ul,.evid ul{margin:6px 0 4px;padding-left:20px}
.item li{margin:4px 0}
.src{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:.78rem;color:var(--mute)}
.evid{margin-top:22px;border-radius:12px;background:var(--coral2);border:1px solid #f5c3c4;padding:16px 20px}
.evid h3{font:800 1rem var(--f-head);color:var(--red-t);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.gl{margin-top:22px}
.gl h3{font:800 1rem var(--f-head);margin-bottom:10px}
.rvnote{margin-top:22px;padding:12px 16px;border-radius:10px;background:var(--amber);border:1px solid var(--amberb);font-size:.88rem}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:34px;flex-wrap:wrap}
.pn a{flex:1;min-width:220px;border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-decoration:none;color:var(--ink)}
.pn a:hover{border-color:var(--teal2)}
.pn a span{display:block;font-size:.72rem;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.pn a.nx{text-align:right}
.mdl{margin:22px 0;background:#0e2228 var(--bg1) right bottom/cover;border-radius:18px;padding:22px;color:#fff}
.mdl .pillars{grid-template-columns:1fr}
.mdl .p-b{grid-template-columns:1fr}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:14px 0;background:var(--paper)}.tw table{min-width:420px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--soft);font:700 .76rem var(--f-head);letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.k{font-weight:700;white-space:nowrap}

/* ---------- glossary ---------- */
.gh{background:var(--bg3) right top/cover,var(--paper);border-bottom:1px solid var(--line);padding:34px 0 26px}
.gh h1{font:800 clamp(1.9rem,4vw,2.8rem)/1.08 var(--f-head)}
.gh p{color:var(--ink2);margin:10px 0 0;max-width:44em}
.gbar{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.gbar input[type=search]{flex:1;min-width:240px;font:500 1.05rem var(--f-body);padding:14px 20px;border:2px solid var(--line);border-radius:999px;background:var(--paper);box-shadow:var(--sh)}
.gbar input:focus{border-color:var(--teal2);outline:none}
.glay{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;margin-top:26px;align-items:start}
.gside{position:sticky;top:78px;max-height:calc(100vh - 92px);overflow:auto;padding-right:6px;font-size:.9rem}
.gside h4{font:800 .72rem var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
.gside h4:first-child{margin-top:0}
.fl{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--ink);font:500 .88rem/1.35 var(--f-body)}
.fl:hover{background:var(--soft)}
.fl[aria-pressed="true"]{background:var(--teal3);color:var(--teal-t);font-weight:700}
.fl em{font-style:normal;color:var(--mute);font-size:.78rem;flex:none}
.fl.new::before{content:"";width:6px;flex:none;border-radius:3px;background:var(--coral);margin-right:2px}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.gtop .cnt{font-weight:700}
.fbtn{display:none}
.mhead{margin:30px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--teal3);display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.mhead h2{font:800 1.25rem var(--f-head);color:var(--teal-t)}
.mhead span{font-size:.82rem;color:var(--mute)}
.mintro{color:var(--mute);margin:-4px 0 12px;font-size:.92rem;max-width:50em}
.grow{margin:14px 0 6px;font:800 .72rem var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--red-t)}
.term{border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:10px 0;background:var(--paper);scroll-margin-top:84px}
.term.hl{border-color:var(--teal2);box-shadow:0 0 0 4px var(--teal3)}
.term .th{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.term h3{font:800 1.08rem var(--f-head);color:var(--ink)}
.term h3 .ab{font:700 .72rem var(--f-head);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin-left:8px;color:var(--ink2);vertical-align:2px}
.term .sb{color:var(--mute);font-size:.88rem;margin:2px 0 0}
.term .chs{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.term p{margin:8px 0 0}
.term .en{color:var(--ink2);font-size:.9rem}
.term .en i{font-style:normal;font:700 .66rem var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--teal-t);margin-right:6px}
.term code,.op code{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--soft);font:600 .84rem ui-monospace,Menlo,Consolas,monospace;color:var(--ink);white-space:normal}
.term .lbl{font:800 .66rem var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--teal-t);margin-right:6px}
.term .see{font-size:.84rem;color:var(--mute);margin-top:8px}
.ctx{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--teal3);border-left:4px solid var(--teal2);font-size:.92rem}
.op{margin-top:12px;border-left:4px solid var(--coral);background:var(--coral2);border-radius:0 10px 10px 0;padding:10px 14px}
.op .oh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:800 .7rem var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--red-t)}
.op .oh em{font:600 .8rem var(--f-body);text-transform:none;letter-spacing:0;color:var(--ink2);font-style:normal}
.op p{margin:6px 0 0}
.op .cf{margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--amber);font-size:.84rem}
.senses{margin:10px 0 0;padding:0;list-style:none;counter-reset:s}
.senses li{counter-increment:s;position:relative;margin:0;padding:10px 0 10px 34px;border-top:1px dashed var(--line)}
.senses li:first-child{border-top:0}
.senses li::before{content:counter(s);position:absolute;left:0;top:10px;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;text-align:center;font:800 .76rem/24px var(--f-head)}
.senses .or{display:block;margin:-6px 0 4px;font:800 .72rem var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--red-t)}
.senses b{font-family:var(--f-head)}
.senses p{margin:4px 0 0}
.nodef{color:var(--mute);font-style:italic;margin-top:8px}
.empty{padding:40px 10px;text-align:center;color:var(--mute)}
.gtable td a{font-weight:700;text-decoration:none}
.gtable td.d{max-width:520px;color:var(--ink2)}
.qpanel{border:2px solid var(--teal);border-radius:14px;padding:16px 20px;margin:12px 0;background:var(--paper)}

/* ---------- tools, quiz ---------- */
.tool{border:1px solid var(--line);border-radius:14px;background:var(--paper);margin:22px 0;overflow:hidden;box-shadow:var(--sh)}
.tool-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--teal);color:#fff;padding:11px 18px}
.tool-h h4{margin:0;color:#fff;font-size:1.02rem}.tool-h span{font-size:.8rem;opacity:.9}
.tool-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.tool-in{padding:16px 18px;display:grid;gap:10px;align-content:start}
.tool-out{padding:16px 18px;background:var(--soft);border-left:1px dashed var(--line)}
.tool-wide{padding:16px 18px}
.f{display:grid;gap:3px;align-content:start;font-size:.84rem;color:var(--ink2)}
.f input,.f select,.f textarea{width:100%;font:500 .95rem var(--f-body);padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.f input:focus,.f select:focus{border-color:var(--teal2);outline:none}
.f small{color:var(--mute)}
.f input[type="range"]{padding:0;border:0;accent-color:var(--teal-t);width:calc(100% - 3ch);vertical-align:middle}
.f b{font:800 1.05rem var(--f-head)}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
.frow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.ln{display:flex;align-items:baseline;gap:6px;padding:2px 0}
.ln i{flex:1;border-bottom:1px dotted var(--mute);transform:translateY(-3px)}
.ln .v{font-weight:700}.ln .pc{color:var(--mute);min-width:11ch;text-align:right}
.ln.tot{border-top:2px solid var(--ink);margin-top:6px;padding-top:5px;font-weight:700}
.ln.neg .v{color:var(--bad)}
.mini{height:4px;background:var(--line);margin:0 0 3px;border-radius:3px;overflow:hidden}.mini u{display:block;height:100%;background:var(--teal2)}
.out-note{margin:10px 0 0;font-size:.85rem;color:var(--ink2)}
.verdict{margin:10px 0 0;padding:9px 13px;border-left:6px solid var(--teal);background:var(--soft);border-radius:0 10px 10px 0;font-weight:500;font-size:.92rem}
.verdict.good{border-color:var(--ok);background:var(--ok2)}.verdict.bad{border-color:var(--bad);background:var(--bad2)}
.chk label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:.94rem;cursor:pointer}
.chk input{margin-top:.3em;width:18px;height:18px;accent-color:var(--teal-t);flex:none}
.chk h5{margin:14px 0 2px;font:800 1rem var(--f-head);color:var(--teal-t)}
.q-count{font-size:.82rem;color:var(--mute);margin-bottom:2px}
.q-prompt{font-weight:700;margin:0 0 8px}
.q-def{border-left:5px solid var(--coral);padding:9px 14px;background:var(--soft);border-radius:0 10px 10px 0;margin-bottom:12px}
.opt{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;padding:10px 14px;margin:7px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:500 .95rem/1.4 var(--f-body);cursor:pointer}
.opt .k{font:800 1rem var(--f-head);min-width:1.1em;color:var(--teal-t)}
.opt:hover:not([disabled]){background:var(--teal3);border-color:var(--teal2)}
.opt.right{background:var(--ok2);border-color:var(--ok)}.opt.wrong{background:var(--bad2);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.q-fb{margin:10px 0;padding:9px 13px;border-left:5px solid var(--teal);background:var(--soft);border-radius:0 10px 10px 0;font-size:.92rem}
.q-fb.ok{border-color:var(--ok)}.q-fb.no{border-color:var(--bad)}
.res h4{margin:0 0 6px}.res ul{margin:8px 0 12px;padding-left:20px}
.heat{display:grid;gap:6px;margin:12px 0}
.hrow{display:grid;grid-template-columns:minmax(120px,260px) 1fr auto;gap:10px;align-items:center;font-size:.88rem}
.hbar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}.hbar i{display:block;height:100%}
.assess{display:grid;gap:10px;margin:14px 0}
.sec{margin:28px 0 8px;font:800 1.2rem var(--f-head);color:var(--teal-t)}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .pillars{grid-template-columns:1fr 1fr}
  .pillar:nth-child(2),.pillar:nth-child(4){grid-column:span 2}
  .roof{padding:0 14% 12px}
}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;top:62px;bottom:0;width:min(86vw,330px);background:var(--paper);z-index:60;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--sh)}
  .rail.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:62px 0 0 0;background:rgba(15,34,39,.45);z-index:55}
  .menu{display:inline-block}
  .nav{display:none}
  .hero .wrap.hg{grid-template-columns:1fr}.hero .mk{width:150px;justify-self:start;order:-1}
  .facts{grid-template-columns:repeat(2,1fr)}.fact{border-bottom:1px solid var(--line)}
  .stages{grid-template-columns:1fr}.stg,.stg:first-child{clip-path:none;margin:0 0 6px;border-radius:12px;min-height:0;padding:12px 16px}
  .glay{grid-template-columns:1fr}
  .gside{position:static;max-height:none;display:none;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper)}
  .gside.open{display:block}
  .fbtn{display:inline-flex}
  .tool-b{grid-template-columns:1fr}.tool-out{border-left:0;border-top:1px dashed var(--line)}
  .brand b{display:none}
}
@media (max-width:640px){
  .wrap{padding:0 16px}.page{padding:22px 16px 0}
  .pillars{grid-template-columns:1fr}.pillar:nth-child(2),.pillar:nth-child(4){grid-column:auto}
  .p-b{grid-template-columns:1fr}
  .roof{clip-path:none;height:auto;border-radius:14px 14px 0 0;padding:14px 16px}.roof span{font-size:.84rem}
  .cap{background-image:linear-gradient(rgba(14,34,40,.62),rgba(14,34,40,.62)),var(--bg1)}
  .hs{display:none}
  .top .in{gap:10px;padding:0 12px}
  .start{padding:26px 22px}
  .frow3{grid-template-columns:1fr 1fr}
  .hrow{grid-template-columns:1fr auto}.hrow .hbar{grid-column:1/-1}
}
@media print{.top,.rail,.foot,.btn,.gside{display:none !important}}

<script type="application/json" id="data">{"content":{"a0":{"ov":"Trang khởi đầu: hồ sơ nhanh (vai trò, ngành hàng chính tùy chọn, tự đánh giá mức tự tin từ 1 đến 5) và mini-diagnostic 5 câu (tùy chọn): mỗi câu cho một định nghĩa, người học chọn thuật ngữ đúng; đạt từ 4/5 thì phần nền tảng A1 chỉ cần đọc lướt."},"hide_items":["A4.1.1-05","A4.1.2-05","A4.1.3-05","A4.2.1-01","A4.2.1-02","A4.2.1-03"],"hide_topics":["A4.2.1","A5.2.2"],"big":[{"id":"A1","name":"Nền tảng ngành (Ecommerce MasterClass)","ov":"Phần nền chung cho mọi nhân sự mới, bất kể chức năng: ai tham gia thương mại điện tử và làm gì, bán qua những mô hình nào, ngành hàng và người mua được mô tả ra sao, bộ chỉ số dùng xuyên suốt và hai cách đọc P&L. Nội dung không riêng OnPoint; mục đích là để các phần sau dùng cùng một ngôn ngữ.","groups":[{"id":"A1.1","name":"Bức tranh thị trường","ov":"Ai tham gia thị trường TMĐT, bán qua mô hình nào, và cách mô tả một ngành hàng cùng người mua.","stage":"","note":"","topics":[{"id":"A1.1.1","name":"Key players","ov":"Sáu bên trong chuỗi bán hàng TMĐT và vai trò của từng bên: mỗi bên làm gì và cần gì. OnPoint giữ nhiều vai cùng lúc (enabler, đối tác fulfillment, bên nắm tồn kho, nhà cung cấp công nghệ), nên topic kết thúc bằng việc xác định OnPoint đứng ở đâu.","src":"Cred + Đã có","stage":"","where":"p.3, 4, 10","terms":[{"m":"m1","focus":""}],"evid":"","note":"","items":[{"id":"A1.1.1-01","name":"Brand","text":"Sở hữu thương hiệu và sản phẩm; quyết định chiến lược kinh doanh, giá và khuyến mại. Cần doanh thu, độ phủ, dữ liệu khách hàng và lợi nhuận kênh. Có thể tự vận hành kênh TMĐT hoặc giao cho đối tác (enabler, nhà phân phối).","src":"Đã có","where":"Bản web v2: Key players; module Seller và Gian hàng"},{"id":"A1.1.1-02","name":"Platform","text":"Vận hành sàn hoặc ứng dụng: hiển thị, thanh toán, chương trình khuyến mại; thu phí và quảng cáo. Một số sàn có mạng lưới logistics riêng. Cần nguồn cung đa dạng, traffic và GMV.\n• Sàn và nền tảng OnPoint hợp tác: Shopee, TikTok Shop, Lazada, Tiki ⟦pr⟧(p.3, p.4)⟦/pr⟧.","src":"Cred + Đã có","where":"Bản web v2: Key players; Credential p.3, p.4"},{"id":"A1.1.1-03","name":"Enabler","text":"Cung cấp giải pháp và dịch vụ giúp nhãn hàng bán trên sàn: vận hành gian hàng, quảng cáo, dữ liệu. Cần hợp đồng ổn định và hiệu quả đo lường được.\n• OnPoint tự định vị là end-to-end brand ecommerce business partner ⟦pr⟧(p.3, p.4)⟦/pr⟧.","src":"Cred + Đã có","where":"Bản web v2: Key players; Credential p.3, p.4"},{"id":"A1.1.1-04","name":"Logistics/Fulfillment partner (ví dụ GHN, GHTK, AhaMove, Lazada Logistics)","text":"Lưu kho, đóng gói, vận chuyển và xử lý hoàn trả cho nhãn hàng hoặc sàn, gồm đơn vị vận chuyển, 3PL và dịch vụ fulfillment của sàn. Cần dự báo đơn hàng, thông tin đơn rõ ràng và SLA thống nhất.\n• Ví dụ ở bản web: GHN, GHTK, J&T Express, SPX Express, Lazada Logistics (LEX).\n• Credential ⟦pr⟧(p.3, p.4)⟦/pr⟧ hiển thị GHN, Giaohangtietkiem, AhaMove, Lazada Logistics trong nhóm đối tác chiến lược.","src":"Cred + Đã có","where":"Bản web v2: Key players; Credential p.3, p.4"},{"id":"A1.1.1-05","name":"Creator và MCN","text":"Tạo nội dung và dẫn người xem đến mua; MCN quản lý mạng lưới creator. Cần hoa hồng, sản phẩm đáng bán và hỗ trợ nội dung.\n• OnPoint làm việc với 30+ MCN/agency và sở hữu 19,000+ creator ⟦pr⟧(p.44)⟦/pr⟧. Chi tiết ở A3.3.4.","src":"Cred + Đã có","where":"Bản web v2: Key players; Credential p.44"},{"id":"A1.1.1-06","name":"Người tiêu dùng","text":"Tìm hiểu, mua, dùng và đánh giá. Cần giá tốt, sự tin cậy, giao nhanh và trải nghiệm mượt. Khác với shopper (người trực tiếp mua trên kênh), xem A1.1.3.","src":"Đã có","where":"Bản web v2: Key players"},{"id":"A1.1.1-07","name":"OnPoint đứng ở đâu (giữ nhiều vai cùng lúc)","text":"OnPoint giữ nhiều vai cùng lúc, tùy mô hình hợp tác với Brand:\n• Enabler: vận hành gian hàng, media, livestream, affiliate, CS (Service model)\n• Thêm vai đối tác fulfillment khi vận hành warehousing và fulfillment (Consignment model)\n• Thêm vai bên nắm tồn kho khi theo Distribution model (inventory ownership)\n• Bán công nghệ (OctoPOS, OPOLLO) cho Brand và seller tự vận hành (SaaS model)\nCùng một việc có thể do OnPoint làm ở mô hình này nhưng do Brand hoặc bên khác làm ở mô hình khác. Ánh xạ theo sơ đồ vòng tròn lồng nhau ở p.10.","src":"Cred","where":"Credential p.4, p.10, p.25"}]},{"id":"A1.1.2","name":"Mô hình bán hàng","ov":"Các cách một sản phẩm đến tay người mua trên kênh online: ba mô hình bán qua sàn hoặc retail (Marketplace, Retail Outright, Retail Consignment), cộng Social commerce, D2C và Omnichannel. Mỗi mô hình khác nhau ở chỗ ai sở hữu hàng, ai chịu rủi ro tồn kho, ai quyết định giá, bên bán lại kiếm gì và dòng tiền chạy ra sao.","src":"Cred + Đã có","stage":"","where":"p.10, 11","terms":[],"evid":"","note":"","items":[{"id":"A1.1.2-01","name":"Marketplace","text":"• Chủ sở hữu hàng khi bán: Seller; rủi ro tồn kho: Seller\n• Giá và khuyến mại: Seller quyết định, theo luật chơi của sàn\n• Bên bán lại kiếm gì: sàn thu phí nền tảng\n• Dòng tiền: khách trả cho sàn, sàn đối soát rồi thanh toán cho seller\n• Tồn kho do Seller báo cáo trên hệ thống của sàn","src":"Đã có","where":"Bản v1: bảng Bốn cách bán hàng, ai chịu rủi ro nào"},{"id":"A1.1.2-02","name":"Retail outright","text":"Retail hoặc sàn mua đứt hàng rồi bán lại.\n• Chủ sở hữu và rủi ro tồn kho: Retail hoặc sàn, sau khi mua\n• Giá và khuyến mại: Retail hoặc sàn quyết định\n• Kiếm chênh lệch giá bán và giá mua\n• Dòng tiền: Retail trả nhãn hàng khi nhập hàng\n• Tồn kho do Retail báo cáo","src":"Đã có","where":"Bản v1: bảng Bốn cách bán hàng, ai chịu rủi ro nào"},{"id":"A1.1.2-03","name":"Retail consignment","text":"Hàng ký gửi: bán xong mới thanh toán.\n• Chủ sở hữu và rủi ro tồn kho: nhãn hàng hoặc nhà phân phối\n• Giá và khuyến mại: nhãn hàng quyết định, Retail làm theo\n• Retail thu phí dịch vụ ký gửi\n• Dòng tiền: Retail thanh toán theo kỳ sau khi bán\n• Retail báo cáo tồn kho ký gửi cho nhãn hàng","src":"Đã có","where":"Bản v1: bảng Bốn cách bán hàng, ai chịu rủi ro nào"},{"id":"A1.1.2-04","name":"Social commerce","text":"Bán ngay trong luồng nội dung (video, livestream) trên mạng xã hội hoặc ứng dụng; người mua thường quyết định theo cảm xúc và niềm tin vào người trình bày. Hành trình điển hình: Watch, Trust, Impulse, Buy (so với Search, Compare, Buy trên sàn truyền thống).\n• Credential tách Social Commerce thành một kênh riêng cạnh E-commerce, Brand.com và Omnichannel ⟦pr⟧(p.10, p.11)⟦/pr⟧\n• OnPoint bắt đầu làm social commerce từ 10/2020 ⟦pr⟧(p.7; p.6 ghi 2020)⟦/pr⟧. Chi tiết ở A3.3.3 và A3.3.4.","src":"Cred + Đã có","where":"Bản v1: M3; Credential p.6, p.7, p.10, p.11"},{"id":"A1.1.2-05","name":"D2C","text":"Nhãn hàng bán trực tiếp qua website hoặc ứng dụng riêng (brand.com); giữ dữ liệu khách hàng và trải nghiệm nhưng phải tự tạo traffic.\n• OnPoint làm D2C từ 2019: bắt đầu với Bosch, onboard 12 thương hiệu của L'Oréal Group từ 3/2020, dịch vụ end-to-end ⟦pr⟧(p.6, p.7)⟦/pr⟧","src":"Cred + Đã có","where":"Bản v1: A1; Credential p.6, p.7, p.10"},{"id":"A1.1.2-06","name":"Omnichannel","text":"Bán và đáp ứng đơn xuyên các kênh online và offline từ một hệ thống.\n• OnPoint dùng OctoPOS (Omnichannel Accelerator): quản lý đơn và tồn kho thời gian thực, nhiều kênh bán, nhiều điểm tồn kho với geo routing ⟦pr⟧(p.10, p.65)⟦/pr⟧\n• Mốc 3/2021: nhà enabler omnichannel đầu tiên và duy nhất, giải Innovation của LazMall (trao cho Nestlé) năm 2021 ⟦pr⟧(p.7)⟦/pr⟧","src":"Cred","where":"Credential p.7, p.10, p.65"}]},{"id":"A1.1.3","name":"Ngành hàng và người mua","ov":"Một bản tổng quan ngành hàng trả lời ba câu hỏi: bán gì (category, price segment, Hero SKUs), bán cho ai (target consumers, target shoppers) và cạnh tranh với ai, ở đâu (key competitors, shopping missions). Đây là khung chung để đọc brief ngành hàng ở các phần sau.","src":"Đã có","stage":"","where":"","terms":[{"m":"mcat","focus":""}],"evid":"","note":"","items":[{"id":"A1.1.3-01","name":"Category và sub-category","text":"Category là nhóm sản phẩm cùng đáp ứng một nhu cầu (ví dụ Chăm sóc da). Sub-category là nhánh nhỏ hơn theo loại sản phẩm, công dụng hoặc đối tượng dùng (ví dụ Kem chống nắng, Sữa rửa mặt). Mục tiêu, thị phần và kế hoạch thường đặt theo từng category và sub-category. Cây ngành hàng nhiều cấp L1 đến L4 trên sàn (ví dụ Sức khỏe và Sắc đẹp, Chăm sóc da, Kem chống nắng).","src":"Đã có","where":"Bản web v2: module Tổng quan ngành hàng (định nghĩa soạn mới, cần duyệt)"},{"id":"A1.1.3-02","name":"Price segment","text":"Các nhóm sản phẩm trong cùng category chia theo mức giá (phổ thông, tầm trung, cao cấp). Dùng để xem sản phẩm đang cạnh tranh ở khoảng giá nào và khoảng giá nào tạo nhiều doanh số nhất. Liên quan Hero Price Band.","src":"Đã có","where":"Bản web v2: module Tổng quan ngành hàng (định nghĩa soạn mới, cần duyệt)"},{"id":"A1.1.3-03","name":"Hero SKUs","text":"Danh sách sản phẩm chủ lực của ngành hàng hoặc thương hiệu: kéo traffic, chuyển đổi hoặc nhận diện thương hiệu. Thường ghi kèm giá bán, doanh số và vai trò của từng SKU.","src":"Đã có","where":"Bản web v2: module Tổng quan ngành hàng (định nghĩa soạn mới, cần duyệt)"},{"id":"A1.1.3-04","name":"Key competitors","text":"Thương hiệu hoặc sản phẩm cạnh tranh trực tiếp cùng ngành hàng, phân khúc giá và nhóm người mua. Thường so sánh về giá, thị phần, mức khuyến mại, nội dung và vị trí hiển thị.","src":"Đã có","where":"Bản web v2: module Tổng quan ngành hàng (định nghĩa soạn mới, cần duyệt)"},{"id":"A1.1.3-05","name":"Target consumers","text":"Nhóm người dùng sản phẩm mà thương hiệu nhắm tới, mô tả theo nhân khẩu học, hành vi và nhu cầu (ví dụ nữ 22 đến 35 tuổi, quan tâm chăm sóc da). Consumer là người dùng, không nhất thiết là người mua.","src":"Đã có","where":"Bản web v2: module Tổng quan ngành hàng (định nghĩa soạn mới, cần duyệt)"},{"id":"A1.1.3-06","name":"Target shoppers","text":"Nhóm người trực tiếp quyết định và mua trên kênh, có thể khác người dùng (cha mẹ mua cho con, người mua quà tặng). Hiểu shopper giúp chọn nội dung, ưu đãi và vị trí hiển thị.","src":"Đã có","where":"Bản web v2: module Tổng quan ngành hàng (định nghĩa soạn mới, cần duyệt)"},{"id":"A1.1.3-07","name":"Shopping missions (Ecom, TTS)","text":"Mục đích cụ thể trong một lần mua sắm (mua theo kế hoạch, săn deal, mua bổ sung, khám phá món mới).\n• Ecom (Shopee, Lazada): mục tiêu rõ, tìm bằng search, so sánh giá và đánh giá, săn deal ngày sale. Hành trình: Search, Compare, Buy\n• TTS (TikTok Shop): bắt đầu từ nội dung, thuyết phục bởi người trình bày và ưu đãi trong phiên. Hành trình: Watch, Trust, Impulse, Buy","src":"Đã có","where":"Bản web v2: module Tổng quan ngành hàng (định nghĩa soạn mới, cần duyệt)"}]}]},{"id":"A1.2","name":"Ngôn ngữ và tiền","ov":"Bộ chỉ số và cách đọc lợi nhuận dùng xuyên suốt các phần sau: giá và doanh thu, phễu hành vi, hiệu quả marketing, và hai ngôn ngữ P&L (Marketplace và Trading term).","stage":"","note":"","topics":[{"id":"A1.2.1","name":"Ngôn ngữ chỉ số (Tier 1)","ov":"Ba nhóm chỉ số dùng ở mọi phần sau: giá và doanh thu (từ giá bán một SKU đến GMV của kênh), phễu hành vi (từ lượt hiển thị đến mua) và hiệu quả marketing (tiền chi ra so với doanh thu thu về). Công thức gốc: AOV = ASP x Unit per order; GMV = Traffic x CR x AOV.","src":"Đã có","stage":"","where":"","terms":[{"m":"m3","focus":""},{"m":"m5","focus":""},{"m":"m8","focus":""}],"evid":"","note":"","items":[{"id":"A1.2.1-01","name":"Giá và doanh thu (ASP, AOV, GMV, NMV)","text":"• ASP: giá bán trung bình một SKU; Unit per Order: số sản phẩm trung bình mỗi đơn; AOV = ASP x Unit per order\n• GMV = Traffic x CR x AOV: tổng giá trị hàng hóa bán ra\n• NMV: giá trị thực nhận sau khi loại đơn hủy/hoàn (một số doanh nghiệp trừ thêm giảm giá do seller tài trợ); luôn ghi rõ cách tính khi báo cáo\n• Pricing Architecture 3 tầng: List Price, Daily Price, Campaign Price (không thấp hơn điểm hòa vốn); Hero Price Band: khoảng giá chủ lực","src":"Đã có","where":"Bản web v2: module Giá và Doanh thu (3 công thức giữ nguyên bảng gốc)"},{"id":"A1.2.1-02","name":"Phễu hành vi (Impression đến CR)","text":"Impression (hiển thị) > Clicks > CTR (Click / Impression) > IPV (xem trang chi tiết) > ATC (thêm giỏ) > CR (chuyển đổi mua).\n• Traffic là biến đầu vào của GMV; Visitor là người duy nhất, Session là phiên; Bounce Rate là tỷ lệ phiên chỉ xem một trang\n• Bảng gốc ghi CR (%) = Unit sold / Clicks⟦rv⟧; công thức này lệch với GMV = Traffic x CR x AOV, đang chờ quyết định (xem Cần chốt)⟦/rv⟧","src":"Đã có","where":"Bản web v2: module Traffic và Phễu hành vi"},{"id":"A1.2.1-03","name":"Hiệu quả marketing (ROAS, ROI, CIR, CPC, CPO, CPM)","text":"• ROAS: doanh thu thu về trên mỗi đồng quảng cáo\n• CIR = Ad spend / Revenue = 1 / ROAS\n• CPC = Ad spend / Clicks; CPO = Ad spend / Orders; CPM = Ad spend / (Impressions / 1.000)\n• ROI (gốc): tỷ suất lợi nhuận ròng trên tổng chi phí đầu tư. Khác với ROI khuyến mại ở A3.6.2","src":"Đã có","where":"Bản web v2: module Hiệu quả và Chi phí marketing"}]},{"id":"A1.2.2","name":"Đọc P&L hai cách","ov":"Cùng một kênh có hai cách đọc lợi nhuận: P&L Marketplace (Brand bán qua gian hàng trên sàn, đọc từ GMV xuống EBIT) và P&L theo Trading term (Brand bán cho Retail hoặc sàn, đọc từ Sell-in, trừ front margin, back margin và hỗ trợ). Điểm chung: tổng chi phí kênh chiếm bao nhiêu % giá trị gốc; muốn so hai mô hình, quy về cùng một mẫu số trước.","src":"Đã có","stage":"","where":"","terms":[{"m":"m9","focus":""}],"evid":"","note":"","items":[{"id":"A1.2.2-01","name":"P&L Marketplace","text":"Brand bán qua gian hàng trên sàn: GMV (tổng giá trị đơn đặt) > trừ hủy/hoàn và Seller discount > NMV > trừ COGS > Gross margin > trừ phí sàn, media, vận hành > EBIT.\n• Từ COGS trở xuống, mọi dòng tính % trên NMV; COGS gắn với số hàng đã giao nên không đổi khi tăng hoặc giảm giá\n• Công cụ: máy tính P&L kênh marketplace (GMV đến EBIT) và thử thách tìm dòng dùng sai mẫu số","src":"Đã có","where":"Bản v1: A3 (P&L hai cách); module Lợi nhuận và P&L"},{"id":"A1.2.2-02","name":"P&L Trading term","text":"Brand bán cho Retail hoặc sàn: bắt đầu từ Sell-in (giá trị nhập hàng), trừ Front margin (chiết khấu trên hóa đơn) và Back margin (chiết khấu trả sau), trừ hỗ trợ khuyến mại cho người tiêu dùng và marketing; phần còn lại là phần Brand giữ lại.\n• Trading term: thỏa thuận giữa Brand và Retail hoặc sàn, quy định chiết khấu, hỗ trợ khuyến mại, marketing và điều kiện đi kèm","src":"Đã có","where":"Bản v1: A3 (P&L hai cách); module Lợi nhuận và P&L"},{"id":"A1.2.2-03","name":"GMV và NMV","text":"• GMV: tổng giá trị đơn đặt; NMV: giá trị thực nhận sau khi loại đơn hủy/hoàn và, tùy doanh nghiệp, giảm giá do seller tài trợ\n• Luôn ghi rõ cách tính NMV; mọi % ở các dòng dưới NMV phải dùng NMV làm mẫu số\n• Bảng đối chiếu: giá trị gốc là GMV rồi NMV (Marketplace) hoặc Sell-in (Retail)","src":"Đã có","where":"Bản v1: A3; module Giá và Doanh thu"},{"id":"A1.2.2-04","name":"CM2 và EBIT","text":"• CM2: lợi nhuận đóng góp sau mọi chi phí biến đổi gắn trực tiếp với đơn hàng (giá vốn, phí sàn, quảng cáo, voucher, thuế), trước chi phí cố định (kho, nhân sự). Cách đánh số CM khác nhau giữa các doanh nghiệp, luôn ghi rõ định nghĩa\n• EBIT: lợi nhuận trước lãi vay và thuế, sau khi trừ mọi chi phí vận hành và marketing","src":"Đã có","where":"Bản web v2: module Lợi nhuận và P&L"},{"id":"A1.2.2-05","name":"Front và back margin","text":"• Front margin: chiết khấu trả ngay trên hóa đơn, tính trên Sell-in\n• Back margin: chiết khấu trả sau, tính trên Sell-in sau một khoảng thời gian (chuyển khoản hoặc cấn trừ); không điều kiện (hỗ trợ cố định) hoặc có điều kiện (thưởng khi đạt cam kết doanh số hoặc mức nhập)\n• Bảng đối chiếu: phí kênh là Platform fee (Marketplace) so với Front và Back margin (Retail); kết quả cuối là EBIT so với phần còn lại sau toàn bộ term","src":"Đã có","where":"Bản v1: A3; module Lợi nhuận và P&L"}]}]}]},{"id":"A2","name":"OnPoint at a glance","ov":"Giới thiệu OnPoint là ai và hợp tác với Brand theo cách nào: sứ mệnh và quy mô, hành trình từ 2017 và bước mở rộng sang Đông Nam Á (CREA), công nhận từ các sàn, và các mô hình hợp tác (Service, Consignment, Distribution, SaaS).","groups":[{"id":"A2.1","name":"OnPoint là ai","ov":"Quy mô, định vị và hành trình mở rộng của OnPoint.","stage":"","note":"","topics":[{"id":"A2.1.1","name":"Fact sheet","ov":"Một trang tóm tắt OnPoint: sứ mệnh, định vị, quy mô, ngành hàng phục vụ, đối tác và lợi thế khác biệt. ⟦rv⟧Đây là nguồn duy nhất cho mọi con số quy mô; các topic khác dẫn về đây. Credential có nhiều con số mâu thuẫn nên mỗi số cần chốt kèm nguồn và ngày trước khi xuất bản (xem Số liệu chuẩn).⟦/rv⟧","src":"Cred","stage":"","where":"p.3, 4, 9, 13","terms":[],"evid":"","note":"Mọi con số quy mô lấy từ đây. ⟦rv⟧Xem sheet Cần chốt (số liệu mâu thuẫn trong credential).⟦/rv⟧","items":[{"id":"A2.1.1-01","name":"Sứ mệnh và định vị","text":"• Sứ mệnh: Make E-commerce easy và tạo giá trị bền vững cho Brand, Retailer và đối tác ⟦pr⟧(p.3, p.4)⟦/pr⟧\n• Định vị: No.1 end-to-end brand commerce business partner tại Đông Nam Á ⟦pr⟧(p.4)⟦/pr⟧; trang bìa ghi Super e-commerce enabler in Southeast Asia ⟦pr⟧(p.1)⟦/pr⟧⟦rv⟧; p.3 ghi No.1 tại Việt Nam⟦/rv⟧\n• Khẩu hiệu ở trang bìa: Make Commerce Awesome ⟦pr⟧(p.1)⟦/pr⟧\n⟦rv⟧Đã chọn định vị Đông Nam Á ⟦pr⟧(p.4)⟦/pr⟧ để hiển thị.⟦/rv⟧","src":"Cred","where":"Credential p.1, p.3, p.4"},{"id":"A2.1.1-02","name":"Quy mô (nhân sự, gian hàng, thương hiệu, giờ livestream)","text":"• Số năm hoạt động: 10 ⟦pr⟧(p.3, p.4)⟦/pr⟧\n• Thị trường: Việt Nam và Thái Lan ⟦pr⟧(p.3)⟦/pr⟧; CREA phục vụ Thái Lan, Malaysia, Singapore ⟦pr⟧(p.5)⟦/pr⟧\n• Nhân sự: +700 ⟦pr⟧(p.3)⟦/pr⟧⟦rv⟧; p.4 ghi +500⟦/rv⟧\n• Gian hàng: +400 ⟦pr⟧(p.3)⟦/pr⟧⟦rv⟧; p.4 ghi +300⟦/rv⟧\n• Thương hiệu: +300 ⟦pr⟧(p.3)⟦/pr⟧⟦rv⟧; p.2, p.4 và p.9 ghi 250+⟦/rv⟧\n• Giờ livestream mỗi tháng: +16,000 ⟦pr⟧(p.3, p.4)⟦/pr⟧⟦rv⟧; p.6 và p.7 ghi 8,000+ ở mốc 2023-2024⟦/rv⟧\n• Warehouse: +19 ⟦pr⟧(p.3, p.24)⟦/pr⟧\n⟦rv⟧Đã chọn bộ số của p.3 để hiển thị; các số khác chỉ để đối chiếu.⟦/rv⟧","src":"Cred","where":"Credential p.2-9, p.24"},{"id":"A2.1.1-03","name":"6 nhóm ngành hàng","text":"Sáu nhóm trên slide Strong investment ensures our comprehensive category coverage: Health & Beauty, FMCG, Mom & Baby, Fashion, Electronics, New category.⟦rv⟧ Tiêu đề slide: Serving 250+ top brands, continuous growth.⟦/rv⟧\n• Ví dụ thương hiệu hiển thị: L'Oréal, Nivea, Maybelline (H&B); Nestlé, Unilever, P&G (FMCG); Aptamil, Pampers, Huggies (Mom & Baby); adidas, FILA, Puma (Fashion); LG, Panasonic, Philips (Electronics); LEGO (New category)","src":"Cred","where":"Credential p.9"},{"id":"A2.1.1-04","name":"Đối tác chiến lược","text":"• Sàn và nền tảng: Shopee, TikTok Shop, Lazada, Tiki, Meta, Zalo, Sendo\n• Thanh toán: VNPAY, MoMo\n• Vận chuyển: GHN, Giaohangtietkiem, AhaMove, Lazada Logistics\nChương trình công nhận chi tiết ở A2.2.1.","src":"Cred","where":"Credential p.3, p.4"},{"id":"A2.1.1-05","name":"5 lợi thế khác biệt","text":"Slide What makes OnPoint unique ⟦pr⟧(p.13)⟦/pr⟧:\n• Expertise & Talent: chuyên gia có kinh nghiệm thương hiệu toàn cầu\n• Financial Stability: dòng tiền mạnh, hỗ trợ đầu tư\n• Comprehensive Solutions: giải pháp e-commerce end-to-end cho Brand\n• Robust Fulfillment Network: mạng fulfillment toàn quốc, giao hàng tin cậy\n• Strategic Partnerships: đối tác chiến lược với các sàn lớn","src":"Cred","where":"Credential p.13"}]},{"id":"A2.1.2","name":"Hành trình và mở rộng","ov":"Hành trình của OnPoint từ nhà enabler marketplace (2017) qua D2C, social commerce, omnichannel, shoppertainment, livestream đến AI application commerce, và bước mở rộng sang Đông Nam Á bằng việc mua lại CREA (cuối 2024).","src":"Cred","stage":"","where":"p.5, 6, 7","terms":[],"evid":"","note":"","items":[{"id":"A2.1.2-01","name":"Dòng thời gian 2017 đến AI commerce","text":"• 2017 Ecommerce marketplace: enabler số 1, đóng góp 60%-65% thị phần trong 100 thương hiệu; được Shopee và Lazada ghi nhận cao nhất ⟦pr⟧(p.6, p.7)⟦/pr⟧\n• 2019 D2C (brand.com): bắt đầu với Bosch, onboard 12 thương hiệu L'Oréal Group từ 3/2020 ⟦pr⟧(p.6, p.7)⟦/pr⟧\n• 2020 Social commerce: nhà enabler tiên phong; mốc 10/2020 ⟦pr⟧(p.7)⟦/pr⟧\n• 2021 Omnichannel: nhà enabler omnichannel đầu tiên; giải Innovation của LazMall trao cho Nestlé ⟦pr⟧(p.6, p.7)⟦/pr⟧\n• 2022 Shoppertainment: top end-to-end enabler trên TikTok Shop; 'Comprehensive Service Partner' và 'Outstanding Growth Service' (2022, 2023) ⟦pr⟧(p.6, p.7)⟦/pr⟧\n• 2023-2024 Livestream commerce: studio nội bộ⟦rv⟧ (+60 theo p.6; 50+ theo p.7)⟦/rv⟧, hơn 8000 giờ live mỗi tháng, livestream đóng góp thêm hơn 25% GMV trên tổng gian hàng của mỗi brand\n• AI application commerce: ra mắt AI short video, tăng hơn 30% GMV mỗi tháng từ nguồn AI video⟦rv⟧; mốc 2026 ⟦pr⟧(p.6)⟦/pr⟧ hoặc 2025 ⟦pr⟧(p.7)⟦/pr⟧⟦/rv⟧","src":"Cred","where":"Credential p.6, p.7"},{"id":"A2.1.2-02","name":"CREA và Đông Nam Á","text":"• OnPoint mua lại CREA để tăng hiện diện Đông Nam Á⟦rv⟧; dòng tiêu đề ghi 18/12/2024, ảnh lễ ký ghi 16/12/2024 ⟦pr⟧(p.5)⟦/pr⟧⟦/rv⟧\n• CREA là đối tác tin cậy của các thương hiệu hàng đầu ở Thái Lan, Malaysia, Singapore\n• Công nhận của CREA: Shopee Certified Enablers Program Premium (Thái Lan, từ 2021); Lazada 3-Star Certified (từ 2019); Lazada Partner of the Year 2021-22-23 (Star Enabler); TikTok Shop Partner Management Excellence (từ 2023)","src":"Cred","where":"Credential p.5"}]}]},{"id":"A2.2","name":"Niềm tin và hợp tác","ov":"Công nhận từ các sàn và các cách OnPoint hợp tác với một Brand.","stage":"","note":"","topics":[{"id":"A2.2.1","name":"Niềm tin và công nhận","ov":"Các chương trình công nhận của Shopee, TikTok Shop và Lazada dành cho OnPoint (2024-2025). Dùng làm bằng chứng bên thứ ba: ghi rõ chương trình, kỳ và đơn vị trao.","src":"Cred","stage":"","where":"p.5, 8","terms":[],"evid":"","note":"","items":[{"id":"A2.2.1-01","name":"Shopee Certified Enablers","text":"Shopee-Certified Enablers Program 2024-2025: hạng Premium ở các kỳ Q1, Q2, Q3 năm 2024 và Q2, Q3 năm 2025.","src":"Cred","where":"Credential p.8"},{"id":"A2.2.1-02","name":"Shopee Strategic Partner","text":"Shopee Strategic Partner Program 2025: vinh danh đối tác có ảnh hưởng tích cực về livestream (tháng 10/2025) và Top 1 nhà cung cấp dịch vụ có ảnh hưởng tích cực về livestream (tháng 9/2025).","src":"Cred","where":"Credential p.8"},{"id":"A2.2.1-03","name":"TikTok Shop Partner","text":"Top 1 TikTok Shop Partner:\n• Bảng xếp hạng TikTok Shop Partner 2024\n• Top 1 Vietnam TikTok Shop Partner of the Year (Vietnam Summit 2024)\n• Vinh danh H1 2025: TSP Kim cương xuất sắc\n• Chứng nhận 2025 TikTok Shop Certified Diamond Partner\n• Mốc trước đó: 'Comprehensive Service Partner' và 'Outstanding Growth Service' (2022, 2023; p.6, p.7)","src":"Cred","where":"Credential p.8, p.6, p.7"},{"id":"A2.2.1-04","name":"Lazada Partner","text":"Lazada-Certified Best Enablers Partner:\n• 2025 Vietnam Lazada Partner Overall Performance Award\n• Lazada Partners Certified OnPoint Việt Nam Q2/2025: Star Enabler\n• Mid-Year 2025 Lazada Elite Partner","src":"Cred","where":"Credential p.8"}]},{"id":"A2.2.2","name":"Mô hình hợp tác với Brand","ov":"Các cách OnPoint hợp tác với một Brand, từ chỉ cung cấp dịch vụ đến nắm tồn kho. Credential mô tả hai cách chia: ba mô hình lồng nhau (Service, Consignment, Distribution) ở p.10 và bốn mô hình hợp tác (Distributor, Consignment, Service, SaaS) ở p.4. Topic giải thích ai làm gì và ai giữ tồn kho ở từng mô hình.","src":"Cred","stage":"","where":"p.4, 10, 25","terms":[],"evid":"","note":"","items":[{"id":"A2.2.2-01","name":"Service","text":"Mô hình A: OnPoint cung cấp 7 dịch vụ: E-store management, Livestreaming, Affiliate & influencer management, Media ads, AI short videos, Business intelligence, CS/CX. Không gồm warehousing & fulfillment và inventory ownership (hai lớp thuộc mô hình B và C).","src":"Cred","where":"Credential p.10"},{"id":"A2.2.2-02","name":"Consignment","text":"Mô hình B: gồm 7 dịch vụ của Service model, thêm Warehousing & Fulfillment (dịch vụ số 8).","src":"Cred","where":"Credential p.10"},{"id":"A2.2.2-03","name":"Distribution","text":"Mô hình C: gồm toàn bộ dịch vụ của Consignment model, thêm Inventory Ownership (dịch vụ số 9), tức OnPoint nắm tồn kho.","src":"Cred","where":"Credential p.10"},{"id":"A2.2.2-04","name":"SaaS","text":"Bán công nghệ cho Brand hoặc seller tự vận hành: OctoPOS (Omni-channels order fulfillment SaaS), OPOLLO (build and run by OnPoint). Khách hàng phù hợp gồm MSME sellers, DIY operations cần eCom enablement SaaS. Chi tiết ở A3.6.3.","src":"Cred","where":"Credential p.4, p.25"},{"id":"A2.2.2-05","name":"9 lớp dịch vụ","text":"Chín dịch vụ theo thứ tự trên sơ đồ vòng tròn lồng nhau: 1 E-store management; 2 Livestreaming; 3 Affiliate & influencer management; 4 Media ads; 5 AI short videos; 6 Business intelligence; 7 CS/CX; 8 Warehousing & fulfillment; 9 Inventory ownership.","src":"Cred","where":"Credential p.10"},{"id":"A2.2.2-06","name":"Khách hàng lý tưởng theo từng mô hình","text":"Ba hồ sơ khách hàng lý tưởng (slide công nghệ, p.25):⟦rv⟧ Credential chưa ghi hồ sơ nào thuộc mô hình nào.⟦/rv⟧\n• Major brands thuê enabler vận hành trọn gói (store, media, CS, fulfilment, delivery)\n• Major brands thuê enabler (store, media, CS) và tận dụng năng lực phân phối offline sẵn có\n• MSME sellers, DIY operations dùng SaaS để quản lý mọi mặt của kinh doanh eCom\n⟦rv⟧Cần OnPoint xác nhận cách ánh xạ hồ sơ với 4 mô hình hợp tác.⟦/rv⟧","src":"Cred","where":"Credential p.25"}]}]}]},{"id":"A3","name":"OnPoint Capabilities (hành trình E2E, 6 chặng)","ov":"Năng lực của OnPoint kể theo hành trình E2E của Brand, 6 chặng: Plan, Set up và Run, Acquire, Deliver, Serve và Retain, Measure. Mỗi topic nói OnPoint làm gì, làm thế nào, bằng chứng nào (case, số liệu) và thuật ngữ dùng tại chỗ. Khớp với 5 trụ và 5 kết quả trong credential.","groups":[{"id":"A3.0","name":"Bản đồ (mở đầu)","ov":"Một trang bản đồ cho cả phần A3: 5 trụ, 5 kết quả, 10 dịch vụ năm 2026 và cách 5 trụ được kể lại thành 6 chặng.","stage":"Bản đồ (mở đầu)","note":"","topics":[{"id":"A3.0.1","name":"Bản đồ năng lực","ov":"Bản đồ cho cả phần A3: 5 trụ năng lực và 5 kết quả mà credential dùng, 10 dịch vụ năm 2026, và cách 5 trụ được kể lại thành 6 chặng hành trình. Người học nhận ra trụ trong credential, đồng thời đi theo thứ tự công việc của Brand.","src":"Cred","stage":"Bản đồ (mở đầu)","where":"p.11, 12, 17-25 (thanh tab 5 trụ)","terms":[],"evid":"","note":"Credential có 3 cách chia năng lực: 5 trụ ⟦pr⟧(p.12, 17-25)⟦/pr⟧, 10 dịch vụ 2026 ⟦pr⟧(p.11)⟦/pr⟧, 9 lớp Service/Consignment/Distribution ⟦pr⟧(p.10)⟦/pr⟧. Dùng 5 trụ làm xương sống; hai cách còn lại là lớp ánh xạ.","items":[{"id":"A3.0.1-01","name":"5 trụ","text":"• E-marketing: Media, Creative & Content Marketing\n• E-store set up & management: Key Account Management; Campaign & Merchandise Management\n• Logistics & Fulfillment: multi warehouses solution và multi last-mile solution\n• Technology & Business Intelligence: BI solution; Technology & Integration\n• Shopper engagement: Customer Service & Experience\nThanh tab trên các slide năng lực ⟦pr⟧(p.17-25)⟦/pr⟧ dùng 5 nhóm: E-Marketing Management, E-store Management, Shopper Engagement, Omni Channel Logistics & Fulfillment, Technology & Business Intelligence.","src":"Cred","where":"Credential p.12, p.17-25"},{"id":"A3.0.1-02","name":"5 kết quả","text":"• Shopper Acquisition (E-marketing)\n• Sales Revenue (E-store)\n• Operation Efficiency (Logistics & Fulfillment)\n• Technology Transformation (Technology & BI)\n• Shopper Loyalty (Shopper engagement)\nTất cả hướng tới Elevating Customer Lifetime Value.","src":"Cred","where":"Credential p.12"},{"id":"A3.0.1-03","name":"10 dịch vụ năm 2026","text":"Slide What we do in 2026 (tagline: Unify E-commerce and Total Marketing Together to Make Growth Truly Awesome):\n• Bên trái: E-Store Management; Logistic & Fulfillment; Platform as a Service; Customer Service/CX; Cross-border Ecommerce\n• Bên phải: Creative & Planning; Full Funnel Media; Influencer & Affiliate; End to end Livestreaming; Short Video Production\n• Ở giữa, 4 kênh: E-commerce, Social Commerce, D2C Brand.com, Omni Channel","src":"Cred","where":"Credential p.11"},{"id":"A3.0.1-04","name":"6 chặng và cách ánh xạ vào 5 trụ","text":"• Plan và Set up và Run cùng thuộc trụ E-store management (một trụ tách thành hai chặng)\n• Acquire = E-marketing; Deliver = Logistics & Fulfillment; Serve và Retain = Shopper engagement; Measure = Technology & BI\n• Topic cắt ngang: Livestream (chính Acquire, phụ Set up và Run); Live chat (chính Serve và Retain, phụ Acquire); BI (chính Measure, phụ cả 6 chặng)\nXem mô hình ở trang chủ.","src":"Cred","where":"Cách sắp xếp biên soạn từ Credential p.12"},{"id":"A3.0.1-05","name":"Measure là vòng phản hồi quay lại Plan","text":"Measure không phải điểm cuối: số liệu BI và đo hiệu quả khuyến mại quay lại làm đầu vào cho kế hoạch tài khoản và chiến dịch kế tiếp (Plan). Credential gắn 5 nhóm chỉ số với bước ACTION ⟦pr⟧(p.26)⟦/pr⟧.","src":"Cred","where":"Cách sắp xếp biên soạn từ Credential p.26"}]}]},{"id":"A3.1","name":"Plan: kế hoạch và tài khoản","ov":"Chặng đầu của hành trình. OnPoint tư vấn và cùng chịu trách nhiệm về chiến lược tài khoản (Key Account Management): căn chỉnh vai trò từng kênh, xác định building blocks, quản lý P&L tài khoản; chọn assortment, giá và khuyến mại khớp mục tiêu kênh; tận dụng danh mục nhiều Brand để co-brand. Trụ: E-store management. Kết quả: Sales revenue. ⟦pr⟧(p.17)⟦/pr⟧","stage":"Plan","note":"Trụ: E-store management. Kết quả: Sales revenue.","topics":[{"id":"A3.1.1","name":"Account và business planning","ov":"Cách OnPoint cùng Brand xây kế hoạch tài khoản: mục tiêu và vai trò của từng kênh online, các building blocks tăng trưởng và key actions đi kèm, P&L tài khoản, kế hoạch chung giữa Brand và sàn (JBP), và co-brand với các Brand khác trong danh mục khách hàng.","src":"Cred + Đã có","stage":"Plan","where":"p.17","terms":[{"m":"m2","focus":"JBP"},{"m":"morg","focus":"KAM, KAE, GBM"}],"evid":"","note":"","items":[{"id":"A3.1.1-01","name":"Căn chỉnh vai trò và mục tiêu từng kênh","text":"OnPoint tư vấn và cùng chịu trách nhiệm về chiến lược tài khoản: căn chỉnh mục tiêu và vai trò của từng kênh online. Mẫu Account strategic trên slide:\n• Goal: đưa thương hiệu thành số 1 trên mọi nền tảng\n• Tóm tắt tài khoản: giai đoạn TMĐT (strengthen), vai trò kênh TMĐT (sales và marketing), kênh (marketplace, social commerce), vai trò OnPoint (duy trì và tăng trưởng thương hiệu trên Ecom)","src":"Cred","where":"Credential p.17 (nội dung trong ảnh)"},{"id":"A3.1.1-02","name":"Building blocks và key actions","text":"Xác định building block và triển khai key actions để bám kế hoạch và tăng trưởng. Ba building block trong mẫu:\n• Tuyển shopper mới: tham gia mọi campaign trên Lazada, Tiki, Sendo; sampling, co-branding; tạo trial cho sản phẩm mới; tuyển qua social commerce và livestream\n• Tạo hứng khởi cho shopper bằng sản phẩm mới (NPD) và campaign theo mùa\n• Tăng AOV trên các kênh hiện có: dùng dịch vụ OnPoint cho bundling, quà tặng và sample, tối ưu chi phí, giải pháp O2O\nNền: E-commerce enabler, powered by data, build on shopper insights, enabled by technology.","src":"Cred","where":"Credential p.17 (nội dung trong ảnh)"},{"id":"A3.1.1-03","name":"Account P&L","text":"OnPoint quản lý P&L tài khoản (Manage account PnL). Cách đọc P&L theo kênh: Marketplace (từ GMV xuống EBIT) hoặc Trading term (từ Sell-in); xem A1.2.2.","src":"Cred + Đã có","where":"Credential p.17; Bản v1: A3"},{"id":"A3.1.1-04","name":"JBP","text":"Joint Business Plan: kế hoạch kinh doanh chung giữa nhãn hàng và sàn (cùng các đối tác liên quan) cho cả năm: mục tiêu, ngân sách, hoạt động, timeline.\n• bốn kế hoạch khóa vào nhau theo thứ tự: Commercial plan (mục tiêu và scheme khuyến mại), Performance MKT plan (ngân sách theo nguồn tăng trưởng, ROAS), Stock plan (DOI, PO, lead time), P&L plan (chi phí và EBIT)\n• Bốn kế hoạch cộng lại thành JBP: cùng một mục tiêu GMV hoặc NMV, cùng ngân sách, cùng lịch campaign","src":"Đã có","where":"Bản v1: B3.1; module Thương mại và Chiến dịch"},{"id":"A3.1.1-05","name":"Co-brand partnership","text":"Tận dụng danh mục nhiều Brand của OnPoint để chạy co-brand hiệu quả; dùng dữ liệu shopper insights rộng để đo hiệu quả. Ví dụ trên slide: chương trình Tiki Super Brand Day của La Roche-Posay (Ngày hội dược mỹ phẩm Pháp) với voucher và quà tặng.","src":"Cred","where":"Credential p.17 (nội dung trong ảnh)"}]},{"id":"A3.1.2","name":"Assortment, pricing và promotion","ov":"Ba quyết định thương mại nền cho tài khoản: chọn SKU nào và giao vai trò gì, đặt cấu trúc giá nào (không thấp hơn điểm hòa vốn), dùng cơ chế khuyến mại nào cho mục tiêu nào. OnPoint làm theo hướng shopper-centric: tính P&L đến cấp SKU, định giá động, khuyến mại linh hoạt và tối ưu liên tục.","src":"Cred + Đã có","stage":"Plan","where":"p.17","terms":[{"m":"m4","focus":""},{"m":"m2","focus":"cơ chế khuyến mại"}],"evid":"","note":"","items":[{"id":"A3.1.2-01","name":"Chọn SKU và vai trò SKU","text":"OnPoint chọn và phân khúc SKU, tính P&L đến cấp SKU ⟦pr⟧(p.17)⟦/pr⟧. Bốn vai trò SKU:\n• Kéo traffic: giá vào (entry price), chấp nhận biên mỏng\n• Tạo lợi nhuận: sản phẩm chủ lực, bảo vệ giá, tránh hết hàng\n• Tăng giá trị giỏ hàng: bán kèm, combo (basket builder)\n• Đổi mới và định vị: sản phẩm cao cấp hoặc phiên bản giới hạn\nKiểm soát hằng kỳ: giữ Must-Have SKU luôn có mặt (khoảng 20% SKU tạo khoảng 80% doanh số), theo dõi OSA, định kỳ delist SKU kém hiệu quả.","src":"Cred + Đã có","where":"Credential p.17; Bản v1: B2.2; module Assortment và SKU"},{"id":"A3.1.2-02","name":"Cấu trúc giá và giá hòa vốn","text":"• Cấu trúc giá 3 tầng: List Price (niêm yết, neo giá trị), Daily Price (thường ngày), Campaign Price (thấp nhất trong ngày sale lớn, vẫn phải trên điểm hòa vốn)\n• Giá bán = giá vốn + phí sàn + marketing + vận hành + thuế + rủi ro + lợi nhuận; khi chi phí tính theo % giá: giá = giá vốn / (1 trừ tổng % chi phí và lợi nhuận)\n• Công cụ: máy tính giá hòa vốn và thang giá","src":"Đã có","where":"Bản v1: B2.3; module Giá và Doanh thu; Credential p.17 (dynamic pricing)"},{"id":"A3.1.2-03","name":"Cơ chế khuyến mại theo mục tiêu (shopper mới, giỏ hàng, đơn đầu, đơn lặp lại)","text":"Slide ghép cơ chế khuyến mại (Direct Discount, Gifting, Voucher, Freeship) với mục tiêu:\n• Trên từng sản phẩm: tăng shopper mới\n• Trên giá trị đơn (ví dụ giảm thêm 10% khi mua hơn 2 sản phẩm): tăng quy mô giỏ hàng\n• Với đơn đầu: đẩy shopper mới\n• Với đơn lặp lại: chuyển shopper mới thành shopper trung thành\nBa lớp khuyến mại và ai trả tiền: Sàn (freeship, voucher sàn, xu), Shop (voucher theo dõi shop, voucher đơn, combo), Sản phẩm (giảm trực tiếp, GWP). Cộng gộp cả ba lớp làm chi phí dồn về Brand, nên đặt trần Promo Spend % và kiểm tra CM2 trước khi duyệt.","src":"Cred","where":"Credential p.17 (nội dung trong ảnh); Bản v1: B4.1"},{"id":"A3.1.2-04","name":"Tối ưu liên tục","text":"Always-on optimization: theo dõi và điều chỉnh SKU, giá và khuyến mại liên tục thay vì chỉ theo campaign; định giá động để giữ cạnh tranh; khuyến mại linh hoạt theo mục tiêu từng kênh.","src":"Cred","where":"Credential p.17"}]}]},{"id":"A3.2","name":"Set up và Run: cửa hàng và chiến dịch","ov":"Chặng đưa cửa hàng và chiến dịch vào vận hành: onboarding và vận hành gian hàng nhờ hiểu sàn và quan hệ đối tác, merchandising và setup khuyến mại để tối đa chuyển đổi, lập kế hoạch và quản lý campaign theo 4 pha. Trụ: E-store management. Kết quả: Sales revenue. ⟦pr⟧(p.18, p.19)⟦/pr⟧","stage":"Set up và Run","note":"Trụ: E-store management. Kết quả: Sales revenue.","topics":[{"id":"A3.2.1","name":"Store onboarding và operation","ov":"OnPoint tận dụng kiến thức và quan hệ với sàn để rút ngắn thời gian setup và nâng trải nghiệm vận hành: được ưu tiên duyệt đăng ký gian hàng, nắm vững tuân thủ quy định sàn để tối đa hóa hỗ trợ từ sàn, tham gia sớm các chương trình thí điểm.","src":"Cred","stage":"Set up và Run","where":"p.18","terms":[{"m":"mfin","focus":"POA, LOA"},{"m":"mplat","focus":""}],"evid":"","note":"","items":[{"id":"A3.2.1-01","name":"Ưu tiên duyệt đăng ký","text":"Được ưu tiên trong duyệt đăng ký gian hàng (get priority in store registration approval). Mục đích: rút ngắn thời gian setup.","src":"Cred","where":"Credential p.18"},{"id":"A3.2.1-02","name":"Tuân thủ quy định sàn","text":"Nắm vững tuân thủ của sàn (master seller platform compliance) để tối đa hóa hỗ trợ từ sàn.","src":"Cred","where":"Credential p.18"},{"id":"A3.2.1-03","name":"Tham gia pilot sớm","text":"Là bên đầu tiên tham gia các chương trình thí điểm của sàn (be the first to join platform pilot). ⟦rv⟧Credential chỉ nêu cam kết, chưa có ví dụ chương trình pilot cụ thể; cần OnPoint bổ sung.⟦/rv⟧","src":"Cred","where":"Credential p.18"}]},{"id":"A3.2.2","name":"Merchandising và promotion setup","ov":"Cách trình bày và cài đặt khuyến mại trên gian hàng theo ngành hàng và shopper để tối đa hóa chuyển đổi: sắp xếp base assortment, lập bản đồ vị trí hiển thị, cài voucher và đo redemption, thiết kế banner và landing page cho campaign.","src":"Cred + Đã có","stage":"Set up và Run","where":"p.18, 19","terms":[{"m":"m6","focus":""},{"m":"mplat","focus":""}],"evid":"","note":"","items":[{"id":"A3.2.2-01","name":"Base assortment","text":"Sắp xếp danh mục nền theo nhu cầu người mua (need-based assortments arrangement). Liên quan Must-Have SKU và Hero SKU ở A3.1.2.","src":"Cred","where":"Credential p.18"},{"id":"A3.2.2-02","name":"Visibility mapping","text":"Lập bản đồ vị trí hiển thị cho sản phẩm trên sàn. Các vị trí cần biết: Homepage, SRP (trang kết quả tìm kiếm), PDP (trang sản phẩm), Recommendation/Just for you, Livestream Slot, Category Page, Cart & Checkout.","src":"Cred","where":"Credential p.18; Bản web v2: module Vị trí hiển thị trên sàn"},{"id":"A3.2.2-03","name":"Voucher và redemption","text":"Slide Promotion Marketing - Voucher:\n• Mục đích dùng voucher: xây lòng trung thành (với dữ liệu shopper hiện có), thu hút sự chú ý vào sản phẩm cụ thể hoặc sản phẩm mới, kéo traffic đến một điểm bán, cross/up-sell\n• Redemption Rate Measurement: số voucher chuyển thành mua hàng so với số voucher đã phát; phân tích hành vi người tiêu dùng; báo cáo chi tiết hằng tuần\n⟦rv⟧• Lưu ý: cách tính này lấy mẫu số là số voucher phát hành, khác định nghĩa ở A3.6.2 (voucher đã dùng chia voucher đã lấy). Xem Cần chốt.⟦/rv⟧","src":"Cred + Đã có","where":"Credential p.18 (nội dung trong ảnh)"},{"id":"A3.2.2-04","name":"Banner và landing page","text":"Banner và landing page là một phần creative của campaign: ví dụ UniDry trên LazMall và Bobby (campaign mẹ và bé) với ưu đãi theo khung giờ, voucher, quà tặng và freeship. Chi tiết nhóm Creative & Design ở A3.3.2.","src":"Cred","where":"Credential p.19"}]},{"id":"A3.2.3","name":"Campaign planning và management","ov":"Cách OnPoint lập kế hoạch và chạy campaign: biết đang ở cấp ngày bán nào (BAU đến Mega Campaign), đi qua 4 pha Planning, Preparation, Conducting, Post-mortem, có Plan B, dùng checklist sẵn sàng trước khi chạy và báo cáo sau campaign để rút bài học. Mục tiêu campaign: tuyển shopper mới, tăng giữ chân, tăng doanh số và CLV.","src":"Cred + Đã có","stage":"Set up và Run","where":"p.18","terms":[{"m":"m2","focus":"cấp ngày bán"}],"evid":"","note":"","items":[{"id":"A3.2.3-01","name":"Các cấp ngày bán (BAU đến Mega)","text":"• BAU: ngày bán bình thường, làm mốc baseline\n• Mini-spike: chiến dịch nhỏ, ngắn ngày; Spike: chiến dịch lớn tạo đỉnh rõ rệt\n• Super Brand Day / Launching Day: ngày cao điểm riêng cho một thương hiệu hoặc lần ra mắt\n• Mega Campaign: các chiến dịch siêu lớn như 9.9, 11.11, 12.12; Flash Sale: giảm giá sốc trong thời gian giới hạn\nCấp livestream (BAU, Marathon, Mega) ở A3.3.3 là cách chia khác.","src":"Đã có","where":"Bản v1: B1.2; module Thương mại và Chiến dịch"},{"id":"A3.2.3-02","name":"4 pha: Planning, Preparation, Conducting, Post-mortem","text":"• Planning: xác định định hướng chiến lược và kế hoạch dựa trên mục tiêu bán hàng và chủ đề của brand/sàn\n• Preparation: tạo tài liệu và các công việc vận hành cho campaign\n• Conducting: theo dõi hiệu quả campaign so với kế hoạch, hành động khi cần\n• Post mortem: báo cáo kết quả, rút bài học và insight\nVòng đời Mega Campaign : đặt mục tiêu, thiết kế cơ chế, duyệt kế hoạch, chuẩn bị hàng và đăng ký (chốt tồn kho ít nhất 4 tuần trước), chạy (warm-up, D-1, D-Day), tổng kết.","src":"Cred","where":"Credential p.18; Bản v1: B1.2"},{"id":"A3.2.3-03","name":"Plan A/B","text":"Mẫu kế hoạch campaign trên slide có Plan A và Plan B (phương án dự phòng) cùng lịch theo ngày. ⟦rv⟧Credential chưa mô tả nội dung Plan B; cần ví dụ từ OnPoint.⟦/rv⟧","src":"Cred","where":"Credential p.18 (nội dung trong ảnh)"},{"id":"A3.2.3-04","name":"Checklist","text":"Checklist sẵn sàng Mega Campaign: 14 mục chia 5 nhóm.\n• Mục tiêu và kế hoạch (3): mục tiêu chính và KPI phụ; cấp ngày bán; baseline\n• Cơ chế và ngân sách (3): scheme; % khuyến mại trong trần và CM2 dương; luồng duyệt\n• Hàng hóa và vận hành (3): tồn kho chốt trước 4 tuần, DOI và lead time; tồn kho đệm cho Hero và Must-Have SKU; công suất đóng gói và SLA giao hàng\n• Traffic và nội dung (3): đăng ký deal đúng hạn; chia ngân sách theo nguồn tăng trưởng; nội dung và lịch booking creator\n• Theo dõi và học hỏi (2): bảng theo dõi theo giờ hoặc ngày; mẫu báo cáo sau campaign","src":"Đã có","where":"Bản v1: B1.3 (công cụ checklist)"},{"id":"A3.2.3-05","name":"Báo cáo sau campaign","text":"Post-mortem: báo cáo mức đạt so với mục tiêu, nguyên nhân và đề xuất cho campaign sau. Đọc kết quả bằng baseline, incremental, pull-forward, cannibalization (A3.6.2).\nVí dụ so với ngày thường trong credential: P&G Super Brand Day có GMV tăng 724% so với ngày thường ⟦pr⟧(p.49)⟦/pr⟧.","src":"Cred + Đã có","where":"Credential p.18, p.49; Bản v1: B1.2"}]}]},{"id":"A3.3","name":"Acquire: traffic và nội dung","ov":"Chặng kéo traffic và shopper mới: performance marketing, creative và content, livestream commerce, influencer/affiliate/MCN và AI short video. Đây là phần credential có nhiều bằng chứng nhất (case livestream, affiliate, AI video). Trụ: E-marketing. Kết quả: Shopper acquisition. ⟦pr⟧(p.20, p.21, p.30-56)⟦/pr⟧","stage":"Acquire","note":"Trụ: E-marketing. Kết quả: Shopper acquisition.","topics":[{"id":"A3.3.1","name":"Performance marketing","ov":"Giải pháp marketing hướng hiệu quả với mix kênh phù hợp và quy trình tối ưu để đạt mục tiêu kinh doanh: quảng cáo trên sàn, affiliate, marketing package, quảng cáo ngoài sàn. Tiêu đề slide: Shopper-centric advertising, maximizing ROAS with holistic optimization.","src":"Cred + Đã có","stage":"Acquire","where":"p.20","terms":[{"m":"m7","focus":""}],"evid":"","note":"","items":[{"id":"A3.3.1-01","name":"On-platform ads","text":"Quảng cáo ngay trên sàn (onsite) và affiliate marketing: Keyword Ads (theo từ khóa tìm kiếm), Display Ads (banner, homepage), Search Boosting.\n• Keyword Ads: giai đoạn cân nhắc và chuyển đổi, chỉ số Click, CR, ROAS\n• Display Ads: giai đoạn nhận biết, chỉ số Impression, CTR","src":"Cred","where":"Credential p.20; Bản v1: B2.4; module Nguồn doanh thu"},{"id":"A3.3.1-02","name":"Marketing package","text":"Mua gói marketing của sàn (marketing package buying). Trong P&L theo Trading term, dòng Marketing gồm package, Onsite Ads, Affiliate, Offsite.","src":"Cred","where":"Credential p.20; Bản v1: A3"},{"id":"A3.3.1-03","name":"Offsite ads (Facebook, Google, TikTok)","text":"Quảng cáo ngoài sàn kéo khách về sàn: Facebook, Google, TikTok. Offsite (CPAS) là một nguồn trong bộ phân bổ ngân sách media .","src":"Cred","where":"Credential p.20; Bản v1: B3.3"},{"id":"A3.3.1-04","name":"Chọn mix kênh","text":"Chọn công cụ theo giai đoạn phễu: Keyword Ads (cân nhắc, chuyển đổi); Display Ads (nhận biết); Flash Sale và Voucher (chuyển đổi); Livestream (tương tác, chuyển đổi); Affiliate (cân nhắc, chuyển đổi); Chat broadcast và Membership (giữ chân).\n• Nguồn doanh thu: Paid Ads, Livestream, Affiliate, Guided Revenue, Organic Revenue\n• Công cụ: bộ phân bổ ngân sách media (Onsite Ads, Affiliate, Offsite CPAS, Livestream Ads)","src":"Đã có","where":"Bản v1: B2.4, B3.3; module Nguồn doanh thu"},{"id":"A3.3.1-05","name":"ROAS và CIR","text":"• ROAS: doanh thu trên mỗi đồng quảng cáo; CIR = Ad spend / Revenue = 1 / ROAS\n• Nếu hoa hồng affiliate là chi phí duy nhất, hoa hồng 12,5% tương đương ROAS 8; thực tế còn phí dịch vụ hoặc booking nên ROAS quy đổi thấp hơn\n• Công cụ: bộ quy đổi ROAS, CIR và hoa hồng","src":"Đã có","where":"Bản v1: B3.3; module Hiệu quả và Chi phí marketing"}]},{"id":"A3.3.2","name":"Creative và content production","ov":"Thiết kế và nội dung để thu hút shopper, theo hướng dẫn của brand và sàn: creative và design (shop-in-shop, landing page, hero images, ads creative), content marketing (store concept, nội dung giáo dục sản phẩm, copy campaign) và production livestream và video.","src":"Cred","stage":"Acquire","where":"p.21","terms":[{"m":"m6","focus":"LDP"}],"evid":"","note":"","items":[{"id":"A3.3.2-01","name":"Creative và design","text":"Shop in Shop, landing page; hero images, trang sản phẩm; ads creative; thiết kế thu hút shopper và đúng hướng dẫn thương hiệu và sàn. Ví dụ trên slide: key visual Vichy trên Lazada.","src":"Cred","where":"Credential p.21"},{"id":"A3.3.2-02","name":"Content marketing","text":"Nội dung lấy shopper làm trung tâm để giáo dục, khuếch đại thương hiệu và ưu đãi, kích hoạt hành động: store concept và content; nội dung giáo dục sản phẩm; truyền thông campaign và copy quảng cáo.","src":"Cred","where":"Credential p.21"},{"id":"A3.3.2-03","name":"Production livestream và video","text":"Giải pháp livestream trọn gói A-Z: live đa kênh (Facebook, các sàn TMĐT), nội dung và tương tác shoppertainment. Chi tiết ở A3.3.3; video ngắn AI ở A3.3.5.","src":"Cred","where":"Credential p.21"}]},{"id":"A3.3.3","name":"Livestream commerce","ov":"Livestream là năng lực có nhiều bằng chứng nhất trong credential. Topic đi từ các loại livestream (BAU, Marathon, Mega) đến giải pháp trọn gói, vai trò trong một phiên live, studio và thiết kế phòng live, rồi shoppertainment; kèm 3 case (Cetaphil, Puma, Maybelline). OnPoint không chỉ cung cấp dịch vụ live mà cùng Brand xây Strategic Livestream Role Plan theo mục tiêu bán hàng và chiến lược kênh ⟦pr⟧(p.30)⟦/pr⟧.","src":"Cred + Đã có","stage":"Acquire","where":"p.30-35","terms":[],"evid":"• Cetaphil Super Brand Day ⟦pr⟧(p.36)⟦/pr⟧: ⟦rv⟧GMV 190M+ (đơn vị chưa ghi), 700+ đơn, 90M+ live views (cần xác minh so với đơn và CR), CR 2.2%; ⟦/rv⟧lượt xem gấp 5,6 lần, bình luận gấp 2,5 lần; hợp tác KOL affiliate\n• Puma marathon 10 ngày 21-30/4 ⟦pr⟧(p.37)⟦/pr⟧: GMV ~1.xB+, view ~150K+, đơn ~1.6K+, đạt 443% mục tiêu\n• Maybelline 23-25/9 ⟦pr⟧(p.38-39)⟦/pr⟧: so sánh studio 150 m2 và 50 m2","note":"Livestream vừa Acquire vừa Run: chặng chính Acquire, chặng phụ Set up và Run. Liên kết chéo, không nhân đôi nội dung.","items":[{"id":"A3.3.3-01","name":"Loại livestream (BAU, Marathon, Mega)","text":"• BAU: 2/4/6 giờ; hằng ngày; studio 15-20 m2; bộ thiết bị đầy đủ\n• Marathon: 12 giờ; hằng tháng; studio 20-30 m2\n• Mega: 24 giờ hoặc 36 giờ; hằng quý; studio 60-150 m2⟦rv⟧ ⟦pr⟧(p.34 ghi 70-200 m2)⟦/pr⟧⟦/rv⟧\nMega và Super Brand Day có KOL/KOC ⟦pr⟧(p.32)⟦/pr⟧.","src":"Cred","where":"Credential p.30, p.32, p.34"},{"id":"A3.3.3-02","name":"6 giải pháp trọn gói","text":"1 Content planning & writing; 2 Livestreamer recruiting (Host/KOL hợp sản phẩm và thương hiệu); 3 Creative production (hình ảnh live); 4 Technical production (studio đủ hạ tầng); 5 Consultation (khung giờ, tính cách host, hành vi người xem); 6 Media optimization (quảng cáo kéo traffic chất lượng, tăng hiển thị).","src":"Cred","where":"Credential p.31"},{"id":"A3.3.3-03","name":"Host, Coordinator, Technician","text":"Phiên BAU:\n• Technician: dựng âm thanh, ánh sáng trước phiên\n• Coordinator: hỗ trợ host, ghim sản phẩm theo kịch bản, seeding comment, chuẩn bị sample và voucher\n• Host: am hiểu, được đào tạo, tương tác với người xem và dẫn phiên đúng kỳ vọng của brand\n• Creative asset: kịch bản live, brief thiết kế, banner, USP, scheme, logo\nPhiên Mega: OnPoint dựng sản xuất end-to-end, quản lý toàn bộ vận hành, hỗ trợ quảng cáo và influencer, báo cáo hiệu quả sau campaign.","src":"Cred","where":"Credential p.33, p.34"},{"id":"A3.3.3-04","name":"Studio và thiết kế phòng live","text":"• Năng lực: 50+ studio nội bộ⟦rv⟧ (+60 theo p.6)⟦/rv⟧, tổng diện tích khoảng 1.500 m2, phòng nhỏ nhất 15 m2 đến lớn nhất hơn 60 m2, thiết bị chuyên nghiệp mới nhất ⟦pr⟧(p.32)⟦/pr⟧\n• Phòng live riêng ⟦pr⟧(p.35)⟦/pr⟧: màu sky blue chủ đạo kèm màu nhấn sáng, mô phỏng ánh sáng tự nhiên, khu trưng bày theo dòng sản phẩm, phần tử trong suốt tạo sức sống\n• Quy mô sản xuất Maybelline ⟦pr⟧(p.38)⟦/pr⟧: studio 150 m2 với ekip 50+ (chuyên nghiệp nhưng kém linh hoạt giờ live) so với studio 50 m2 với ekip 10+ (gọn, tiết kiệm, dễ nhân số phiên)","src":"Cred","where":"Credential p.32, p.35, p.38"},{"id":"A3.3.3-05","name":"Shoppertainment","text":"Bán hàng kết hợp giải trí: livestream nhiều kênh (Facebook, sàn TMĐT) với nội dung và tương tác.\n• Hành trình mua: Watch, Trust, Impulse, Buy (so với Search, Compare, Buy)\n• Một phiên live hiệu quả cần ba lớp: People (host, kịch bản), Process (deal độc quyền, tồn kho, Live Ads, seeding, ánh sáng và âm thanh), Performance (traffic, tương tác, chuyển đổi, doanh thu)","src":"Cred + Đã có","where":"Credential p.21; Bản v1: B3.2"}]},{"id":"A3.3.4","name":"Influencer, affiliate và MCN","ov":"Cách OnPoint giải bài toán tìm creator phù hợp cho Brand: đại diện Brand làm việc với creator và TikTok, đề xuất danh sách creator theo thương hiệu, thiết kế phương án linh hoạt (danh mục creator, mức giá, loại live). Mạng lưới 30+ MCN/agency và hơn 19,000 creator; hai mô hình hợp tác trên TikTok Shop: Targetplan và TAP.","src":"Cred + Đã có","stage":"Acquire","where":"p.43-47","terms":[],"evid":"• L'Oréal marathon livestream trên TikTok ⟦pr⟧(p.48)⟦/pr⟧: Top 1 ngành Health & Beauty trong ngày campaign; 11.295 đơn trong 7 ngày; GMV $176.000 (tăng 45%); follower 261.400 (tăng 5%); 72 creator; 15 giờ live mỗi ngày; 2.854 khách hàng; 60 thành phố; 7% shopper quay lại\n• P&G Supe
